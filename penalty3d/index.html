<style>

<script>
/* Пробная 3D-сцена пенальти и штрафного (three.js). Правила, параметры ссылки (?room, ?embed=1, ?fk=1) и связь с ботом —
   те же, что у 2D-сцены webapp/penalty: исход решает сервер, сцена только показывает.
   Запасной путь: нет WebGL, three.js не загрузился за ~9 секунд или телефон не тянет (мало кадров) — уходим на 2D-сцену. */
(function () {
  window.go2D = function (why) {
    if (window.__p3gone) return; window.__p3gone = 1;
    try { console.warn('3D → 2D:', why); } catch (e) {}
    const q = new URLSearchParams(location.search); q.delete('3d');
    const s = q.toString(), local = ['localhost', '127.0.0.1'].includes(location.hostname);
    location.replace((local ? '../penalty/' : '../') + (s ? '?' + s : ''));
  };
  let ok = false;
  try { const c = document.createElement('canvas'); ok = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) {}
  if (!ok) { go2D('нет WebGL'); return; }
  let waited = 0;
  (function watchdog() {                              // считаем только секунды, когда страница на экране
    if (window.__p3ok || window.__p3gone) return;
    if (!document.hidden && ++waited > 9) { go2D('долгая загрузка'); return; }
    setTimeout(watchdog, 1000);
  })();
})();
</script>
<script type="module">
let THREE;
try { THREE = await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js'); }
catch (e) {
  try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js'); }
  catch (e2) { go2D('three.js не загрузился'); throw e2; }
}

/* ---------------- общее с 2D-сценой ---------------- */
const AIMS = ['в левый верхний угол', 'под перекладину', 'в правый верхний угол',
              'в левый нижний угол', 'низом по центру', 'в правый нижний угол'];
const DIVES = ['прыгает влево', 'остаётся в центре', 'прыгает вправо'];
const FKA = ['через стенку в левый угол', 'через стенку в правый угол', 'под стенку в левый угол', 'под стенку в правый угол'];
const FKW = ['стенка стоит', 'стенка прыгает'];
const FKD = ['левый угол', 'центр', 'правый угол'];
const EMBED = new URLSearchParams(location.search).get('embed') === '1' && window.parent !== window;
const TG = !EMBED && window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 2.2);
const easeInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const smooth = (x, a, b) => easeInOut((x - a) / (b - a));
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function shade(hex, k) {

  const f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255);
  return '#' + [f(r), f(gg), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function gkShirt(team) {                               // вратарь — в форме другого цвета, не как его стенка
  const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
  const t = rgb(team);
  let best = '#22c55e', bd = -1;
  for (const c of ['#22c55e', '#f97316', '#a855f7', '#facc15', '#06b6d4']) {
    const d = rgb(c).reduce((s, v, i) => s + (v - t[i]) ** 2, 0); if (d > bd) { bd = d; best = c; }
  }
  return best;
}
const P = {
  kicker: {num: 9, name: 'Нападающий', stat: 'Удар 30', shirt: '#dc2626', shorts: '#f5f5f5'},
  keeper: {num: 1, name: 'Вратарь', stat: 'Вратарство 30', shirt: '#2563eb'},
};
const FK_INFO = {wall: [4, 5, 6, 3], shorts: '#f5f5f5', spot: 0};
const HAIRS = ['#2b1d16', '#6b4423', '#0f0f10', '#b7791f'];
const SKINS = ['#e3b08c', '#9a6544', '#f2c9a8', '#c48a62'];
let MODE = new URLSearchParams(location.search).get('fk') === '1' ? 'fk' : 'pen';
const isFk = () => MODE === 'fk';
let role = null, phase = 'intro', myPick = null, deadline = 0, chooseSec = 15, anim = null, fkWall = 0;
let excite = 0, shake = 0, flash = 0, punch = 0, glow = 0, events = {};
const msgEl = document.getElementById('msg'), btnEl = document.getElementById('buttons');
function fkSetup(info) {
  if (info) {
    if (Array.isArray(info.wall) && info.wall.length) FK_INFO.wall = info.wall.slice(0, 4);
    if (typeof info.shorts2 === 'string') FK_INFO.shorts = info.shorts2;
    if (typeof info.spot === 'number') FK_INFO.spot = clamp(info.spot, -1, 1);
  }
  if (scene) layout();
}

/* ---------------- звук (как в 2D) ---------------- */
let ac = null, muted = false, noise = null, amb = null, ambLevel = .045;
function audioOn() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(); amb = ac.createGain();
    s.buffer = noise; s.loop = true; f.type = 'lowpass'; f.frequency.value = 620; amb.gain.value = muted ? 0 : ambLevel;
    s.connect(f).connect(amb).connect(ac.destination); s.start(); }
  if (ac.state === 'suspended') ac.resume();
}
function setAmb(v, dur, back, backDur) {
  ambLevel = back === undefined ? v : back;
  if (!amb) return; const t = ac.currentTime, gn = amb.gain;
  gn.cancelScheduledValues(t); gn.setValueAtTime(gn.value, t); gn.linearRampToValueAtTime(muted ? 0 : v, t + dur);
  if (back !== undefined) gn.linearRampToValueAtTime(muted ? 0 : back, t + dur + backDur);
}
function out(v) { const q = ac.createGain(); q.gain.value = muted ? 0 : v; q.connect(ac.destination); return q; }
function hiss(type, freq, Q, v, len) {
  if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), q = out(0);
  s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = Q;
  q.gain.setValueAtTime(muted ? 0 : v, t); q.gain.exponentialRampToValueAtTime(.001, t + len);
  s.connect(f).connect(q); s.start(t, Math.random()); s.stop(t + len + .05);
}
const swish = () => hiss('highpass', 2400, .7, .3, .4);
const slap = () => hiss('bandpass', 1500, 1.1, .7, .08);
function clang() {
  if (!ac) return; const t = ac.currentTime;
  for (const [f, v, d] of [[523, .22, 1.2], [1187, .14, .8], [1962, .09, .5], [3110, .05, .3]]) {
    const o = ac.createOscillator(), q = out(0); o.frequency.value = f;
    q.gain.setValueAtTime(muted ? 0 : v, t); q.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(q); o.start(t); o.stop(t + d + .05);
  }
  thud(110, .5);
}
function whoosh() {
  if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), q = out(0);
  s.buffer = noise; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(2600, t + .35);
  q.gain.setValueAtTime(0, t); q.gain.linearRampToValueAtTime(muted ? 0 : .35, t + .08); q.gain.exponentialRampToValueAtTime(.001, t + .5);
  s.connect(f).connect(q); s.start(t); s.stop(t + .55);
}
function fansWhistle() {
  if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), q = out(0);
  s.buffer = noise; s.loop = true; f.type = 'bandpass'; f.frequency.value = 3100; f.Q.value = 9;
  q.gain.setValueAtTime(0, t); q.gain.linearRampToValueAtTime(muted ? 0 : .09, t + .5); q.gain.linearRampToValueAtTime(0, t + 1.3);
  s.connect(f).connect(q); s.start(t); s.stop(t + 1.4);
}
function whistle() {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), q = out(0);
  o.frequency.value = 2750; lfo.frequency.value = 38; lg.gain.value = 140; lfo.connect(lg).connect(o.frequency);
  q.gain.setValueAtTime(0, t); q.gain.linearRampToValueAtTime(muted ? 0 : .12, t + .03); q.gain.setValueAtTime(muted ? 0 : .12, t + .38);
  q.gain.linearRampToValueAtTime(0, t + .45); o.connect(q); o.start(t); lfo.start(t); o.stop(t + .5); lfo.stop(t + .5);
}
function thud(f0, v) {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), q = out(0);
  o.frequency.setValueAtTime(f0 || 140, t); o.frequency.exponentialRampToValueAtTime(45, t + .15);
  q.gain.setValueAtTime(muted ? 0 : (v || .7), t); q.gain.exponentialRampToValueAtTime(.001, t + .2); o.connect(q); o.start(t); o.stop(t + .25);
}
function crowd(kind) {
  if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), q = out(0);
  s.buffer = noise; s.loop = true; f.type = 'bandpass';
  f.frequency.value = kind === 'goal' ? 900 : kind === 'save' ? 450 : 320; f.Q.value = kind === 'goal' ? .6 : 1.4;
  const peak = muted ? 0 : (kind === 'goal' ? .55 : .35), len = kind === 'goal' ? 3 : 1.6;
  q.gain.setValueAtTime(0, t); q.gain.linearRampToValueAtTime(peak, t + .18); q.gain.exponentialRampToValueAtTime(.001, t + len);
  s.connect(f).connect(q); s.start(t); s.stop(t + len + .1);
}
document.getElementById('mute').onclick = () => {
  muted = !muted; document.getElementById('mute').textContent = muted ? '🔇' : '🔊'; audioOn(); setAmb(ambLevel, .05);
};
function haptic(kind) {
  if (EMBED) { toParent({type: 'haptic', kind}); return; }
  try { if (!TG || !TG.HapticFeedback) return;
    if (kind === 'tap') TG.HapticFeedback.impactOccurred('light');
    else if (kind === 'kick') TG.HapticFeedback.impactOccurred('heavy');
    else TG.HapticFeedback.notificationOccurred(kind); } catch (e) {}
}

/* ---------------- мир: метры; ворота на z = 0, x — вправо от камеры, y — вверх, камера со стороны +z ---------------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const GW = 7.32, GH = 2.44, HW = GW / 2, BR = .11, SPOT_Z = 11, FK_Z = 20.5, WALL_D = 9.15;
const NET_TOP = {y: 2.2, z: -1.2}, NET_BOT = -2.0;        // сетка: крыша уходит назад и чуть вниз, задняя стенка — к газону
const cv = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true, powerPreference: 'high-performance'}); }
catch (e) { go2D('WebGL не запустился'); throw e; }
cv.addEventListener('webglcontextlost', () => go2D('потерян WebGL'));
let tier = 2;                                             // 2 — полное качество, 1 — облегчённое (слабый телефон)
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

scene.fog = new THREE.Fog(0x060b1a, 80, 190);
const camera = new THREE.PerspectiveCamera(50, 1, .1, 400);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }

scene.background = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#02040c'); gr.addColorStop(.55, '#0a1430'); gr.addColorStop(1, '#16244a');

/* свет: два прожектора с крыши за воротами дают две тени к камере, мягкий общий свет и заполняющий со стороны камеры */
scene.add(new THREE.HemisphereLight(0x9db8ff, 0x16351f, .75));
const fill = new THREE.DirectionalLight(0xfff1dc, .55); fill.position.set(0, 30, 70); scene.add(fill);
const keys = [[-38, 46, -26, 2.1], [36, 44, -22, 1.6]].map(([x, y, z, k]) => {
  const l = new THREE.DirectionalLight(0xf3f6ff, k); l.position.set(x, y, z); l.target.position.set(0, 0, 10);
  l.castShadow = true; const s = l.shadow; s.mapSize.set(1024, 1024);
  Object.assign(s.camera, {left: -17, right: 17, top: 17, bottom: -17, near: 10, far: 130}); s.bias = -.0004; s.normalBias = .02;
  scene.add(l, l.target); return l;

function setTier(t) {
  tier = t;
  renderer.setPixelRatio(t === 2 ? Math.min(devicePixelRatio || 1, 2) : Math.min(devicePixelRatio || 1, 1.25));
  keys[1].castShadow = t === 2;
  crowdDensity(t === 2 ? 1 : .5);
  for (const l of keys) if (l.shadow.map && l.shadow.mapSize.x !== (t === 2 ? 1024 : 512)) { l.shadow.map.dispose(); l.shadow.map = null; }
  for (const l of keys) l.shadow.mapSize.set(t === 2 ? 1024 : 512, t === 2 ? 1024 : 512);
  fit();
}

/* склейка деталей в одну сетку с цветами вершин (люди, ступени трибун) */
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
function part(geo, color, pos, rot, scl) {                   // деталь: своя форма, цвет, место, поворот, масштаб
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  _m4.compose(V(...(pos || [0, 0, 0])), _q.setFromEuler(_e.set(...(rot || [0, 0, 0]))), V(...(scl || [1, 1, 1])));
  g.applyMatrix4(_m4);
  const c = new THREE.Color(color), n = g.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));

function mergeParts(parts) {
  let n = 0; for (const p of parts) n += p.attributes.position.count;

  // след мяча при сильном ударе
  if (b.fly && pl && pl.tech === 'power') { hist.unshift(b.p.clone()); if (hist.length > trailN) hist.pop(); } else if (hist.length) hist.pop();
  const tp = trailGeo.attributes.position, tc = trailGeo.attributes.color;
  for (let i = 0; i < trailN; i++) { const h = hist[i]; if (h) { tp.setXYZ(i, h.x, h.y, h.z); const k = (1 - i / trailN) * .5; tc.setXYZW(i, k, k, k, k); } else tc.setXYZW(i, 0, 0, 0, 0); }
  tp.needsUpdate = tc.needsUpdate = true;
  // каркас дрожит после удара в штангу
  for (const k in posts) posts[k].position.x = posts[k].userData.x0 ?? (posts[k].userData.x0 = posts[k].position.x);
  if (a && pl.hit && at > pl.R) { const s = Math.sin((at - pl.R) * 80) * .02 * Math.exp(-(at - pl.R) * 5); posts[pl.hit].position.x += s; posts.b.position.y = GH + .06 + (pl.hit === 'b' ? s : 0); }
  // трибуны, вспышки, файеры, щиты
  for (const s of stands) s.g.position.y = excite > 0 ? Math.abs(Math.sin(t * 9 + s.ph)) * .35 * excite : 0;
  const fc = flashGeo.attributes.color, rate = a && at > pl.K - .05 ? (at < pl.R + .2 ? .05 : a.outcome === 'goal' && at < pl.R + 2.5 ? .07 : .01) + excite * .05 : .002;
  for (let i = 0; i < flashN; i++) { const on = Math.random() < rate ? 1 : 0; fc.setXYZW(i, on, on, on, on); }
  fc.needsUpdate = true;
  for (const f of flares) { f.t = Math.max(0, f.t - dt); f.s.material.opacity = f.t > 0 ? Math.min(1, f.t) * (.6 + .4 * Math.random()) : 0; }
  boardMat.map.offset.x = (t * .06) % 1;
  if (!a && boardMat.map !== BOARD_N) boardMat.map = BOARD_N;
  stepFx(dt);
  updateMarkers(t);
  // камера
  const c = camAt(at, a, t);
  camera.position.copy(c.pos);
  if (shake) camera.position.add(V((Math.random() - .5) * shake * .012, (Math.random() - .5) * shake * .012, 0));
  camera.fov = c.fov * (1 - .06 * punch); camera.updateProjectionMatrix(); camera.lookAt(c.look);
  // экран
  const [r, gg, bb] = hexRgb(P.kicker.shirt);
  $('glow').style.opacity = glow ? (glow * (.65 + .35 * Math.sin(t * 9))).toFixed(3) : '0';
  if (glow) $('glow').style.boxShadow = `inset 0 0 ${Math.round(innerWidth * .25)}px rgba(${r},${gg},${bb},.9)`;
  $('flash').style.opacity = (flash * .35).toFixed(3);
  const lb = a ? smooth(at, pl.K - .3, pl.K - .05) * (1 - smooth(at, pl.R + .5, pl.R + .95)) : 0;
  $('lb1').style.height = $('lb2').style.height = (7.5 * lb).toFixed(2) + 'vh';
  updateHud(at, a);
  renderer.render(scene, camera);
  if (phase === 'choose' && performance.now() > deadline) {
    if (live || EMBED) { phase = 'wait'; setUi('Время вышло — сторону выберет случай. Ждём исход…'); }
    else pick(isFk() ? (role === 'kick' ? Math.floor(Math.random() * 4) : fkWall * 3 + Math.floor(Math.random() * 3))
                     : Math.floor(Math.random() * (role === 'kick' ? 6 : 3)), true);
  }
}
function hexRgb(h) { const n = parseInt(String(h).slice(1), 16) || 0; return [n >> 16, n >> 8 & 255, n & 255]; }
function fit() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / Math.max(1, innerHeight); camera.updateProjectionMatrix();
}

/* проверка скорости: первые кадры — компиляция, дальше меряем; медленно — облегчаем, всё равно медленно — 2D */
let benchN = 0, benchSum = 0, benchDone = false;
function bench(ms) {
  if (benchDone || document.hidden) return;
  if (++benchN <= 12) return;
  benchSum += ms;
  if (benchN < 12 + 36) return;
  const avg = benchSum / 36;
  if (avg > 42 && tier === 2) { setTier(1); benchN = 0; benchSum = 0; return; }
  if (avg > 55) { go2D('мало кадров: ' + Math.round(1000 / avg) + ' в секунду'); benchDone = true; return; }
  benchDone = true; ready();
}

/* ---------------- управление: касание → луч в плоскость ворот ---------------- */
const ray = new THREE.Raycaster(), goalPlane = new THREE.Plane(V(0, 0, 1), 0);
function goalHit(e) {
  const r = cv.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  return ray.ray.intersectPlane(goalPlane, V(0, 0, 0));
}
function screenOf(p) { const v = p.clone().project(camera); return {x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight}; }
cv.addEventListener('pointerdown', e => {
  audioOn();
  if (phase !== 'choose') return;
  const h = goalHit(e);
  const colOf = x => clamp(Math.floor((x + HW) / (GW / 3)), 0, 2);
  if (isFk()) {
    if (role === 'kick') {
      if (!h) return;
      let best = -1, bd = 1.7;
      for (let z = 0; z < 4; z++) { const T = FKT(z), d = Math.hypot(h.x - T.x, h.y - T.y); if (d < bd) { bd = d; best = z; } }
      if (best >= 0) pick(best);
      return;
    }
    const ps = L.men.flatMap(m => [screenOf(m.clone().setY(0)), screenOf(m.clone().setY(2.7))]);
    const x0 = Math.min(...ps.map(p => p.x)) - 30, x1 = Math.max(...ps.map(p => p.x)) + 30, y0 = Math.min(...ps.map(p => p.y)) - 30, y1 = Math.max(...ps.map(p => p.y)) + 25;
    if (e.clientX > x0 && e.clientX < x1 && e.clientY > y0 && e.clientY < y1) {
      fkWall = 1 - fkWall; haptic('tap');
      setUi(fkWall ? 'Стенка прыгнет — ловит удар верхом, но низом мяч проскочит. Теперь коснитесь угла для вратаря.'
                   : 'Стенка стоит — ловит удар низом, но верхом мяч перелетит. Теперь коснитесь угла для вратаря.');
      return;
    }
    if (!h || h.x < -HW - 1.2 || h.x > HW + 1.2 || h.y < -.6 || h.y > GH + 1.4) return;
    pick(fkWall * 3 + colOf(h.x));
    return;
  }
  if (!h) return;
  if (role === 'kick') {
    if (h.x < -HW - 1 || h.x > HW + 1 || h.y < -.8 || h.y > GH + 1.2) return;
    pick((h.y > GH / 2 ? 0 : 3) + colOf(h.x));
  } else {
    if (e.clientY > innerHeight * .72) return;
    pick(colOf(h.x));
  }
});

/* ---------------- логика выбора и связи — как в 2D ---------------- */
function setUi(text, buttons) {
  msgEl.textContent = text; btnEl.innerHTML = '';
  for (const [label, cls, fn] of buttons || []) { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.onclick = () => { audioOn(); fn(); }; btnEl.appendChild(b); }
}
const pickWords = v => isFk() ? (role === 'kick' ? `удар ${v + 1} — ${FKA[v]}` : `${FKW[Math.floor(v / 3)]}, вратарь — ${FKD[v % 3]}`)
  : role === 'kick' ? `угол ${v + 1} (${AIMS[v]})` : DIVES[v].replace('прыгает', 'прыгнуть').replace('остаётся', 'остаться');
function pick(v, auto) {
  if (phase !== 'choose') return;
  myPick = v; phase = 'wait'; haptic('tap');
  if (EMBED) { toParent({type: 'pick', value: v}); setUi(`Ваш выбор: ${pickWords(v)}. Отправляем…`); return; }
  if (live) { live.send(JSON.stringify({type: 'pick', value: v})); setUi(`Ваш выбор: ${pickWords(v)}. Отправляем…`); return; }
  setUi((auto ? 'Время вышло — выбрано случайно: ' : 'Ваш выбор: ') + pickWords(v) + '. Ждём соперника…');
  demoOpponent(v);
}
const Q = new URLSearchParams(location.search);
const ROOM = Q.get('room');
const DUEL_WS = 'wss://football-duel.pinkovskyi2508.workers.dev';
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const WS_BASE = LOCAL && Q.get('ws') ? Q.get('ws') : DUEL_WS;
const INIT = (TG && TG.initData) || (LOCAL ? Q.get('init') || '' : '');
let live = null;
function liveConnect() {
  if (!WS_BASE) { setUi('Сервер пенальти не настроен — выберите кнопкой в чате.', closeBtn()); return; }
  setUi('Подключаемся к матчу…');
  const ws = live = new WebSocket(WS_BASE.replace(/^http/, 'ws') + '/rooms/' + encodeURIComponent(ROOM) + '/player');
  ws.onopen = () => ws.send(JSON.stringify({type: 'hello', initData: INIT}));
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onLive(m); };
  ws.onclose = e => {
    if (phase === 'play' || phase === 'done') return;
    setUi(e.code === 4003 ? 'Это пенальти не для вас.' : 'Связь с матчем потеряна — выберите кнопкой в чате.', closeBtn());
  };
}
function onLive(m) {
  if (m.type === 'state') {
    Object.assign(P.kicker, m.kicker || {}); Object.assign(P.keeper, m.keeper || {});
    MODE = m.kind === 'fk' ? 'fk' : 'pen'; fkSetup(isFk() ? m : null); layout();
    start(m.role, m.left);
    if (m.picked !== null && m.picked !== undefined) markPicked(m.picked);
  } else if (m.type === 'picked') markPicked(m.value);
  else if (m.type === 'result') play(m);
  else if (m.type === 'bot_left' && phase !== 'play' && phase !== 'done') setUi('Матч прервал связь — выберите кнопкой в чате.', closeBtn());
}
function markPicked(v) {
  if (phase === 'play' || phase === 'done') return;
  myPick = v; phase = 'wait';
  setUi(`Ваш выбор: ${pickWords(v)}. Ждём соперника…`);
}
function closeBtn() { return TG ? [['Закрыть', '', () => TG.close()]] : []; }
function demoOpponent(mine) {
  if (isFk()) { setTimeout(() => demoFk(mine), 500 + Math.random() * 900); return; }
  setTimeout(() => {
    const aim = role === 'kick' ? mine : Math.floor(Math.random() * 6);
    const dive = role === 'keep' ? mine : Math.floor(Math.random() * 3);
    const high = aim < 3, guessed = aim % 3 === dive;
    let outcome;
    if (Math.random() < (high ? .2 : .07)) outcome = 'miss';
    else if (guessed && Math.random() < (high ? .38 : .62)) outcome = 'save';
    else outcome = 'goal';
    const text = outcome === 'goal' ? (guessed ? 'Вратарь угадал, но не дотянулся' : dive === 1 ? 'Вратарь остался в центре' : 'Вратарь прыгнул в другую сторону')
               : outcome === 'save' ? 'Вратарь угадал угол!' : (high ? 'Выше перекладины!' : 'Мимо, рядом со штангой!');
    play({aim, dive, outcome, text});
  }, 500 + Math.random() * 900);
}
function demoFk(mine) {                                // те же правила, что у бота (app/engine.py FK_DUEL), без характеристик
  const fk = role === 'kick' ? mine : Math.floor(Math.random() * 4), dv = role === 'keep' ? mine : Math.floor(Math.random() * 6);
  const wall = Math.floor(dv / 3), dive = dv % 3, over = fk < 2, col = fk % 2 ? 2 : 0;
  const block = over ? (wall ? .62 : .2) : (wall ? .14 : .68);
  let outcome;
  if (Math.random() < block) outcome = 'block';
  else if (Math.random() < (over ? .44 : .42)) outcome = 'miss';
  else if (Math.random() < (dive === col ? .55 : dive === 1 ? .25 : 0)) outcome = 'save';
  else outcome = 'goal';
  const text = {block: 'Стенка блокирует!', miss: over ? 'Над перекладиной!' : 'Мимо, рядом со штангой!',
                save: dive === col ? 'Вратарь достаёт из угла!' : 'Вратарь успевает из центра!'}[outcome]
             || (dive === col ? 'Вратарь угадал, но не дотянулся' : dive === 1 ? 'Вратарь не дотянулся из центра' : 'Вратарь ушёл не в тот угол');
  play({fk, wall, dive, outcome, text});
}
function play(result) {
  phase = 'play'; events = {}; hist.length = 0;
  if (isFk() && result.fk !== undefined) {
    anim = Object.assign({t0: performance.now()}, result, {aim: (result.fk < 2 ? 0 : 3) + (result.fk % 2 ? 2 : 0), fkWall: result.wall});
    anim.plan = finishPlan(makeFkPlan(anim));
  } else { anim = Object.assign({t0: performance.now()}, result); anim.plan = finishPlan(makePlan(anim)); }
  anim.t0 = performance.now();                                 // разбор исхода позирует фигуры — время сцены считаем после него
  setUi('');
}
let dbgReal = null;                                            // для проверки: остановить сцену на нужной секунде (?3d — скриншоты)
window.__p3debug = {play: r => play(r), freeze: s => { dbgReal = s; }, get anim() { return anim; }, start: r => start(r), get scene() { return scene; }, get keeper() { return keeper; }, THREE, get cam() { return [camera.position, ball.position, kicker.root.position]; }};
function finish() {
  phase = 'done';
  if (EMBED) { setUi(''); toParent({type: 'done'}); return; }
  if (live) { setUi('Матч продолжается в чате.', closeBtn()); return; }
  setUi('Демо-режим: соперник выбирал случайно.', [['Ещё раз', '', () => start(role)], ['Сменить роль', 'alt', () => start(role === 'kick' ? 'keep' : 'kick')],
                                                     [isFk() ? '🥅 Пенальти' : '🎯 Штрафной', 'alt', () => { MODE = isFk() ? 'pen' : 'fk'; fkSetup(); start(role); }]]);
}
function start(r, left) {
  role = r; phase = 'choose'; myPick = null; anim = null; fkWall = 0; events = {};
  for (const k in FX) FX[k].list.length = 0;
  layout(); hudCards();
  if (left !== undefined) chooseSec = Math.max(1, left);
  deadline = performance.now() + chooseSec * 1000;
  if (isFk()) setUi(r === 'kick' ? 'Коснитесь удара: через стенку (прыгнувшая стенка часто ловит) или под стенку (пройдёт, если стенка прыгнет).'
                                 : 'Коснитесь стенки — стоит или прыгает. Потом коснитесь угла, куда сместится вратарь.');
  else setUi(r === 'kick' ? 'Коснитесь угла ворот, куда бить. Верх — вратарю труднее, но легче промахнуться.'
                          : 'Коснитесь стороны ворот, куда прыгнуть. Угадаете — шанс отбить.');
}
function toParent(m) { try { window.parent.postMessage(m, location.origin); } catch (e) {} }
function ready() {                                             // сцена тянет — показываем и подключаемся
  window.__p3ok = 1; $('load').style.display = 'none';
  if (EMBED) {
    $('mute').style.display = 'none';
    addEventListener('message', e => {
      if (e.source !== window.parent || e.origin !== location.origin || !e.data) return;
      const m = e.data;
      if (m.type === 'mute') { muted = !!m.on; setAmb(ambLevel, .05); }
      else if (m.type === 'note') { if (phase === 'wait') { phase = 'choose'; myPick = null; } setUi(m.text || ''); }
      else onLive(m);
    });
    setUi(''); toParent({type: 'ready'});
  } else if (ROOM) liveConnect();
  else if (isFk()) setUi('Штрафной — демо. Кем будете?', [['🎯 Бить', '', () => start('kick')], ['🧱 Стенка и вратарь', 'alt', () => start('keep')]]);
  else setUi('Пенальти — демо. Кем будете?', [['⚽ Бить', '', () => start('kick')], ['🧤 Стоять в воротах', 'alt', () => start('keep')]]);
}

addEventListener('resize', fit); fit();
layout(); hudCards();
requestAnimationFrame(frame);
if (TG) { try { TG.ready(); TG.expand(); TG.disableVerticalSwipes && TG.disableVerticalSwipes();
  TG.setHeaderColor && TG.setHeaderColor('#02050f'); TG.setBackgroundColor && TG.setBackgroundColor('#02050f'); } catch (e) {} }
