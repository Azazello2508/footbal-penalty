<!doctype html>
<html lang="ru" data-theme="club">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Футбольный менеджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@1,700;1,800&amp;subset=cyrillic&amp;display=swap">
<style>
:root{--bg:#0b1220;--card:#131c31;--card2:#1b2742;--line:#26344f;--text:#e8eefc;--muted:#93a3c3;--accent:#facc15;
  --ok:#22c55e;--bad:#f87171;--pitch:#166534;--pitch2:#15803d;
  /* тёмное оформление (как раньше): цвета, которые раньше были прописаны в правилах */
  --panel:#0f172a;--on-acc:#111;--acc-soft:rgba(250,204,21,.12);--acc-soft1:rgba(250,204,21,.1);--acc-soft2:rgba(250,204,21,.08);--acc-text:#fde68a;
  --warnl:#a16207;--warnt:#fde68a;--warnbg:#422006;--needbg:#1f1a0b;--sbtn:rgba(255,255,255,.12);--veil:rgba(2,6,23,.6);--shadow:rgba(0,0,0,.5);
  --okt:#86efac;--okt2:#4ade80;--badt:#fca5a5;--badt2:#fecaca;--strong:#fff;--bar0:#334155;
  --okbg:#166534;--okfg:#dcfce7;--nobg:#3f1d1d;--nofg:#fecaca;--wonbg:#14532d;--lostbg:#7f1d1d;--drawbg:#374151;--place2bg:#14532d;
  --skyt:#7dd3fc;--viot:#c4b5fd;--shclosed:linear-gradient(135deg,#1e293b,#312e81);--shclosedb:#4338ca;
  --promo-bg:linear-gradient(135deg,#2a1d05,#1b2742 60%,#2a1645);--croff:linear-gradient(135deg,#3b2a05,#6b4e0a);--crofft:#fde68a;
  --ktryb:rgba(255,255,255,.18);--ktrybg:rgba(255,255,255,.06);--swatch:rgba(255,255,255,.35);--tglow:0 0 0 4px rgba(250,204,21,.22),0 0 18px rgba(250,204,21,.35);
  --sport:"Roboto Condensed",Bahnschrift,"Arial Narrow",sans-serif}      /* узкий спортивный шрифт: на телефонах своего нет — грузим с Google Fonts */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{padding:calc(10px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
#club{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card2);white-space:nowrap}
#status.ok{background:rgba(34,197,94,.18);color:var(--okt)}
#status.bad{background:rgba(248,113,113,.16);color:var(--badt2)}
.banner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;margin:8px 0;color:var(--muted)}
.banner.warn{border-color:var(--warnl);color:var(--warnt)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.chip b{display:block;font-size:16px}
.chip span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.chip.on{border-color:var(--accent);background:var(--acc-soft)}
.chip.on span{color:var(--acc-text)}
#pitch{position:relative;border-radius:16px;padding:12px 6px;background:repeating-linear-gradient(180deg,var(--pitch) 0 44px,var(--pitch2) 44px 88px);
  border:2px solid rgba(255,255,255,.55);display:flex;flex-direction:column;gap:12px;overflow:hidden}
#pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.4)}
#pitch:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid rgba(255,255,255,.4);border-radius:50%}
.line{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:4px;min-height:74px}
.line .tag{position:absolute;left:6px;top:-2px;font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.05em}
.pl{display:flex;flex-direction:column;align-items:center;width:84px;padding:2px;border-radius:12px;background:transparent}
.pl .shirt{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  background:#f8fafc;color:#0f172a;box-shadow:0 3px 8px rgba(0,0,0,.4);border:3px solid #fff}
.pl.gk .shirt{background:#fb923c;border-color:#fed7aa}
.pl .nm{margin-top:5px;font-size:12px;line-height:1.15;max-width:84px;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.8)}
.pl .nm .n{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pl .rtl{margin-top:2px;line-height:0}
.pl .bd{position:absolute;right:-8px;top:-8px;font-size:13px;line-height:1}
.pl .warn{position:absolute;left:-8px;top:-8px;font-size:13px}
/* сила на позиции (1–99, сервер: player_stats.position_power) — плашка у кружка; оценка за последние матчи
   (сервер: player_stats.recent_ratings) — мелко рядом с именем, цветом по уровню */
.pw{position:absolute;right:-15px;bottom:-6px;min-width:24px;padding:1px 4px;border-radius:7px;font-size:12px;font-weight:800;line-height:15px;
  text-align:center;font-family:system-ui,"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc;border:1.5px solid #f8fafc;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.rt{display:inline-block;flex:none;min-width:22px;padding:0 3px;border-radius:5px;font-size:10px;font-weight:700;line-height:13px;text-align:center;
  font-family:system-ui,"Segoe UI",sans-serif;background:#475569;color:#e2e8f0;text-shadow:none}
.rt.r1{background:#dc2626;color:#fff}.rt.r2{background:#f59e0b;color:#1c1300}.rt.r3{background:#22c55e;color:#052e16}.rt.r4{background:#2563eb;color:#fff}
.sh-top .rt,.sh-top .pwl{font-size:13px;line-height:17px;padding:1px 6px;vertical-align:1px;border-radius:6px}
.sh-top .pwl{display:inline-block;font-weight:800;background:#0f172a;color:#f8fafc;border:1px solid var(--line)}
.big.swapbtn{background:var(--ok);color:#052e16;margin:10px 0 2px}
.big.swapbtn:disabled{opacity:.45;cursor:default}
.pl.sel .shirt{outline:3px solid var(--accent);outline-offset:2px}
.swapping .pl .shirt{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#bench{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
#bench .pl{width:auto}
#bench .pl .nm{text-shadow:none}
#swapbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--warnbg);color:var(--warnt);
  border:1px solid var(--warnl);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px}
#swapbar button{background:var(--sbtn);padding:6px 10px;border-radius:9px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
/* карточка игрока */
#veil{position:fixed;inset:0;background:var(--veil);z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:var(--sheet-h,88vh);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet .in{max-width:520px;margin:0 auto}
.sh-top{display:flex;align-items:flex-start;gap:10px}
.sh-top h2{margin:0;font-size:19px;flex:1}
.sh-top small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:3px}
.x{background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.st{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.st .t{font-size:14px}
.st .t b{font-size:16px;margin-left:4px}
.st .barw{grid-column:1/-1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.st .bar{height:100%;background:var(--accent)}
.st .btns{display:flex;gap:4px}
.st .btns button{width:40px;height:34px;border-radius:9px;background:var(--card2);font-weight:700;font-size:14px}
.st .btns button:disabled{opacity:.3}
#left{margin:10px 0;font-size:15px;text-align:center}
#left.ok{color:var(--okt)}
.big{display:block;width:100%;padding:13px;border-radius:13px;font-weight:700;font-size:16px;background:var(--accent);color:var(--on-acc);margin-top:6px}
.big:disabled{background:var(--card2);color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.acts button{background:var(--card2);padding:11px 8px;border-radius:12px;font-size:14px;text-align:center}
.acts button.on{outline:2px solid var(--accent)}
.tal{display:block;width:100%;text-align:left;background:var(--card2);padding:10px 12px;border-radius:12px;margin-top:6px;font-size:14px}
.tal span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tal.on{outline:2px solid var(--accent)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;max-width:90vw;
  background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:12px;font-size:14px;
  box-shadow:0 8px 24px var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#toast.bad{border-color:#b91c1c;color:var(--badt2)}
#conn{text-align:center;color:var(--muted);font-size:14px;margin:40px 0}
/* вкладки игры */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav button{background:transparent;padding:4px 0;border-radius:10px;color:var(--muted);font-size:10.5px;position:relative;white-space:nowrap;min-width:0}
#nav .nl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}      /* узкий экран: подпись не налезает на соседнюю */
#nav button i{display:block;font-style:normal;font-size:21px;line-height:1.2}
#nav button.on{color:var(--accent);background:var(--acc-soft2)}
#nav .dot{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:#dc2626;color:#fff;
  font-size:11px;line-height:17px;padding:0 4px}
/* 🛍 магазин и пометка NEW */
#nav .nw{position:absolute;top:-2px;left:calc(50% + 1px);background:#ef4444;color:#fff;font-size:8.5px;font-weight:800;border-radius:6px;padding:1px 4px;line-height:1.3;letter-spacing:.03em}
.shtop{display:flex;align-items:center;gap:10px;margin:2px 0 4px}.shtop h1{font-size:21px;margin:0;flex:1}.shnew{font-size:10px;font-weight:800;background:#ef4444;color:#fff;border-radius:6px;padding:2px 6px}
.shsub{color:var(--muted);font-size:12.5px;line-height:1.4}
.shjump{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:0 16px 4px;scrollbar-width:none}.shjump::-webkit-scrollbar{display:none}
.shjump button{flex:none;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12.5px}
.shclosed{background:var(--shclosed);border:1px solid var(--shclosedb);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0}
.shblk{margin:16px 0 6px;padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--card2);scroll-margin-top:10px}
.shblk.off{border-color:var(--warnl);background:linear-gradient(180deg,rgba(234,179,8,.12),var(--card2) 140px)}
.shbh{display:flex;align-items:center;gap:10px}.shbh>div{min-width:0;flex:1}.shbh b{display:block;font-size:17px;line-height:1.25;overflow-wrap:anywhere}.shbh small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.shblk.off .shbh b{color:var(--warnt)}.shbc{flex:none;width:44px;height:53px;display:flex;align-items:center;justify-content:center;font-size:28px}.shbc svg{width:44px;height:53px}
.shbx{font-size:12.5px;color:var(--muted);line-height:1.4;margin:6px 0 2px}.shblk .shsec{margin:14px 0 4px}.shblk .shit{background:var(--card)}
.shsec{margin:18px 0 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);scroll-margin-top:10px}
.shit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;position:relative}
.shit.off{border-color:var(--warnl);background:linear-gradient(180deg,rgba(234,179,8,.08),var(--card) 40%)}
.shotag{display:inline-block;font-size:10.5px;font-weight:800;color:#2a1c00;background:linear-gradient(135deg,#fff4b8,#e8b923);border-radius:8px;padding:2px 7px;margin-bottom:4px}
.shhd{display:flex;justify-content:space-between;align-items:center;gap:8px}.shhd>div{min-width:0}.shhd b{font-size:15px;overflow-wrap:anywhere}.shhd small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.shlad{display:flex;gap:3px;flex:none}.shlad i{width:14px;height:6px;border-radius:3px;background:var(--bar0)}.shlad i.on{background:var(--accent)}
.shpair{display:grid;grid-template-columns:1fr 18px 1fr;gap:4px;align-items:center;width:100%;margin-top:8px;padding:0;background:none;text-align:left;color:var(--text)}.shpair>span{min-width:0}
.shpair svg,.shnf svg,.shpromo svg{width:100%;height:auto;display:block;border-radius:10px}.shpair .ar{text-align:center;color:var(--muted)}
.shcap{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:3px}
.shwhat{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4}.shwhat b{color:var(--text);font-weight:600}
.shbig{margin-top:8px}.shmax{font-size:12.5px;color:var(--okt2);margin-top:8px}
.shsoon,.shsw{display:flex;align-items:center;justify-content:center;border-radius:16px;padding:10px;background:var(--card2);color:var(--muted);font-weight:700;font-size:13.5px;border:1px dashed var(--line);text-align:center}
.shsw{color:var(--text);border-style:solid}.shwarn{font-size:12.5px;margin:0 0 4px}
.shpack{display:flex;align-items:center;gap:10px}.shpack .ic{font-size:26px}.shpack .tx{flex:1;min-width:0;font-size:13px}.shpack .tx small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}.shpack .tx b{white-space:nowrap}
.shbadge{position:absolute;right:10px;top:-8px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.kbuy.shpk{width:auto;flex:none;padding:7px 9px}
.shnf{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}.shnf.one{grid-template-columns:1fr}.shnfl{font-size:12.5px;line-height:1.45}.shnfl div{margin:3px 0}.shnfl .lk{color:var(--muted)}
.shpromo{display:grid;grid-template-columns:1fr 80px 66px;gap:8px;align-items:center;width:100%;margin:6px 0 8px;padding:10px;border-radius:16px;text-align:left;color:var(--text);
  border:1px solid var(--warnl);background:var(--promo-bg);box-shadow:0 4px 18px rgba(245,197,66,.15)}
.shpromo b{font-size:15px;white-space:nowrap}@media (max-width:370px){.shpromo{grid-template-columns:1fr 70px 58px;gap:6px}}.shpromo b i{font-style:normal;font-size:10px;font-weight:800;background:#ef4444;color:#fff;border-radius:6px;padding:2px 5px;vertical-align:2px}
.shpromo small{display:block;color:var(--warnt);font-size:12px;margin-top:4px;line-height:1.3}.shpt{min-width:0}.shpm{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.card h3{margin:0 0 6px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card.need{border-color:var(--warnl);background:var(--needbg)}
.card.warnc{border-color:var(--warnl)}
.go{display:block;width:100%;margin-top:9px;padding:10px;border-radius:11px;background:var(--card2);font-size:14px;text-align:center}
.go.main{background:var(--accent);color:var(--on-acc);font-weight:700}
.crest{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.badge{flex:none;width:58px;height:66px;border-radius:12px 12px 29px 29px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.6);color:#fff}
.crest h1{margin:0;font-size:21px;line-height:1.15}
.crest small{display:block;color:var(--muted);font-size:13px;margin-top:3px;font-weight:400}
.crest svg.crbig{flex:none;width:74px;height:84px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.ofcrest{text-align:center;margin:2px 0 8px}.ofcrest svg.crbig{width:80px;height:96px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
svg.cr{flex:none;width:18px;height:22px;vertical-align:-5px;margin-right:6px}
svg.crl{width:26px;height:31px;vertical-align:-9px}
.menu button.off{opacity:.55}
.crestprev{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 4px}.crestprev svg.crbig{width:150px;height:150px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.crrow{background:var(--card2);padding:8px 10px;border-radius:10px;font-size:14px}.crrow .sub{margin-top:2px}
.crgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.crgrid.mot{grid-template-columns:repeat(2,1fr)}.crlet{display:block;font-size:22px;font-weight:900;line-height:1.1}.crgrid.mot .crt{font-size:12px;font-weight:700;color:var(--text);min-height:34px}.crgrid.ready .crt svg{width:96px;height:100px}.crgrid.ready .crt span{font-size:12px;font-weight:700;color:var(--text)}.crgrid.ready{grid-template-columns:repeat(3,1fr)}.crgrid.sym{grid-template-columns:repeat(6,1fr)}
.crt{background:var(--card2);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted);text-align:center;min-height:40px}.crt.on{outline:2px solid var(--accent)}
/* узкий экран (320–360): плитки, кнопка покупки и цена сжимаются, а не раздвигают лист вбок */
.crgrid>.crt{min-width:0;overflow-wrap:anywhere;hyphens:auto}.crgrid.ready .crt svg{max-width:100%;height:auto}.kbuy>span:first-child{min-width:0}
.crt svg{display:block;margin:0 auto 2px;width:36px;height:43px}.crgrid.sym .crt svg{width:30px;height:30px;margin:0 auto}
.crt.lock,.go.lock{position:relative}.crt.lock>svg,.crt.lock>b,.color.lock,.crgrid.mot .crt.lock span{opacity:.4}.crt.lock::after,.color.lock::after{content:'🔒';position:absolute;top:2px;right:3px;font-size:10px;line-height:1}
.crt .lk{display:block;font-size:10px;font-style:normal;color:var(--muted);font-weight:600}.color.lock{position:relative}.color.lock::after{top:50%;left:50%;right:auto;transform:translate(-50%,-50%)}
.crlv{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0}.crlv b{font-size:16px}.crlv .sub{margin-top:3px;font-size:13px;color:var(--muted)}.crlv .go{margin-top:8px}
.crhead{border-radius:12px;padding:9px 12px;margin:6px 0;font-size:14px;font-weight:700;background:var(--card2);border:1px solid var(--line)}

@keyframes kublid{to{transform:translateY(-260%) rotate(-28deg);opacity:0}}@keyframes kubgo{to{opacity:0;transform:scale(1.4)}}@keyframes kubfl{30%{opacity:1}to{opacity:0}}

.crgrid .crt svg.kmini{width:46px;height:50px}.crgrid.kittabs .crlet{height:50px;line-height:50px;font-size:20px}.kitx{float:right;background:none;border:0;color:var(--accent);font-size:12px;padding:0}
.kduel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:10px 0 2px}.kduel svg{width:100%;height:auto;display:block;border-radius:12px}.kvs{font-weight:900;font-size:16px;color:var(--muted)}
.kdn{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:5px;font-size:12px;font-weight:700;min-width:0}.kdn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.klt{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:10px;background:rgba(127,127,127,.25);white-space:nowrap}.klt.l3{background:linear-gradient(135deg,#f1f5f9,#94a3b8);color:#1e293b}.klt.l2{background:#2f8ff0;color:#fff}
@media (prefers-reduced-motion:reduce){.kc-sw,.kc-pl,.kc-sh,.kc-tw,.kc-run,.kbuy::after{animation:none}.kfi{transition:none}}
.color{aspect-ratio:1;border-radius:50%;border:2px solid var(--swatch);max-width:36px;justify-self:center;width:100%}
.color.on{outline:3px solid var(--accent);outline-offset:2px}
.cardsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.cardsum{display:flex;gap:6px;margin:4px 0 2px}.cardsum i{font-style:normal;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--card2);color:var(--muted)}
.cardsum i.warn{color:#c2410c;background:rgba(245,158,11,.16)}
.pcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card2);margin-top:6px}
.pcard .top{display:flex;align-items:center;gap:12px;padding:12px}
.pcard .top .shirt{flex:none;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;border:3px solid rgba(255,255,255,.85)}
.pcard .top b{display:block;font-size:18px}
.pcard .top small{color:rgba(255,255,255,.85);font-size:13px}
.pcard .tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 6px}
.pcard .tags i{font-style:normal;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc-text);text-transform:uppercase;letter-spacing:.04em}
.pcard .body{padding:4px 12px 12px;background:var(--card)}
.pcard .cond{font-size:13px;color:var(--muted);margin-top:8px;white-space:pre-wrap}
/* 🏋️ итог тренировки (шапка в цвете клуба, три цифры, «на кого смотреть») и выбор тренировки плитками */
.tsum{position:relative;overflow:hidden;border-radius:20px;padding:14px 16px 16px;margin-top:6px;color:#fff;background:linear-gradient(135deg,var(--club,#1d4ed8),var(--club-hi,#1a46c2))}
.tsum:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.tsum .stamp{display:inline-block;border:2px solid #fff;border-radius:8px;padding:1px 8px;font:italic 800 12px var(--sport);text-transform:uppercase;letter-spacing:.5px;transform:rotate(-4deg);margin-bottom:8px}
.tsum h3{margin:0;font:italic 800 24px/1.05 var(--sport);text-transform:uppercase;overflow-wrap:anywhere}
.tsum p{position:relative;margin:6px 0 0;font-size:13px;line-height:1.35}
.ttiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ttiles>div{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.ttiles b{display:block;font:italic 800 23px/1.1 var(--sport);overflow-wrap:anywhere}
.ttiles small{display:block;font-size:11px;color:var(--muted);line-height:1.25;margin-top:3px}
.ttiles .up,.tk .ef{color:var(--okt)}.ttiles .dn{color:var(--warnt)}
.twatch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 12px}
.twatch>div{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px}.twatch>div+div{border-top:1px solid var(--line)}
.twatch i{font-style:normal;font-size:22px;flex:none}.twatch small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
details.tall,details.trules{margin-top:10px}
details.tall>summary,details.trules>summary{list-style:none;cursor:pointer;text-align:center;color:var(--muted);font-size:13px;font-weight:700;padding:8px}
details.tall>summary::-webkit-details-marker,details.trules>summary::-webkit-details-marker{display:none}
details.tall[open]>summary .tw{display:inline-block;transform:rotate(180deg)}
.tpl{display:grid;grid-template-columns:auto minmax(0,1fr) 46px auto;align-items:center;gap:4px 8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px}
.tpl b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tpl span{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.tpl .n{color:var(--muted);font-size:12px}.tpl .tbar{margin:0}
.tmeter{display:flex;gap:8px;margin-top:8px}
.tmeter>div{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.tmeter small{color:var(--muted);font-size:11px;font-weight:700}.tmeter b{display:block;font-size:16px;margin-top:1px;overflow-wrap:anywhere}
.tbar{height:7px;border-radius:4px;background:var(--bar0);margin-top:5px;overflow:hidden}.tbar i{display:block;height:100%;border-radius:4px}
.tk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2);border-radius:16px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:15px}
html[data-theme="club"] .tk{background:var(--card);box-shadow:var(--soft)}
.tk .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:var(--acc-soft)}
.tk .ic.n{font:italic 800 19px var(--sport)}
.tk .ic.c-recovery{background:rgba(14,165,233,.16)}.tk .ic.c-rest{background:rgba(147,51,234,.15)}.tk .ic.c-attack{background:rgba(220,38,38,.15)}
.tk .ic.c-defense{background:rgba(79,70,229,.16)}.tk .ic.c-stamina{background:rgba(22,163,74,.16)}.tk .ic.c-personal{background:rgba(234,179,8,.2)}
.tk .tx{flex:1;min-width:0}.tk small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.3}
.tk .ef{flex:none;max-width:42%;text-align:right;font-size:12px;font-weight:800}
.tk:disabled{opacity:.45}.tk.on{outline:2px solid var(--accent)}
.trules .kind{cursor:default}
/* 🃏 коллекционная карточка игрока: рамка по сумме характеристик (сервер — app/rules.py card_tier), верх в цвете формы */
.ccard{border-radius:24px;padding:3px;margin-top:6px;background:var(--line)}
.ccard.gold,.mcard.gold{background:linear-gradient(160deg,#fff3c4,#e2b53c 30%,#fff7d6 50%,#c58f1f 75%,#f6dc8b)}.ccard.gold{box-shadow:0 14px 28px rgba(197,143,31,.28)}
.ccard.silver,.mcard.silver{background:linear-gradient(160deg,#f4f6fa,#b8bfcc 40%,#fff 60%,#9aa3b5)}.ccard.silver{box-shadow:0 14px 28px rgba(100,116,139,.25)}
.ccard.bronze,.mcard.bronze{background:linear-gradient(160deg,#f3d2b3,#b87333 40%,#f6dcc3 60%,#8d5524)}.ccard.bronze{box-shadow:0 14px 28px rgba(141,85,36,.25)}
/* мини-карточка в сетке «Карточки игроков»: та же рамка и верх в цвете клуба, но кнопкой */
.mcard{display:block;width:100%;min-width:0;padding:2px;border:0;border-radius:16px;background:var(--line);color:var(--text);font:inherit;text-align:center;cursor:pointer}
.mcard .in{position:relative;display:block;border-radius:14px;overflow:hidden;background:var(--card);padding:0 4px 7px}
.mcard .mtop{position:absolute;left:0;right:0;top:0;height:50%;pointer-events:none}.mcard .mtop i{position:absolute;inset:0}
.mcard .mo{position:absolute;left:6px;top:4px;z-index:1;color:#fff;text-align:left;line-height:.95;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.mcard .mo b{display:block;font:italic 800 17px/1 var(--sport)}.mcard .mo small{display:block;font:italic 800 8px var(--sport);letter-spacing:.5px}
.mcard .mi{position:absolute;right:5px;top:3px;z-index:1;font-size:13px;line-height:1}
.mcard .ms{position:relative;display:block;margin-top:6px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}.mcard .ms svg{display:block;margin:0 auto;width:52px;height:57px}
.mcard .mn{display:block;font-size:12.5px;font-weight:800;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .mp{display:block;font-size:10px;color:var(--muted);font-weight:700;line-height:1.15;min-height:11px}
.mcard .mf{display:block;height:4px;border-radius:2px;background:var(--bar0);margin:4px 6px 0;overflow:hidden}.mcard .mf i{display:block;height:100%;border-radius:2px}
.mcard .mf.hurt{height:auto;background:none;margin-top:3px;font-size:10px;font-weight:800;color:var(--bad)}
.ccard .in{position:relative;border-radius:21px;overflow:hidden;background:var(--card)}
.ccard .cedge,.ccard .ctop{clip-path:polygon(0 0,100% 0,100% 84%,0 100%)}
.ccard .cedge{position:absolute;left:0;right:0;top:0;height:206px}
.ccard .ctop{position:relative;height:200px;overflow:hidden}
.ccard .cstr{position:absolute;inset:0}
.ccard .ov{position:absolute;left:12px;top:12px;text-align:center;line-height:.95;border-radius:12px;padding:5px 8px 6px}
.ccard .ov b{display:block;font:italic 800 42px/1 var(--sport)}.ccard .ov small{font:italic 800 12px var(--sport);letter-spacing:1px;text-transform:uppercase}
.ccard .rar{position:absolute;right:12px;top:14px;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;letter-spacing:1px;color:#2b1d05;background:linear-gradient(135deg,#fff3c4,#e2b53c)}
.ccard.silver .rar{color:#1e293b;background:linear-gradient(135deg,#fff,#b8bfcc)}.ccard.bronze .rar{color:#fff;background:linear-gradient(135deg,#b87333,#8d5524)}
.ccard .cshirt{position:absolute;left:50%;top:22px;width:140px;transform:translateX(-50%);filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.ccard .cshirt svg{display:block;width:100%;height:auto}
.ccard .nm{text-align:center;padding:2px 12px 0;margin-top:-6px;position:relative}
.ccard .nm small{display:block;color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ccard .nm b{display:block;font:italic 800 28px/1.05 var(--sport);text-transform:uppercase;overflow-wrap:anywhere}
.ccard .six{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;padding:12px 16px 6px}
.ccard .six div{display:flex;align-items:baseline;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700;min-width:0}
.ccard .six b{font:italic 800 22px var(--sport);color:var(--text);min-width:26px;text-align:right}
.ccard .six .best b{color:var(--acc-text)}
.ccard .foot{display:flex;justify-content:center;gap:6px;padding:4px 12px 14px;flex-wrap:wrap}
.ccard .foot i{font-style:normal;display:inline-flex;align-items:center;gap:4px;background:var(--card2);border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:800}
.ccond{display:flex;gap:8px;margin-top:12px}
.ccond>div{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 10px;font-size:11px;color:var(--muted);font-weight:700}
.ccond b{display:block;font-size:15px;color:var(--text);margin-top:2px;overflow-wrap:anywhere}
/* 📈 рост игроков: копилка (кольцо — доля очка), ярлык возраста с приростом, плитки «было → станет» */
.ghero{display:flex;align-items:center;gap:14px;border-radius:20px;padding:14px 16px;margin-top:6px;color:#fff;background:linear-gradient(135deg,var(--club,#1d4ed8),var(--club-hi,#1a46c2))}
.ghero>b{font:italic 800 54px/1 var(--sport);flex:none}.ghero div{min-width:0;font-size:12.5px;line-height:1.35}.ghero div b{display:block;font-size:16px}
.gpr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-top:8px}
.gpr .tx{flex:1;min-width:0}.gpr .tx>b{font-size:14.5px}.gpr small{display:block;color:var(--muted);font-size:11.5px;font-weight:700;margin-top:1px}
.gring{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.gring span{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--acc-text)}
.gpr.sm .gring{width:38px;height:38px}.gpr.sm .gring span{width:30px;height:30px;font-size:13px}
.gage{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.gage.y{background:var(--okbg);color:var(--okfg)}.gage.m{background:var(--acc-soft);color:var(--acc-text)}.gage.o{background:var(--card2);color:var(--muted)}
.ggo{flex:none;border-radius:16px;padding:8px 12px;font-weight:800;font-size:13px;background:#e2b53c;color:#3d2e00;box-shadow:inset 0 -4px 8px rgba(0,0,0,.13),inset 0 4px 8px rgba(255,255,255,.4)}
.ggo:disabled{opacity:.5}
.gstg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gst{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0}
.gst .t{font-size:12px;color:var(--muted);font-weight:700}.gst .v{font:italic 800 22px/1.1 var(--sport);margin-top:3px}.gst .v em{font-style:inherit;color:var(--okt)}
.gst .tag{position:absolute;right:8px;top:8px;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px;background:var(--card2);color:var(--muted)}
.gst .tag.s{background:#fef3c7;color:#92400e}
.gst .tbar i{background:var(--accent)}.gst:disabled{opacity:.5}
/* «📖 Обучение»: подсказки поверх настоящих экранов (app/learning.py) */
.tblk{position:fixed;z-index:30;background:rgba(2,6,23,.74);touch-action:none}
#tring{position:fixed;z-index:31;border:3px solid var(--accent);border-radius:12px;pointer-events:none;box-shadow:var(--tglow)}
#tbub{position:fixed;z-index:32;left:12px;right:12px;max-width:496px;margin:0 auto;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;

#tbub h4{margin:6px 0 3px;font-size:16px;line-height:1.25}

#tbub .tx{font-size:14px;line-height:1.42}
#tbub .ex{margin-top:7px;font-size:13px;line-height:1.4;background:var(--card2);border-radius:10px;padding:7px 10px}

#tbub .warnx{margin-top:7px;font-size:13px;color:var(--warnt)}

#tbub .tpath{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-top:8px;font-size:15px;position:relative}
#tbub .tpath b{display:block;font-size:16px}
#tbub .tpath span{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35}
#tbub .tpath.rec{border-color:#22c55e;background:linear-gradient(135deg,rgba(34,197,94,.14),var(--card))}
#tbub .tpath i{position:absolute;right:10px;top:10px;font-style:normal;font-size:11px;font-weight:700;background:#22c55e;color:#052e12;border-radius:999px;padding:2px 8px}
#tbub .tpath:disabled{opacity:.45}
#tbub .tdots{display:flex;justify-content:center;gap:6px;margin-top:8px}#tbub .tdots i{width:7px;height:7px;border-radius:50%;background:var(--card2)}#tbub .tdots i.on{background:var(--accent)}
#tbub .big1{font-size:40px;text-align:center;line-height:1.1;margin-top:4px}
.tcirc{display:block;margin:6px auto 0;max-width:260px}
body.touring main{padding-bottom:42vh}
body.touring #sheet .in{padding-bottom:42vh}
body.touring #sheet{max-height:calc(var(--sheet-h,88vh) / .88)}   /* вся видимая область (не 100vh: на iPhone vh больше экрана) */
.qbtn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--accent);font-weight:800;font-size:15px;border:1px solid var(--line)}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px}.lrow .label{flex:1;min-width:0}

.big:disabled{opacity:.45}
.pdr{background:var(--card2);border-radius:12px;padding:9px 10px;margin-top:8px}

.pdc .sv{padding:8px 10px;border-radius:10px;background:var(--accent);color:var(--on-acc);font-weight:700;font-size:13px;margin-left:4px}.pdc .sv:disabled{opacity:.45}
.tb.pd td.n small{display:block;color:var(--muted);font-size:11px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 4px}.fhead h2{margin:0;font-size:21px}
.fpill{flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

<script>
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
if (TG) { TG.ready(); TG.expand(); }
/* 🎨 оформление: «в цветах клуба» (светлое, акцент — цвет формы активного клуба) или тёмное, как раньше; выбор — в localStorage */
let THEME = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'club', THEME_TG = '', THEME_CLUB = '';
const rgbOf = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const hexOf = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
function lumOf(h) { const f = v => (v /= 255) <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4), [r, g, b] = rgbOf(h); return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); }
const chromaOf = h => { const c = rgbOf(h); return Math.max(...c) - Math.min(...c); };
function toneFit(h) {      // тот же оттенок темнее/светлее: белый текст на нём и он на фоне #f7f8fa — контраст ≥ 4.5:1
  let [r, g, b] = rgbOf(h).map(v => v / 255); const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let l = (mx + mn) / 2, hu = 0;
  const sa = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  if (d) hu = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  const at = L => { const c = (1 - Math.abs(2 * L - 1)) * sa, x = c * (1 - Math.abs(hu % 2 - 1)), m = L - c / 2;
    const [p, q, w] = hu < 1 ? [c, x, 0] : hu < 2 ? [x, c, 0] : hu < 3 ? [0, c, x] : hu < 4 ? [0, x, c] : hu < 5 ? [x, 0, c] : [c, 0, x]; return hexOf([p + m, q + m, w + m].map(v => v * 255)); };
  let out = h; for (let i = 0; i < 100 && lumOf(out) > .165; i++) { l -= .01; out = at(l); }
  for (let i = 0; i < 100 && lumOf(out) < .012; i++) { l += .01; out = at(l); }      // почти чёрный — чуть светлее, чтобы полосы и выделения были видны
  return out;
}
function clubTone(kit) {      // цвет клуба: футболка; светлая — шорты, если они цветные, иначе тот же оттенок темнее; бесцветная светлая — графит
  const ok = h => /^#[0-9a-f]{6}$/i.test(h || ''), [a, b] = kit || [];
  if (!ok(a)) return '#1d4ed8';
  if (lumOf(a) <= .165) return toneFit(a);
  if (ok(b) && chromaOf(b) >= 40 && lumOf(b) <= .165) return toneFit(b);
  if (chromaOf(a) < 30) return ok(b) && chromaOf(b) >= 40 ? toneFit(b) : '#1e293b';

    (ef ? `<div class="ef">${esc(ef)}</div>` : '') + `</button>`;
}
const tkSplit = t => { const i = String(t).indexOf(' '); return i > 0 ? [t.slice(0, i), t.slice(i + 1)] : ['•', t]; };      // «⚔️ Атака» → значок и название
const STAT_IC = {speed: '⚡', shot: '💥', pass: '🎯', defense: '🛡', stamina: '🫁', keeping: '🧤'};
function trainTeam(m) {      // свежесть и настрой команды: с сервера (condition.team_now), у старого сервера — из игроков
  if (m.train.team) return m.train.team;
  const fit = m.players.filter(p => !p.injured), list = fit.length ? fit : m.players, cnt = {};
  list.forEach(p => { cnt[p.mood] = (cnt[p.mood] || 0) + 1; });
  return {fresh: Math.round(list.reduce((a, p) => a + (p.fresh || 0), 0) / Math.max(1, list.length)), mood: Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || '—', mood_lv: null};
}

function sum(v) { return v.reduce((a, b) => a + b, 0); }
function step(v, i, d) {      // как кнопки «+/−» в чате: шаг урезается границами и остатком до 100
  const L = S.limits, n = v.slice();
  d = d > 0 ? Math.max(0, Math.min(d, L.max - n[i], L.total - sum(n))) : Math.min(0, Math.max(d, L.min - n[i]));
  n[i] += d; return n;
}

const Q = new URLSearchParams(location.search);
const DUEL_WS = 'wss://football-duel.pinkovskyi2508.workers.dev';   // сервер комнат (worker/), только он
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
// адрес сервера и подпись из ссылки — только при проверке на своём компьютере: иначе чужая ссылка увела бы подпись на чужой сервер
const WS_BASE = LOCAL && Q.get('ws') ? Q.get('ws') : DUEL_WS;
const INIT = (TG && TG.initData) || (LOCAL ? Q.get('init') || '' : '');
// игру открыли без адреса комнаты, но в Telegram (Main Mini App, ссылка ?startapp=…): входная комната со случайным
// именем — бот проверит подпись, при необходимости создаст менеджера и пришлёт адрес его комнаты (app/app_entry.py)
let ROOM = Q.get('room') || (INIT ? 'entry-' + Array.from(crypto.getRandomValues(new Uint8Array(15)), b => (b % 36).toString(36)).join('') : null);
let PANEL_AFTER = null;        // открыть окно, когда придёт первое состояние (приглашение в лигу по ссылке)
let ws = null, retry = 0, ended = false;
const AGAIN = 'Экран закрыт. Откройте игру снова: кнопка «🎮 Игра» в чате.';
function stop(text) { ended = true; tourStop(); $('app').classList.add('hidden'); $('nav').classList.add('hidden'); closeSheet(); $('conn').classList.remove('hidden'); $('conn').textContent = text; }
// бота в комнате нет (перезапустился, комната истекла) — Worker будит его по нашему hello; не ответил за WAIT_MS —
// входим заново (новый hello снова будит бота)
const WAIT_MS = 10000;
function waitBot(sock) {
  clearTimeout(waitBot.t);
  waitBot.t = setTimeout(() => { if (ws === sock && sock.readyState === 1) sock.close(); }, WAIT_MS);
}
function connect() {
  const sock = ws = new WebSocket(WS_BASE.replace(/^http/, 'ws') + '/rooms/' + encodeURIComponent(ROOM) + '/player');
  ws.onopen = () => { sock.send(JSON.stringify({type: 'hello', initData: INIT})); waitBot(sock); };
  clearInterval(connect.ping);           // молчащее соединение Cloudflare закрывает (~100 сек) — пингуем
  connect.ping = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 30000);
  ws.onmessage = e => {
    if (e.data === 'pong') return;
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.type === 'bot_left') { toast('Бот перезапускается — подождите, экран оживёт сам', true); waitBot(sock); return; }
    retry = 0;
    clearTimeout(waitBot.t);
    if (m.type === 'goto' && typeof m.room === 'string') {     // из входной комнаты — в свою (адрес прислал бот)
      ROOM = m.room; ws = null; try { sock.close(); } catch (err) { /* уже закрыт */ }
      if (m.tab === 'league') PANEL_AFTER = 'friends';
      connect(); return;
    }
    if (m.type === 'state') onState(m);
    else if (m.type === 'ack') onAck(m);
  };
  ws.onclose = e => {
    if (ws !== sock) return;
    clearTimeout(waitBot.t);
    if (e.code === 4003) { stop('Этот экран открывает только менеджер клуба.'); return; }
    if (e.code === 4001) { stop(AGAIN); return; }
    if (ended) return;
    retry++;
    if (retry > 6) { stop('Нет связи с ботом. ' + AGAIN); return; }
    if (!S) $('conn').textContent = 'Будим бота… подождите немного';
    else toast('Связь потеряна — переподключаемся…', true);
    setTimeout(connect, Math.min(10000, 1500 * retry));
  };
}

function demoEcoAdmin(act) {     // демо: экономика лиг друзей меняется только на этой странице (в игре — app/economy.py admin_act)
  const E = S.hub.admin.economy, L = E.leagues.find(x => x.id === act.league);
  if (act.a === 'ecodefault') E.default = act.on;
  else if (act.a === 'ecomarket') E.market = act.mode;
  else if (!L) return {ok: false, note: 'Такой лиги друзей нет.'};
  else if (act.a === 'ecotest') L.test = act.on;
  else if (act.a === 'ecoon') { if (!act.on && L.economy === 'on' && L.season) return {ok: false, note: 'Идёт сезон с экономикой — выключить можно после его конца.'}; L.economy = act.on ? 'next' : 'off'; }
  else if (act.a === 'ecoreset') { if (L.season) return {ok: false, note: 'Сбросить экономику можно между сезонами.'}; return {ok: true, note: `Экономика лиги «${L.name}» сброшена (демо)`, economy: E}; }
  return {ok: true, note: 'Готово (демо)', economy: E};
}
function demoAct(act) {
  const p = player(act.slot); let r = {ok: true, note: ''};
  const club = demoLeagueAct(act) || demoClubAct(act);
  if (club) { onAck({type: 'ack', id: act.id, ...club}); onState(S); return; }
  if (act.a === 'section') r.note = 'Демо: в Telegram этот раздел откроется в чате';
  else if (act.a === 'repinfo') r.rep = {club: act.club, name: 'Северный Ветер', left: 10, targets: [[0, 'Название клуба «Северный Ветер»'], [1, '№1 Борис Ключ'], [2, '№7 Тимур Титов']],
    reasons: [['insult', 'оскорбление'], ['ads', 'реклама или ссылки'], ['other', 'другое']]};
  else if (act.a === 'report') r.note = '✅ Жалоба отправлена администратору. Спасибо, что помогаете держать игру чистой.';
  else if (act.a.startsWith('mod')) r = {ok: false, note: 'Демо: это работает только в Telegram'};
  else if (act.a === 'help') r.help = {key: act.key, text: act.key === 'quick' ? '🚀 БЫСТРЫЙ СТАРТ — что сделать по порядку\n\n1. Клуб. Без клуба на «Главной» — «⚽ Создать клуб».\n2. Состав. Вкладка «Состав»: нажмите игрока — очки, место, капитан, талант.\n3. Лига. «Ещё» → «Лига друзей»: позовите друзей ссылкой.' :
    'Демо: в Telegram здесь полный текст раздела.'};
  else if (['lgrename', 'lgrenew', 'lgkick', 'lgreset'].includes(act.a)) r = {ok: false, note: 'Демо: это работает только в Telegram'};
  else if (act.a === 'newsseen' || act.a === 'hint' || act.a === 'pm') r.note = '';
  else if (act.a === 'tour') {     // демо: где остановился — только на этой странице (в игре — у бота)
    const L = S.hub.learn || (S.hub.learn = {auto: null, guides: {}}), g = L.guides[act.g] || {};
    L.guides[act.g] = {path: act.path || '', step: act.step, done: !!(g.done || act.done)}; L.auto = null;
    r = {ok: true, note: '', learn: L};
  }
  else if (act.a === 'tutorial') r = {ok: true, note: 'Демо: учебный матч — демо экрана матча с пояснениями', watch: '../match/?learn=1'};
  else if (act.a === 'place') {    // вратарь или запасной, когда места ещё нет — как у бота
    const n = S.players.filter(x => x.place === 'bench').length;
    if (act.where === 'gk') { S.players.forEach(x => { if (x.place === 'gk') x.place = 'field'; }); p.place = 'gk'; S.order = null; r.note = `🧤 №${p.number} — вратарь`; }
    else if (p.place === 'bench') r.note = `№${p.number} уже в запасе`;
    else if (n >= 3) r = {ok: false, note: 'На скамейке уже трое — поменяйте игрока местами с запасным'};
    else { p.place = 'bench'; S.order = null; r.note = `🪑 №${p.number} — в запасе` + (n + 1 < 3 ? ` · осталось выбрать: ${3 - n - 1}` : ' · все трое выбраны'); }
  }
  else if (act.a === 'pview' || act.a === 'obhide') {     // демо: шаг отмечается на месте (в игре — ботом)
    const o = S.hub.onboarding;
    if (act.a === 'obhide') { S.hub.onboarding = null; r.note = 'Первые шаги скрыты'; }
    else if (o) { o.steps.find(s => s.key === 'player').done = true; o.done = o.steps.filter(s => s.done).length; r.note = `+${o.reward} болельщиков за шаг`; }
  }
  else if (act.a === 'trophies') r.trophies = demoTrophies();
  else if (act.a === 'press') { if (act.picks) { const own = act.own == null ? null : demoMask(act.own.split(/\s+/).join(' ').trim());
      if (own === '') r = {ok: false, note: 'Напишите ответ — пустой текст не подойдёт.'};
      else if (own && own.length > 200) r = {ok: false, note: `Слишком длинно: свой ответ — до 200 знаков. Сейчас ${own.length}.`};
      else { const quote = own || demoPress().questions[0].answers[act.picks[0]][1];
        S.hub.news = [{at: '31.10 20:15', text: `🎤 Менеджер «Девятка»: «${quote}»`}, ...(S.hub.news || [])];
        delete S.hub.home.press; r.note = '🎤 Пресс-конференция окончена (демо): в игре настрой игроков изменится, цитата — в новостях лиги.'; r.press = null; } }
    else if (S.hub.home.press) r.press = demoPress(); else r = {ok: false, note: 'Пресс-конференции сейчас нет', press: null}; }
  else if (act.a === 'awards') r.awards = demoAwards();
  else if (act.a === 'pred') r = demoPred(act);
  else if (act.a === 'top') r.top = demoTop();
  else if (act.a === 'nudges') r = {ok: true, nudges: act.on, note: act.on ? '🔔 Напоминания включены' : '🔕 Напоминания выключены (о матчах — по-прежнему приходят)'};
  else if (act.a === 'daily') {
    const d = S.hub.daily, ok = act.choice === 1;
    if (d.answered) r = {ok: false, note: 'Сегодня вы уже ответили — новый вопрос завтра'};
    else {
      Object.assign(d, {answered: true, choice: act.choice, right: 1, correct: ok, fans: ok ? 10 : 0, bonus: 15, answer: d.options[1],
        streak: 3, streak_text: '🔥 Серия: 3 дня', next: {in: 4, fans: 30, text: 'ещё 4 дня подряд — +30 болельщиков'}});
      S.hub.home.fans += (ok ? 10 : 0) + 15;
      r = {ok: true, note: (ok ? '✅ Верно! +10 болельщиков' : '❌ Неверно. Правильно: Италия') + ' · 🔥 серия 3 дня: +15 болельщиков', daily: d};
    }
  }
  else if (act.a === 'ask') { const a = S.hub.home.ask, ans = a && a.answers.find(x => x[0] === act.key);
    if (!a || (act.token && act.token !== a.token)) r = {ok: false, note: 'Просьбы уже нет'};
    else { delete S.hub.home.ask; r.note = `${a.who.split(' ')[0]} ${a.who.split(' ').pop()}: ${ans ? ans[2] : 'ответ принят'}`; } }
  else if (act.a === 'scout' || act.a === 'plan') {
    const tl = [['balance', '⚖️ Баланс', 'без плюсов и минусов'], ['press', '🔥 Прессинг', 'ломает Оборону, боится Контратаки'],
      ['counter', '⚡ Контратака', 'наказывает Прессинг, вязнет в Обороне'], ['park', '🛡 Оборона', 'гасит Контратаку, задыхается под Прессингом']];
    const prev = (SCOUTS[act.fx] || {}).plan || {tactic: 'balance', mark: null, guess: null};
    r.scout = {fx: act.fx, club: 'Северный Ветер', known: 4, usual: 'press', locked: false, bonus: 4,
      form: [{res: 'В', score: '3:1', vs: 'Торпедо'}, {res: 'П', score: '1:2', vs: 'Девятка'}, {res: 'В', score: '4:2', vs: 'Львы'}, {res: 'Н', score: '2:2', vs: 'Торпедо'}],
      tactics: [{k: 'press', title: '🔥 Прессинг', pct: 61}, {k: 'balance', title: '⚖️ Баланс', pct: 27}, {k: 'park', title: '🛡 Оборона', pct: 12}],
      hint: 'Обычно начинает с 🔥 Прессинг — её бьёт ⚡ Контратака.',
      danger: [{name: '№11 Глеб Котов', goals: 5, assists: 1, rating: 7.6}, {name: '№7 Ян Титов', goals: 2, assists: 3, rating: 7.1}],
      tired: ['№5 Рябов'], hurt: [],
      mark_opts: [['4', 'Сидоров'], ['5', 'Рябов'], ['7', 'Титов'], ['8', 'Носов'], ['9', 'Жуков'], ['11', 'Котов']].map(([n, l], i) => ({slot: i + 2, name: `№${n} ${l}`})),
      plan: act.a === 'plan' ? {tactic: act.tactic, mark: act.mark, guess: act.guess} : prev,
      tactics_all: tl.map(([k, title, info]) => ({k, title, info}))};
    if (act.a === 'plan') r.note = '📋 План сохранён — сработает со стартового свистка';
  }
  else if (['propose', 'respond', 'cancel', 'friendly', 'chal', 'chalx', 'cinv'].includes(act.a)) r = {ok: false, note: 'Демо: матчи назначаются только в Telegram'};
  else if (act.a === 'seek') { S.hub.seek = 0; SEEK_HB = null; r.note = '🔎 Ищем соперника… (демо: в Telegram через минуту сыграет бот)'; }
  else if (act.a === 'unseek') { S.hub.seek = null; r.note = 'Поиск отменён'; }
  else if (act.a === 'economy') r = {ok: true, note: '', economy: demoEconomy()};
  else if (ECO_ADMIN.includes(act.a)) r = demoEcoAdmin(act);
  else if (ECO_W.includes(act.a)) r = demoWin(act);
  else if (act.a === 'switch') r = demoSwitch();
  else if (act.a === 'seen') r.note = '';
  else if (act.a === 'stats') {
    const ok = act.v.length === 6 && act.v.every(x => x >= 5 && x <= 40) && sum(act.v) === 100;
    if (ok) { p.stats = Object.fromEntries(S.statdefs.map(([k], i) => [k, act.v[i]])); r.note = `Очки №${p.number} сохранены`; }
    else r = {ok: false, note: 'Сумма должна быть ровно 100, каждая от 5 до 40'};
  } else if (act.a === 'formation') { S.formation = act.f; r.note = 'Схема ' + act.f; }
  else if (act.a === 'swap') {
    const q = player(act.with);
    if (!S.order && p.place === 'field' && q.place === 'field') S.order = demoField().map(x => x.slot);
    if (S.order) S.order = S.order.map(s => s === p.slot ? q.slot : s === q.slot ? p.slot : s);
    [p.place, q.place] = [q.place, p.place]; r.note = 'Поменялись местами';
  } else if (act.a === 'captain' || act.a === 'penalty') { S[act.a] = p.slot; r.note = `№${p.number} — ` + (act.a === 'captain' ? 'капитан' : 'пенальтист'); }
  else if (act.a === 'talent') { S.talent = act.key; S.talent_slot = p.slot; r.note = 'Талант назначен'; }
  else if (act.a === 'role') {
    const ro = act.key && roleOf(act.key);
    if (act.key && (!ro || ro[1] !== p.line)) r = {ok: false, note: 'Роль — для полевого игрока в своей линии'};
    else { p.role = act.key; r.note = ro ? `№${p.number} — ${ro[2]}` : `№${p.number} — без роли`; }
  }
  if (r.ok) demoRefresh();
  onAck({type: 'ack', id: act.id, ...r});
  onState(S);
}

if (ROOM) {
  connect();
  // бот не подключён к комнате (давно не открывали пульт, перезапуск) — страница сама его не разбудит
  const entry = ROOM.startsWith('entry-');
  setTimeout(() => { if (!S && !ended) $('conn').textContent = entry ? 'Бот не отвечает. Подождите немного или закройте и откройте игру снова.'
    : 'Бот не отвечает. В чате нажмите «🏠 Главная» и откройте игру снова кнопкой «🎮 Игра».'; }, entry ? 15000 : 8000);
}
else { S = demoState(); S.hub.manage = demoManage(); demoRefresh(); if (Q.get('demo') === 'new') demoNoClub(); onState(S); toast('Демо без бота: изменения не сохраняются'); }
</script>
</body>
</html>
