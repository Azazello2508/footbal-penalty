<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Футбольный менеджер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1220;--card:#131c31;--card2:#1b2742;--line:#26344f;--text:#e8eefc;--muted:#93a3c3;--accent:#facc15;
  --ok:#22c55e;--bad:#f87171;--pitch:#166534;--pitch2:#15803d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{padding:calc(10px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
#club{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card2);white-space:nowrap}
#status.ok{background:rgba(34,197,94,.18);color:#86efac}
#status.bad{background:rgba(248,113,113,.16);color:#fecaca}
.banner{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;margin:8px 0;color:var(--muted)}
.banner.warn{border-color:#a16207;color:#fde68a}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.chip b{display:block;font-size:16px}
.chip span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.chip.on{border-color:var(--accent);background:rgba(250,204,21,.12)}
.chip.on span{color:#fde68a}
#pitch{position:relative;border-radius:16px;padding:12px 6px;background:repeating-linear-gradient(180deg,var(--pitch) 0 44px,var(--pitch2) 44px 88px);
  border:2px solid rgba(255,255,255,.55);display:flex;flex-direction:column;gap:12px;overflow:hidden}
#pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.4)}
#pitch:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid rgba(255,255,255,.4);border-radius:50%}
.line{position:relative;z-index:1;display:flex;justify-content:space-evenly;gap:4px;min-height:74px}
.line .tag{position:absolute;left:6px;top:-2px;font-size:10px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.05em}
.pl{display:flex;flex-direction:column;align-items:center;width:84px;padding:2px;border-radius:12px;background:transparent}
.pl .shirt{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;
  background:#f8fafc;color:#0f172a;box-shadow:0 3px 8px rgba(0,0,0,.4);border:3px solid #fff}
.pl.gk .shirt{background:#fb923c;border-color:#fed7aa}
.pl .nm{margin-top:5px;font-size:12px;line-height:1.15;max-width:84px;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,0,0,.8)}
.pl .nm .n{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pl .rtl{margin-top:2px;line-height:0}
.pl .bd{position:absolute;right:-8px;top:-8px;font-size:13px;line-height:1}
.pl .warn{position:absolute;left:-8px;top:-8px;font-size:13px}
/* сила на позиции (1–99, сервер: player_stats.position_power) — плашка у кружка; оценка за последние матчи
   (сервер: player_stats.recent_ratings) — мелко рядом с именем, цветом по уровню */
.pw{position:absolute;right:-15px;bottom:-6px;min-width:24px;padding:1px 4px;border-radius:7px;font-size:12px;font-weight:800;line-height:15px;
  text-align:center;font-family:system-ui,"Segoe UI",sans-serif;background:#0f172a;color:#f8fafc;border:1.5px solid #f8fafc;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.rt{display:inline-block;flex:none;min-width:22px;padding:0 3px;border-radius:5px;font-size:10px;font-weight:700;line-height:13px;text-align:center;
  font-family:system-ui,"Segoe UI",sans-serif;background:#475569;color:#e2e8f0;text-shadow:none}
.rt.r1{background:#dc2626;color:#fff}.rt.r2{background:#f59e0b;color:#1c1300}.rt.r3{background:#22c55e;color:#052e16}.rt.r4{background:#2563eb;color:#fff}
.sh-top .rt,.sh-top .pwl{font-size:13px;line-height:17px;padding:1px 6px;vertical-align:1px;border-radius:6px}
.sh-top .pwl{display:inline-block;font-weight:800;background:#0f172a;color:#f8fafc;border:1px solid var(--line)}
.big.swapbtn{background:var(--ok);color:#052e16;margin:10px 0 2px}
.big.swapbtn:disabled{opacity:.45;cursor:default}
.pl.sel .shirt{outline:3px solid var(--accent);outline-offset:2px}
.swapping .pl .shirt{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#bench{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
#bench .pl{width:auto}
#bench .pl .nm{text-shadow:none}
#swapbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#422006;color:#fde68a;
  border:1px solid #a16207;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px}
#swapbar button{background:rgba(255,255,255,.12);padding:6px 10px;border-radius:9px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
/* карточка игрока */
#veil{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:var(--sheet-h,88vh);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:18px 18px 0 0;
  border-top:1px solid var(--line);padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
#sheet .in{max-width:520px;margin:0 auto}
.sh-top{display:flex;align-items:flex-start;gap:10px}
.sh-top h2{margin:0;font-size:19px;flex:1}
.sh-top small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:3px}
.x{background:var(--card2);width:34px;height:34px;border-radius:50%;font-size:18px;flex:none}
.st{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.st .t{font-size:14px}
.st .t b{font-size:16px;margin-left:4px}
.st .barw{grid-column:1/-1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.st .bar{height:100%;background:var(--accent)}
.st .btns{display:flex;gap:4px}
.st .btns button{width:40px;height:34px;border-radius:9px;background:var(--card2);font-weight:700;font-size:14px}
.st .btns button:disabled{opacity:.3}
#left{margin:10px 0;font-size:15px;text-align:center}
#left.ok{color:#86efac}
.big{display:block;width:100%;padding:13px;border-radius:13px;font-weight:700;font-size:16px;background:var(--accent);color:#111;margin-top:6px}
.big:disabled{background:var(--card2);color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.acts button{background:var(--card2);padding:11px 8px;border-radius:12px;font-size:14px;text-align:center}
.acts button.on{outline:2px solid var(--accent)}
.tal{display:block;width:100%;text-align:left;background:var(--card2);padding:10px 12px;border-radius:12px;margin-top:6px;font-size:14px}
.tal span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tal.on{outline:2px solid var(--accent)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;max-width:90vw;
  background:#0f172a;border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:12px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
#toast.bad{border-color:#b91c1c;color:#fecaca}
#conn{text-align:center;color:var(--muted);font-size:14px;margin:40px 0}
/* вкладки игры */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(6,1fr);background:#0f172a;
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav button{background:transparent;padding:4px 0;border-radius:10px;color:var(--muted);font-size:10.5px;position:relative;white-space:nowrap;min-width:0}
#nav .nl{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}      /* узкий экран: подпись не налезает на соседнюю */
#nav button i{display:block;font-style:normal;font-size:21px;line-height:1.2}
#nav button.on{color:var(--accent);background:rgba(250,204,21,.08)}
#nav .dot{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:#dc2626;color:#fff;
  font-size:11px;line-height:17px;padding:0 4px}
/* 🛍 магазин и пометка NEW */
#nav .nw{position:absolute;top:-2px;left:calc(50% + 1px);background:#ef4444;color:#fff;font-size:8.5px;font-weight:800;border-radius:6px;padding:1px 4px;line-height:1.3;letter-spacing:.03em}
.shtop{display:flex;align-items:center;gap:10px;margin:2px 0 4px}.shtop h1{font-size:21px;margin:0;flex:1}.shnew{font-size:10px;font-weight:800;background:#ef4444;color:#fff;border-radius:6px;padding:2px 6px}
.shsub{color:var(--muted);font-size:12.5px;line-height:1.4}
.shjump{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 4px;padding:0 16px 4px;scrollbar-width:none}.shjump::-webkit-scrollbar{display:none}
.shjump button{flex:none;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12.5px}
.shclosed{background:linear-gradient(135deg,#1e293b,#312e81);border:1px solid #4338ca;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0}
.shsec{margin:18px 0 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);scroll-margin-top:10px}
.shit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;position:relative}
.shit.off{border-color:#a16207;background:linear-gradient(180deg,rgba(234,179,8,.08),var(--card) 40%)}
.shotag{display:inline-block;font-size:10.5px;font-weight:800;color:#2a1c00;background:linear-gradient(135deg,#fff4b8,#e8b923);border-radius:8px;padding:2px 7px;margin-bottom:4px}
.shhd{display:flex;justify-content:space-between;align-items:center;gap:8px}.shhd>div{min-width:0}.shhd b{font-size:15px;overflow-wrap:anywhere}.shhd small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.shlad{display:flex;gap:3px;flex:none}.shlad i{width:14px;height:6px;border-radius:3px;background:#334155}.shlad i.on{background:var(--accent)}
.shpair{display:grid;grid-template-columns:1fr 18px 1fr;gap:4px;align-items:center;width:100%;margin-top:8px;padding:0;background:none;text-align:left;color:var(--text)}.shpair>span{min-width:0}
.shpair svg,.shnf svg,.shpromo svg{width:100%;height:auto;display:block;border-radius:10px}.shpair .ar{text-align:center;color:var(--muted)}
.shcap{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:3px}
.shwhat{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4}.shwhat b{color:var(--text);font-weight:600}
.shbig{margin-top:8px}.shmax{font-size:12.5px;color:#4ade80;margin-top:8px}
.shsoon,.shsw{display:flex;align-items:center;justify-content:center;border-radius:16px;padding:10px;background:var(--card2);color:var(--muted);font-weight:700;font-size:13.5px;border:1px dashed var(--line);text-align:center}
.shsw{color:var(--text);border-style:solid}.shwarn{font-size:12.5px;margin:0 0 4px}
.shpack{display:flex;align-items:center;gap:10px}.shpack .ic{font-size:26px}.shpack .tx{flex:1;min-width:0;font-size:13px}.shpack .tx small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}.shpack .tx b{white-space:nowrap}
.shbadge{position:absolute;right:10px;top:-8px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.04em}
.kbuy.shpk{width:auto;flex:none;padding:7px 9px}
.shnf{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}.shnf.one{grid-template-columns:1fr}.shnfl{font-size:12.5px;line-height:1.45}.shnfl div{margin:3px 0}.shnfl .lk{color:var(--muted)}
.shpromo{display:grid;grid-template-columns:1fr 80px 66px;gap:8px;align-items:center;width:100%;margin:6px 0 8px;padding:10px;border-radius:16px;text-align:left;color:var(--text);
  border:1px solid #a16207;background:linear-gradient(135deg,#2a1d05,#1b2742 60%,#2a1645);box-shadow:0 4px 18px rgba(245,197,66,.15)}
.shpromo b{font-size:15px;white-space:nowrap}@media (max-width:370px){.shpromo{grid-template-columns:1fr 70px 58px;gap:6px}}.shpromo b i{font-style:normal;font-size:10px;font-weight:800;background:#ef4444;color:#fff;border-radius:6px;padding:2px 5px;vertical-align:2px}
.shpromo small{display:block;color:#fde68a;font-size:12px;margin-top:4px;line-height:1.3}.shpt{min-width:0}.shpm{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.card h3{margin:0 0 6px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card.need{border-color:#a16207;background:#1f1a0b}
.card.warnc{border-color:#a16207}
.go{display:block;width:100%;margin-top:9px;padding:10px;border-radius:11px;background:var(--card2);font-size:14px;text-align:center}
.go.main{background:var(--accent);color:#111;font-weight:700}
.crest{display:flex;align-items:center;gap:12px;margin:4px 0 6px}
.badge{flex:none;width:58px;height:66px;border-radius:12px 12px 29px 29px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.6);color:#fff}
.crest h1{margin:0;font-size:21px;line-height:1.15}
.crest small{display:block;color:var(--muted);font-size:13px;margin-top:3px;font-weight:400}
.crest svg.crbig{flex:none;width:74px;height:84px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.ofcrest{text-align:center;margin:2px 0 8px}.ofcrest svg.crbig{width:80px;height:96px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
svg.cr{flex:none;width:18px;height:22px;vertical-align:-5px;margin-right:6px}
svg.crl{width:26px;height:31px;vertical-align:-9px}
.menu button.off{opacity:.55}
.crestprev{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 4px}.crestprev svg.crbig{width:150px;height:150px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.crrow{background:var(--card2);padding:8px 10px;border-radius:10px;font-size:14px}.crrow .sub{margin-top:2px}
.crgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.crgrid.mot{grid-template-columns:repeat(2,1fr)}.crlet{display:block;font-size:22px;font-weight:900;line-height:1.1}.crgrid.mot .crt{font-size:12px;font-weight:700;color:var(--text);min-height:34px}.crgrid.ready .crt svg{width:96px;height:100px}.crgrid.ready .crt span{font-size:12px;font-weight:700;color:var(--text)}.crgrid.ready{grid-template-columns:repeat(3,1fr)}.crgrid.sym{grid-template-columns:repeat(6,1fr)}
.crt{background:var(--card2);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--muted);text-align:center;min-height:40px}.crt.on{outline:2px solid var(--accent)}
/* узкий экран (320–360): плитки, кнопка покупки и цена сжимаются, а не раздвигают лист вбок */
.crgrid>.crt{min-width:0;overflow-wrap:anywhere;hyphens:auto}.crgrid.ready .crt svg{max-width:100%;height:auto}.kbuy>span:first-child{min-width:0}
.crt svg{display:block;margin:0 auto 2px;width:36px;height:43px}.crgrid.sym .crt svg{width:30px;height:30px;margin:0 auto}
.crt.lock,.go.lock{position:relative}.crt.lock>svg,.crt.lock>b,.color.lock,.crgrid.mot .crt.lock span{opacity:.4}.crt.lock::after,.color.lock::after{content:'🔒';position:absolute;top:2px;right:3px;font-size:10px;line-height:1}
.crt .lk{display:block;font-size:10px;font-style:normal;color:var(--muted);font-weight:600}.color.lock{position:relative}.color.lock::after{top:50%;left:50%;right:auto;transform:translate(-50%,-50%)}
.crlv{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0}.crlv b{font-size:16px}.crlv .sub{margin-top:3px;font-size:13px;color:var(--muted)}.crlv .go{margin-top:8px}
.crhead{border-radius:12px;padding:9px 12px;margin:6px 0;font-size:14px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.crhead.off{background:linear-gradient(135deg,#3b2a05,#6b4e0a);border-color:#e8b923;color:#fde68a}
.crbase{display:flex;align-items:center;gap:10px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13px;color:var(--muted)}.crbase svg{width:44px;height:53px;flex:none}.crbase b{color:var(--text)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats3 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.stats3 b{display:block;font-size:19px}
.stats3 span{font-size:11px;color:var(--muted)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:16px;height:16px;border-radius:50%;font-style:normal;font-size:10px;line-height:16px;text-align:center;color:#0b1220;font-weight:700}
.form .В{background:#22c55e}.form .Н{background:#facc15}.form .П{background:#f87171}
.score{font-weight:800;font-size:18px;white-space:nowrap}
.res-В{color:#86efac}.res-Н{color:#fde68a}.res-П{color:#fca5a5}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0 10px}
.seg button{background:transparent;padding:8px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);font-weight:700}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.cupm{padding:8px 0;border-top:1px solid var(--line);gap:8px}.cupm:first-child{border-top:0}
.cupm .w{font-weight:700;color:var(--accent)}.cupm.me,.row.me{background:rgba(250,204,21,.08);border-radius:8px}
.tb th{font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:4px 2px}
.tb td{padding:8px 2px;border-top:1px solid var(--line);text-align:center}
.tb td.n{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb tr.me td{background:rgba(250,204,21,.1);font-weight:700}
.tb td.pts{font-weight:800}
/* полка трофеев и лучшие менеджеры */
.tb.top td.n{max-width:none;white-space:normal}.tb.top td.n small{display:block;color:var(--muted);font-size:11px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.tb.top td,.tb.top th{padding-left:3px;padding-right:3px}
.trophy{display:flex;gap:10px;align-items:center}.trophy .ic{font-size:26px;line-height:1}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.recs .card{margin:0;min-width:0}.recs b{font-size:20px;display:block;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.item{padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.item:first-of-type{border-top:0}
.item small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.item.new{color:#fff}.item.new small:after{content:" · новое";color:var(--accent)}
button.item{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;font-size:14px;cursor:pointer}
button.item i{display:block;font-style:normal;font-size:12px;color:var(--accent);margin-top:2px}
button.item.more{text-align:center;color:var(--accent);font-weight:600}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pstats div{background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center}
.pstats b{display:block;font-size:20px}.pstats span{font-size:11px;color:var(--muted)}
tr[data-pedit]{cursor:pointer}
.scoutb{border-color:var(--accent)!important}
.ask{border:1px solid #38bdf8;background:linear-gradient(135deg,rgba(56,189,248,.12),var(--card))}.ask .wtag{color:#7dd3fc}
.ask h3 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.daily{border:1px solid #a78bfa;background:linear-gradient(135deg,rgba(167,139,250,.14),var(--card))}
.daily .wtag{font-size:12px;color:#c4b5fd;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
.daily h3{margin:6px 0 2px;font-size:16px;line-height:1.3;text-transform:none;letter-spacing:0;font-family:inherit}.daily .dtheme{font-size:12px;color:var(--muted)}
.daily .dopt{display:block;width:100%;text-align:left;background:var(--card2);padding:12px;border-radius:12px;margin-top:6px;font-size:15px;border:1px solid transparent;color:var(--text)}
.daily .dopt:disabled{opacity:.6}.daily .dopt.right{border-color:#22c55e;background:rgba(34,197,94,.14)}.daily .dopt.wrong{border-color:#ef4444;background:rgba(239,68,68,.12)}
.daily .dres{margin-top:8px;font-weight:700}.daily .dstreak{margin-top:8px;font-size:13px;color:var(--muted)}.daily .dstreak b{color:var(--text)}
.ricon{font-size:11px}.ricon.off{opacity:.35;filter:grayscale(1)}
.chem{display:block;width:100%;margin:6px 0;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;text-align:left}
.chem .cbar{display:block;height:6px;border-radius:3px;background:var(--card2);margin-top:6px;overflow:hidden}.chem .cbar i{display:block;height:100%;background:#22c55e}
.acts button small{display:block;font-size:10px;color:var(--muted)}
.chem .crule{display:block;margin-top:6px;color:var(--muted);font-size:12px;line-height:1.35}
.sublabel{font-size:13px;font-weight:700;margin:12px 0 6px}
.formrow{display:flex;gap:6px}.formrow .fr{flex:1;text-align:center;border-radius:10px;padding:6px 0;font-weight:800;background:var(--card2)}
.formrow .fr small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.fr.res-В{background:#14532d}.fr.res-П{background:#7f1d1d}.fr.res-Н{background:#374151}
.tbar{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}.tbar b{text-align:right}
.tbar .barw{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}.tbar .bar{height:100%;background:var(--accent)}
.wnew{border:1px solid var(--accent);background:linear-gradient(135deg,rgba(250,204,21,.12),var(--card))}
/* первые шаги, разрешение писать в чат, подсказки «один раз» (app/onboarding.py) */
.obs{border:1px solid #22c55e;background:linear-gradient(135deg,rgba(34,197,94,.12),var(--card))}
.obs .wtag{font-size:12px;color:#86efac;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
.obs .obar{height:8px;border-radius:6px;background:var(--card2);margin:8px 0 4px;overflow:hidden}.obs .obar i{display:block;height:100%;background:#22c55e;border-radius:6px}
.obstep{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.obstep:first-of-type{border-top:0}
.obstep .ck{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}
.obstep.done .ck{background:#22c55e;border-color:#22c55e;color:#06210f}.obstep.done .tx b{color:var(--muted);text-decoration:line-through}
.obstep .tx{flex:1;min-width:0}.obstep .tx b{display:block;font-size:14px;font-weight:600}.obstep .tx span{display:block;font-size:12px;color:var(--muted)}
.obstep .do{flex:0 0 auto;padding:6px 10px;border-radius:9px;background:var(--accent);color:#111;font-weight:700;font-size:13px}
.obhide{display:block;margin:8px auto 0;background:none;color:var(--muted);font-size:12px;text-decoration:underline}
.wask{border:1px solid #38bdf8;background:linear-gradient(135deg,rgba(56,189,248,.12),var(--card))}
.tip{background:rgba(250,204,21,.1);border:1px solid #a16207;border-radius:12px;padding:9px 12px;margin:8px 0;font-size:13px;line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.tip span{flex:1}.tip button{flex:0 0 auto;padding:5px 10px;border-radius:9px;background:var(--accent);color:#111;font-weight:700;font-size:12px}
/* «Сообщество игры» на «Главной»: свой зелёный фон и белый текст — не зависит от темы Telegram */
.comm{display:grid;grid-template-columns:42px minmax(0,1fr) auto;column-gap:10px;row-gap:3px;align-items:center;width:100%;text-align:left;
  margin:8px 0;padding:12px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#15803d 0%,#16a34a 55%,#22c55e 100%);
  border:1px solid #4ade80;box-shadow:0 4px 14px rgba(22,163,74,.35)}
.comm .ci{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px}
.comm .cb{min-width:0;display:flex;flex-direction:column}
.comm .cb b{font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comm .cb small{font-size:12px;color:#dcfce7}
.comm .cnews,.comm .cs{grid-column:1/-1;font-size:12px;line-height:1.3}
.comm .cnews{margin-top:5px;color:#f0fdf4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comm .cs{color:#dcfce7}
.comm .cgo{padding:8px 12px;border-radius:10px;background:#fff;color:#15803d;font-weight:700;font-size:13px;white-space:nowrap}
.comm.thin{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:14px;box-shadow:none}
.comm.thin .ct{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comm.thin .ct span{color:#dcfce7}
.comm.thin .ca{font-size:20px;line-height:1;font-weight:700}
.wnew h3{margin:4px 0 6px}.wnew .wtag{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.item .kick{display:block;margin-top:6px;background:none;border:1px solid var(--line);color:#fca5a5;border-radius:10px;padding:5px 10px;font:inherit;font-size:13px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mrow button{padding:10px 6px;border-radius:11px;background:var(--card2);font-size:14px}
.mrow button.ok{background:#166534;color:#dcfce7}
.mrow button.no{background:#3f1d1d;color:#fecaca}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.slots button{padding:11px 6px;border-radius:11px;background:var(--card2);font-size:15px}
.slots button.now{grid-column:1/-1;background:var(--accent);color:#111;font-weight:700}
.own{display:flex;gap:6px;margin-top:8px}
.own input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px;font:inherit;font-size:15px}
.own button{background:var(--accent);color:#111;font-weight:700;border-radius:11px;padding:0 14px}
.kind{display:block;width:100%;text-align:left;background:var(--card2);padding:11px 12px;border-radius:12px;margin-top:6px;font-size:15px}
.kind span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.kind.on{outline:2px solid var(--accent)}
.menu button{display:flex;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin-top:6px;font-size:15px}
.menu button:after{content:"в чате ›";color:var(--muted);font-size:12px;align-self:center}
.menu.app button{flex-direction:column;align-items:flex-start;position:relative;padding-right:28px}
.menu.app button span{color:var(--muted);font-size:12px;margin-top:3px}
.menu.app button:after{content:"›";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:20px}
/* раздел «Клуб» */
.kind:disabled{opacity:.45}
.own+.own{margin-top:6px}
.go.danger{color:#fca5a5}
.invite{word-break:break-all;font-size:13px;color:var(--muted);margin-top:6px}
.mrow2{display:flex;gap:6px}.mrow2 .go{flex:1}
.report{white-space:pre-wrap;font-size:14px;line-height:1.45;background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:6px}
.kits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.kits div{background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;color:var(--muted)}
.colors{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
/* 👕 витрина формы: карточка kitCard (уровни 1–5), переворот, распаковка, покупка уровней, «перед матчем» */
.kc-sw{animation:kcsw 4s ease-in-out infinite}@keyframes kcsw{0%{transform:translateX(0)}65%,100%{transform:translateX(300px)}}
.kc-pl{animation:kcpl 2.6s ease-in-out infinite alternate}@keyframes kcpl{from{opacity:.35}to{opacity:1}}
.kc-sh{animation:kcsh 3.2s ease-in-out infinite alternate}@keyframes kcsh{from{opacity:.2}to{opacity:1}}
.kc-tw{animation:kctw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes kctw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.kc-run{animation:kcrun 7s linear infinite}@keyframes kcrun{to{stroke-dashoffset:-920}}
.kflip:not(.bk) .kfb *,.kflip.bk .kff *{animation:none}
.kflip{display:block;width:100%;padding:0;background:none;perspective:1000px;border-radius:16px}.kfi{position:relative;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}.kflip.bk .kfi{transform:rotateY(180deg)}
.kff,.kfb{backface-visibility:hidden;-webkit-backface-visibility:hidden}.kfb{position:absolute;inset:0;transform:rotateY(180deg)}.kflip svg,.kub svg.kcard,.kgk svg{width:100%;height:auto;display:block;border-radius:16px}
.kub{display:block;width:100%;padding:0;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 55%,#1e293b,#05070c);color:#fff}
.kub-card{opacity:0;transform:translateY(35%) scale(.55);animation:kubup .9s 1.15s cubic-bezier(.2,.9,.25,1.15) forwards}
.kub-pk{position:absolute;left:30%;top:32%;width:40%;animation:kubsh .9s ease-in-out}.kub-pk svg{display:block;width:100%}
.kub-lid{position:relative;z-index:1;margin-bottom:-2px;animation:kublid .8s .95s cubic-bezier(.3,.6,.3,1) forwards}.kub-box{animation:kubgo .35s 1.05s forwards}
.kub-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.6) 30%,rgba(255,255,255,0) 70%);opacity:0;animation:kubfl .6s .9s forwards}
.kub-cf{position:absolute;left:50%;top:42%}.kub-cf i{position:absolute;width:6px;height:10px;border-radius:2px;opacity:0;animation:kubcf 1.7s cubic-bezier(.15,.7,.4,1) forwards}
.kub-t{position:absolute;left:0;right:0;top:12px;text-align:center;font-weight:700;font-size:16px;line-height:1.2;color:#fff;text-shadow:0 2px 10px #000;opacity:0;transform:scale(.6);animation:kubt .5s 1.9s cubic-bezier(.2,.9,.3,1.4) forwards}
@keyframes kubup{to{opacity:1;transform:none}}@keyframes kubsh{0%,100%{transform:none}15%,55%{transform:rotate(-5deg) translateX(-3%)}35%,75%{transform:rotate(5deg) translateX(3%)}}
@keyframes kublid{to{transform:translateY(-260%) rotate(-28deg);opacity:0}}@keyframes kubgo{to{opacity:0;transform:scale(1.4)}}@keyframes kubfl{30%{opacity:1}to{opacity:0}}
@keyframes kubcf{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.3)}80%{opacity:1}to{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}@keyframes kubt{to{opacity:1;transform:none}}
.kub.done .kub-card,.kub.done .kub-t{animation:none;opacity:1;transform:none}.kub.done .kub-pk,.kub.done .kub-cf{display:none}.kub.done .kub-flash{animation:none}.kub.done.rm .kub-flash{animation:kubfl .45s forwards}
.khero{position:relative;margin:10px 0 2px;min-height:60px}.ktag{position:absolute;left:12px;top:10px;z-index:2;pointer-events:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.45);color:#fff;letter-spacing:.04em}
.ktag.l4,.klt.l4{background:linear-gradient(135deg,#fff4b8,#e8b923 40%,#9a6b00);color:#2a1c00}.ktag.l5,.klt.l5{background:linear-gradient(90deg,#ff1f8f,#a855f7,#00e5ff);color:#fff}
.kcap{text-align:center;margin:4px 0 6px}
.kchips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:2px 0 8px}.kshop .sub{font-size:12.5px;line-height:1.35;color:var(--muted);margin-top:6px}.kchips button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;border-radius:12px;background:var(--card2);padding:6px 2px;font-size:11px;font-weight:600;line-height:1.15}
.kchips small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:2px}.kchips .on{box-shadow:0 0 0 2px var(--accent) inset}.kchips .own small{color:#4ade80}
.kacts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:stretch;margin-top:8px}.kacts.one{grid-template-columns:1fr}@media (max-width:370px){.kacts{grid-template-columns:1fr}.ktry{padding:8px 14px}}      /* узкий экран: «Примерить» над кнопкой покупки */
.ktry{border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 14px;background:rgba(255,255,255,.06);font-weight:700;font-size:14px;box-shadow:0 0 16px rgba(94,181,247,.25)}
.kbuy{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border-radius:16px;padding:10px 12px;font-weight:800;font-size:14.5px;line-height:1.2;text-align:left;color:#2a1c00;overflow:hidden;
 background:linear-gradient(135deg,#fff4b8,#f5c542 35%,#e8a90c 70%,#ffe27a);box-shadow:0 6px 22px rgba(245,197,66,.38),inset 0 1px 0 rgba(255,255,255,.7)}
.kbuy.l5{background:linear-gradient(120deg,#ff5fc8,#a855f7 40%,#22d3ee);color:#fff;box-shadow:0 6px 24px rgba(168,85,247,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.kbuy.l2,.kbuy.l3{background:linear-gradient(135deg,#7cc4ff,#2f8ff0 55%,#1f6fd1);color:#fff;box-shadow:0 6px 20px rgba(47,143,240,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.kbuy::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:kbsh 3.2s ease-in-out infinite}@keyframes kbsh{60%,100%{transform:translateX(100%)}}
.kbuy .pr{background:rgba(0,0,0,.22);color:#fff;border-radius:12px;padding:6px 10px;font-size:16px;white-space:nowrap}.kbuy small{display:block;font-weight:600;font-size:11.5px;opacity:.8}
.kall{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;width:100%;min-width:0;margin-top:8px;border:1px dashed rgba(245,197,66,.55);background:rgba(245,197,66,.08);border-radius:14px;padding:9px 12px;font-weight:600;font-size:13.5px;line-height:1.2;text-align:left}
.kall b{margin-left:auto;white-space:nowrap;max-width:100%}      /* узкий экран: цена переносится строкой ниже, лист не прокручивается вбок */.kbadge{background:#ef4444;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;letter-spacing:.04em}
.kduel>div{min-width:0}
.kunder{display:grid;grid-template-columns:42% 1fr;gap:8px;align-items:center;margin:6px 0}.kunder.one{grid-template-columns:1fr}.kunder.one .kgk{width:50%;margin:0 auto}
.kgk{text-align:center;font-size:11px;color:var(--muted)}.kgk span{display:block;margin-top:3px}
.kpatch{display:flex;gap:8px;align-items:center;background:var(--card2);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--muted)}.kpatch b{color:var(--text)}
.crgrid .crt svg.kmini{width:46px;height:50px}.crgrid.kittabs .crlet{height:50px;line-height:50px;font-size:20px}.kitx{float:right;background:none;border:0;color:var(--accent);font-size:12px;padding:0}
.kduel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:10px 0 2px}.kduel svg{width:100%;height:auto;display:block;border-radius:12px}.kvs{font-weight:900;font-size:16px;color:var(--muted)}
.kdn{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:5px;font-size:12px;font-weight:700;min-width:0}.kdn span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.klt{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:10px;background:rgba(127,127,127,.25);white-space:nowrap}.klt.l3{background:linear-gradient(135deg,#f1f5f9,#94a3b8);color:#1e293b}.klt.l2{background:#2f8ff0;color:#fff}
@media (prefers-reduced-motion:reduce){.kc-sw,.kc-pl,.kc-sh,.kc-tw,.kc-run,.kbuy::after{animation:none}.kfi{transition:none}}
.color{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.35);max-width:36px;justify-self:center;width:100%}
.color.on{outline:3px solid var(--accent);outline-offset:2px}
.cardsgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{background:var(--card2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.mini .shirt{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:3px solid rgba(255,255,255,.8)}
.mini span{color:var(--muted);font-size:11px}
.pcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card2);margin-top:6px}
.pcard .top{display:flex;align-items:center;gap:12px;padding:12px}
.pcard .top .shirt{flex:none;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;border:3px solid rgba(255,255,255,.85)}
.pcard .top b{display:block;font-size:18px}
.pcard .top small{color:rgba(255,255,255,.85);font-size:13px}
.pcard .tags{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 6px}
.pcard .tags i{font-style:normal;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(250,204,21,.15);color:#fde68a;text-transform:uppercase;letter-spacing:.04em}
.pcard .body{padding:4px 12px 12px;background:var(--card)}
.pcard .cond{font-size:13px;color:var(--muted);margin-top:8px;white-space:pre-wrap}
/* «📖 Обучение»: подсказки поверх настоящих экранов (app/learning.py) */
.tblk{position:fixed;z-index:30;background:rgba(2,6,23,.74);touch-action:none}
#tring{position:fixed;z-index:31;border:3px solid var(--accent);border-radius:12px;pointer-events:none;box-shadow:0 0 0 4px rgba(250,204,21,.22),0 0 18px rgba(250,204,21,.35)}
#tbub{position:fixed;z-index:32;left:12px;right:12px;max-width:496px;margin:0 auto;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:#0f172a;border:1px solid var(--accent);border-radius:14px;padding:11px 12px 12px;box-shadow:0 10px 30px rgba(0,0,0,.65)}
#tbub.center{max-height:84vh}
#tbub.shake{animation:tshake .35s}
@keyframes tshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

<script>
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
if (TG) { TG.ready(); TG.expand(); try { TG.setHeaderColor('#0b1220'); TG.setBackgroundColor('#0b1220'); } catch (e) { /* старый Telegram */ } }
// высота окон (карточка игрока, матч, раздел «Клуб») — от видимой области Telegram, а не от vh: в Telegram на iPhone
// vh бывает неверным, и окно выезжало узкой полоской (так же сделано на экране матча — webapp/match, fit)
function fitSheet() { const vh = (TG && TG.viewportStableHeight) || innerHeight; if (vh > 100) document.documentElement.style.setProperty('--sheet-h', Math.round(vh * .88) + 'px'); }
fitSheet(); addEventListener('resize', fitSheet);
if (TG && TG.onEvent) { try { TG.onEvent('viewportChanged', fitSheet); } catch (e) { /* старый Telegram */ } }
// непредвиденная ошибка — видна на экране (и её можно прислать), а не «ничего не происходит»
addEventListener('error', e => { try { toast('Ошибка страницы: ' + e.message, true); } catch (err) { /* ещё нет toast */ } });
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
function haptic(kind) { try { if (!TG) return; if (kind === 'ok' || kind === 'bad') TG.HapticFeedback.notificationOccurred(kind === 'ok' ? 'success' : 'error'); else TG.HapticFeedback.impactOccurred('light'); } catch (e) { /* нет вибро */ } }
let toastT = 0;
function toast(text, bad) {
  const t = $('toast'); t.textContent = text; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => { t.className = bad ? 'bad' : ''; }, 2600);
}

/* ---------------- состояние и отрисовка ---------------- */
let S = null;              // последнее состояние клуба от бота
let open = null;           // слот игрока в открытой карточке
let draft = null;          // раскладка очков в карточке (ещё не сохранена)
let swapFrom = null;       // слот игрока, которого меняем местами
let talentList = false;    // в карточке открыт выбор таланта
const LINES = [['att', 'Нападение'], ['mid', 'Полузащита'], ['def', 'Защита']];

function player(slot) { return S.players.find(p => p.slot === slot); }
function shortName(p) { const parts = p.name.split(' '); return parts[parts.length - 1]; }
function badges(p) {
  return (S.captain === p.slot ? '👑' : '') + (S.penalty === p.slot ? '🎯' : '') + (S.talent_slot === p.slot && S.talent ? '⭐' : '');
}
function rtClass(r) { return r == null ? '' : r < 6 ? ' r1' : r < 7 ? ' r2' : r < 8 ? ' r3' : ' r4'; }
function powerTag(p) { return p.power == null ? '' : `<span class="pw" title="сила на позиции">${p.power}</span>`; }   // считает бот
function ratingTag(p) {      // оценку считает бот; «—» — ещё не играл ни одного матча с оценкой
  const r = p.rating;
  return `<span class="rt${rtClass(r)}" title="${r == null ? 'ещё не играл' : 'рейтинг за последние матчи'}">${r == null ? '—' : Number(r).toFixed(1)}</span>`;
}
function token(p) {
  const warn = p.injury ? '🚑' : !p.stats ? '⚠️' : '';
  return `<button type="button" class="pl${p.place === 'gk' ? ' gk' : ''}${swapFrom === p.slot ? ' sel' : ''}" data-slot="${p.slot}">` +
    `<div class="shirt">${p.number}${badges(p) ? `<span class="bd">${badges(p)}</span>` : ''}${warn ? `<span class="warn">${warn}</span>` : ''}${powerTag(p)}</div>` +
    `<div class="nm"><span class="n">${esc(shortName(p))}</span>${roleIcon(p) ? `<span class="ricon${p.role_off ? ' off' : ''}">${roleIcon(p)}</span>` : ''}</div>` +
    `<div class="rtl">${ratingTag(p)}</div></button>`;
}
function roleOf(k) { return (S.field_roles || []).find(r => r[0] === k); }     // [ключ, линия, название, описание]
function roleIcon(p) { const r = p.role && roleOf(p.role); return r ? r[2].split(' ')[0] : ''; }

/* ---------------- вкладки игры: главная, лига, ещё ---------------- */
let TAB = new URLSearchParams(location.search).get('tab') || 'home';
let SEG = 'table';           // вкладка «Лига»: таблица или матчи
const TABS = ['home', 'squad', 'league', 'shop', 'learn', 'more'];
if (!TABS.includes(TAB)) TAB = 'home';
const H = () => (S && S.hub) || {};   // до первого состояния от бота S ещё нет (секундомер поиска спрашивает каждую секунду)
// повторы состояния — один раз (app/hub.py crest_in, slots_in): эмблема клуба — по ключу cr из H().crests, варианты
// времени матча — по номеру sl из H().slot_lists; прежний вид (целая эмблема crest, slots в матче) тоже понимаем
const crestOf = x => (x && (x.crest || (x.cr != null && (H().crests || {})[x.cr]))) || null;
const slotsOf = m => m.slots || (Number.isInteger(m.sl) && (H().slot_lists || [])[m.sl]) || [];
let SEEK_HB = null, SEEK_AT = 0;      // поиск соперника: с какого момента (по часам телефона) идёт — для секундомера
function seekBlock() {
  const hb = H();
  if (hb.seek == null) return `<button type="button" class="go main" data-seek>🔎 Найти соперника</button>`;
  if (hb !== SEEK_HB) { SEEK_HB = hb; SEEK_AT = Date.now() - hb.seek * 1000; }
  return `<div class="card wnew"><h3>🔎 Ищем соперника… <span class="seekt">${seekTime()}</span></h3>` +
    `<div class="note">Если за минуту живого соперника не найдётся, вызов примет бот (🤖 так и будет подписано). Простой товарищеский: без усталости, травм и таблицы.</div>` +
    `<button type="button" class="go" data-unseek>Отмена</button></div>`;
}
function seekTime() { const t = Math.max(0, Math.floor((Date.now() - SEEK_AT) / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
setInterval(() => { if (H().seek != null) document.querySelectorAll('.seekt').forEach(e => { e.textContent = seekTime(); }); }, 1000);
const formDots = f => f && f.length ? `<span class="form">${f.map(x => `<i class="${x}">${x}</i>`).join('')}</span>` : '';
/* ---------------- эмблемы клубов (параметры — с сервера, app/crests.py; символы — game-icons.net, CC BY 3.0) ---------------- */
const CREST_SHAPES = {
  shield: 'M10 8H90V58C90 88 70 104 50 114C30 104 10 88 10 58Z',
  round: 'M4 60A46 46 0 1 0 96 60A46 46 0 1 0 4 60Z',
  oval: 'M10 60A40 52 0 1 0 90 60A40 52 0 1 0 10 60Z',
  arch: 'M10 34Q10 6 50 6Q90 6 90 34V66C90 94 70 106 50 114C30 106 10 94 10 66Z',
  french: 'M10 8H90V82C90 98 76 104 62 106C55 107 52 110 50 114C48 110 45 107 38 106C24 104 10 98 10 82Z',
  diamond: 'M50 4L96 60L50 116L4 60Z',
  spanish: 'M10 8H90V70A40 44 0 0 1 10 70Z',
  badge: 'M10 8H90V78L50 114L10 78Z',
  blade: 'M6 6L50 16L94 6L90 68L50 116L10 68Z',      // киберформы (уровень «Легенда»): острый щит, шестигранник, рубленый значок
  hexa: 'M50 4L94 30V90L50 116L6 90V30Z',
  cut: 'M26 6H74L94 26V76L50 116L6 76V26Z'};
const CREST_MID = {shield: 56, french: 56, round: 60, oval: 60, arch: 58, diamond: 60, spanish: 58, badge: 56, blade: 56, hexa: 60, cut: 58};
const CREST_METAL = {gold: ['#fff7cc', '#f2c94c', '#a87408', '#ffe9a3', '#7a5205'], silver: ['#ffffff', '#d5dbe2', '#7d8795', '#f4f6f8', '#4b5563'],
  holo: ['#ff4dd2', '#7c5cff', '#22d3ee', '#a3e635', '#facc15']};      // голограмма — радужный перелив
const CREST_CALM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let CREST_N = 0;           // у каждой эмблемы на странице свои clipPath и градиенты
function crestMix(h, t) {      // t > 0 — светлее (к белому), t < 0 — темнее
  const n = parseInt(h.slice(1), 16), k = Math.abs(t), to = t > 0 ? 255 : 0;
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (to - v) * k).toString(16).padStart(2, '0')).join('');
}
function crestInitials(name) {      // 1–2 буквы клуба: первые буквы двух слов или две первые буквы слова
  const w = String(name || '').toUpperCase().split(/[\s\-«»"'.]+/).filter(v => /\p{L}|\d/u.test(v));
  const ch = v => v.match(/[\p{L}\d]/gu) || [];
  return w.length > 1 ? ch(w[0])[0] + ch(w[1])[0] : ch(w[0] || '').slice(0, 2).join('');
}
function crestDark(h) { const n = parseInt(h.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 < 150; }
function crestDiv(d, a, b, id) {     // деление фона: a — основной цвет, b — второй
  const r = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  let s = r(0, 0, 100, 120, a);
  if (d === 'halves') s += r(50, 0, 50, 120, b);
  else if (d === 'hhalves') s += r(0, 60, 100, 60, b);
  else if (d === 'stripes') for (let i = 1; i < 7; i += 2) s += r(i * 100 / 7, 0, 100 / 7, 120, b);
  else if (d === 'hoops') for (let i = 1; i < 6; i += 2) s += r(0, i * 20, 100, 20, b);
  else if (d === 'cross') s += r(40, 0, 20, 120, b) + r(0, 48, 100, 20, b);
  else if (d === 'bend') s += `<path d="M100 0V120H0Z" fill="${b}"/>`;
  else if (d === 'sash') s += `<path d="M0 0H26L100 92V120H74L0 28Z" fill="${b}"/>`;
  else if (d === 'chief') s += r(0, 0, 100, 34, b);
  else if (d === 'quarters') s += r(50, 0, 50, 60, b) + r(0, 60, 50, 60, b);
  else if (d === 'band') s += r(0, 44, 100, 30, b);
  else if (d === 'pstripe') s += r(28, 0, 44, 120, '#fff') + r(32, 0, 36, 120, b);
  else if (d === 'chevron') s += `<path d="M0 62L50 30L100 62V84L50 52L0 84Z" fill="${b}"/>`;
  else if (d === 'checks') { for (let y = 0; y < 6; y++) for (let x = 0; x < 5; x++) if ((x + y) % 2) s += r(x * 20, y * 20, 20, 20, b); }
  else if (d === 'waves') s += [30, 60, 90].map(y => `<path d="M-5 ${y}Q12 ${y - 9} 25 ${y}T55 ${y}T85 ${y}T115 ${y}V${y + 12}Q98 ${y + 3} 85 ${y + 12}T55 ${y + 12}T25 ${y + 12}T-5 ${y + 12}Z" fill="${b}"/>`).join('');
  else if (d === 'rays') { for (let i = 0; i < 16; i += 2) { const t1 = i * Math.PI / 8, t2 = (i + 1) * Math.PI / 8;
    s += `<path d="M50 60L${(50 + 120 * Math.cos(t1)).toFixed(1)} ${(60 + 120 * Math.sin(t1)).toFixed(1)}L${(50 + 120 * Math.cos(t2)).toFixed(1)} ${(60 + 120 * Math.sin(t2)).toFixed(1)}Z" fill="${b}"/>`; } }
  else if (d === 'bends') { for (let i = -6; i < 6; i += 2) s += `<path d="M${i * 14} 0h14l100 120h-14z" fill="${b}"/>`; }
  else if (d === 'catalan') {      // сверху — полосы региона, снизу — полосы клуба
    s += r(0, 0, 100, 42, '#fcd116');
    for (let i = 0; i < 4; i++) s += r(16 + i * 20, 0, 9, 42, '#da121a');
    for (let i = 0; i < 3; i++) s += r(10 + i * 32, 42, 16, 78, b);
    s += r(0, 40, 100, 4, '#fcd116');
  } else if (d === 'lozenge') for (let y = 0; y < 120; y += 20) for (let x = (y / 20) % 2 ? 10 : 0; x < 110; x += 20)
    s += `<path d="M${x} ${y}l10 10-10 10-10-10z" fill="${b}"/>`;
  else if (d === 'grad') s += `<linearGradient id="${id}d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><rect width="100" height="120" fill="url(#${id}d)"/>`;
  else if (d === 'hex') s += `<pattern id="${id}x" width="18" height="30" patternUnits="userSpaceOnUse" patternTransform="translate(0 1)">` +      // соты
    [[0, 0], [18, 0], [9, 15], [0, 30], [18, 30]].map(([x, y]) => `<path d="M${x} ${y - 9}l8 4.5v9l-8 4.5-8-4.5v-9z" fill="none" stroke="${b}" stroke-width="2.2"/>`).join('') +
    `</pattern><rect width="100" height="120" fill="url(#${id}x)"/>`;
  else if (d === 'camo') s += [['M-5 10C15 0 30 18 22 30S0 40-5 30Z', b], ['M40 -5C60 5 70 0 75 15S55 35 45 25 30 5 40-5Z', crestMix(b, .25)],
    ['M70 40C90 30 108 45 100 60S75 75 68 60Z', b], ['M10 55C30 45 45 60 38 75S10 90 5 75Z', crestMix(b, .25)],
    ['M45 80C65 70 80 90 70 105S40 115 38 100Z', b], ['M80 95C95 90 108 100 102 115S80 125 78 110Z', crestMix(b, .25)],

function matchCard(m, title) {

  const o = m.offer;
  let x = `<div class="card${o || m.status === 'open' ? ' need' : ''}">${title ? `<h3>${title}</h3>` : ''}` +
    `<div class="row"><div>${crestSvg(crestOf(m))}<b>${esc(m.opp)}</b>${m.opp_ready === false ? ' <span title="соперник не готов">⚠️</span>' : ''}` +
    `<div class="sub">${esc(m.label)} · ${where}${m.when ? ' · ' + esc(m.when) : ''}${m.manager ? ' · менеджер ' + esc(m.manager) : ''}</div></div>${score}</div>` + kitDuel(m);
  if (o) x += `<div class="sub" style="color:#fde68a">📨 «${esc(o.who)}» ${o.move ? `предлагает перенести с ${esc(o.from)} на ${esc(o.when)}` : `предлагает сыграть ${esc(o.when)}`}</div>` +
    `<div class="mrow"><button type="button" class="ok" data-resp="acc" data-id="${m.id}">✅ Принять</button><button type="button" class="no" data-resp="dec" data-id="${m.id}">❌ Отказаться</button></div>` +
    (m.can_time ? `<button type="button" class="go" data-time="${m.id}">🕐 Предложить другое время</button>` : '');

  else if (m.need) x += `<div class="sub" style="color:#fde68a">📨 ${esc(m.need)}</div>`;
  if (!o && m.can_time) x += `<button type="button" class="go${m.status === 'open' ? ' main' : ''}" data-time="${m.id}">${m.move ? '🔄 Перенести' : m.sent ? '🕐 Предложить другое время' : '🕐 Назначить время'}</button>`;
  if (m.can_cancel) x += `<button type="button" class="go" data-cancel="${m.id}" style="color:#fca5a5">🗑 Отменить товарищеский</button>`;
  if (m.watch) x += `<button type="button" class="go main" data-watch="${m.id}">📺 Смотреть матч</button>`;

const Q = new URLSearchParams(location.search);
const DUEL_WS = 'wss://football-duel.pinkovskyi2508.workers.dev';   // сервер комнат (worker/), только он
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
// адрес сервера и подпись из ссылки — только при проверке на своём компьютере: иначе чужая ссылка увела бы подпись на чужой сервер
const WS_BASE = LOCAL && Q.get('ws') ? Q.get('ws') : DUEL_WS;
const INIT = (TG && TG.initData) || (LOCAL ? Q.get('init') || '' : '');
// игру открыли без адреса комнаты, но в Telegram (Main Mini App, ссылка ?startapp=…): входная комната со случайным
// именем — бот проверит подпись, при необходимости создаст менеджера и пришлёт адрес его комнаты (app/app_entry.py)
let ROOM = Q.get('room') || (INIT ? 'entry-' + Array.from(crypto.getRandomValues(new Uint8Array(15)), b => (b % 36).toString(36)).join('') : null);
let PANEL_AFTER = null;        // открыть окно, когда придёт первое состояние (приглашение в лигу по ссылке)
let ws = null, retry = 0, ended = false;
const AGAIN = 'Экран закрыт. Откройте игру снова: кнопка «🎮 Игра» в чате.';
function stop(text) { ended = true; tourStop(); $('app').classList.add('hidden'); $('nav').classList.add('hidden'); closeSheet(); $('conn').classList.remove('hidden'); $('conn').textContent = text; }
// бота в комнате нет (перезапустился, комната истекла) — Worker будит его по нашему hello; не ответил за WAIT_MS —
// входим заново (новый hello снова будит бота)
const WAIT_MS = 10000;
function waitBot(sock) {
  clearTimeout(waitBot.t);
  waitBot.t = setTimeout(() => { if (ws === sock && sock.readyState === 1) sock.close(); }, WAIT_MS);
}
function connect() {
  const sock = ws = new WebSocket(WS_BASE.replace(/^http/, 'ws') + '/rooms/' + encodeURIComponent(ROOM) + '/player');
  ws.onopen = () => { sock.send(JSON.stringify({type: 'hello', initData: INIT})); waitBot(sock); };
  clearInterval(connect.ping);           // молчащее соединение Cloudflare закрывает (~100 сек) — пингуем
  connect.ping = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 30000);
  ws.onmessage = e => {
    if (e.data === 'pong') return;
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.type === 'bot_left') { toast('Бот перезапускается — подождите, экран оживёт сам', true); waitBot(sock); return; }
    retry = 0;
    clearTimeout(waitBot.t);
    if (m.type === 'goto' && typeof m.room === 'string') {     // из входной комнаты — в свою (адрес прислал бот)
      ROOM = m.room; ws = null; try { sock.close(); } catch (err) { /* уже закрыт */ }
      if (m.tab === 'league') PANEL_AFTER = 'friends';
      connect(); return;
    }
    if (m.type === 'state') onState(m);
    else if (m.type === 'ack') onAck(m);
  };
  ws.onclose = e => {
    if (ws !== sock) return;
    clearTimeout(waitBot.t);
    if (e.code === 4003) { stop('Этот экран открывает только менеджер клуба.'); return; }
    if (e.code === 4001) { stop(AGAIN); return; }
    if (ended) return;
    retry++;
    if (retry > 6) { stop('Нет связи с ботом. ' + AGAIN); return; }
    if (!S) $('conn').textContent = 'Будим бота… подождите немного';
    else toast('Связь потеряна — переподключаемся…', true);
    setTimeout(connect, Math.min(10000, 1500 * retry));
  };
}

  if (r.ok) demoRefresh();
  onAck({type: 'ack', id: act.id, ...r});
  onState(S);
}

if (ROOM) {
  connect();
  // бот не подключён к комнате (давно не открывали пульт, перезапуск) — страница сама его не разбудит
  const entry = ROOM.startsWith('entry-');
  setTimeout(() => { if (!S && !ended) $('conn').textContent = entry ? 'Бот не отвечает. Подождите немного или закройте и откройте игру снова.'
    : 'Бот не отвечает. В чате нажмите «🏠 Главная» и откройте игру снова кнопкой «🎮 Игра».'; }, entry ? 15000 : 8000);
}
else { S = demoState(); S.hub.manage = demoManage(); demoRefresh(); if (Q.get('demo') === 'new') demoNoClub(); onState(S); toast('Демо без бота: изменения не сохраняются'); }
</script>
</body>
