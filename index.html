<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Пенальти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#050a18;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;
  flex-direction:column;gap:10px;align-items:center;pointer-events:none}
#msg{color:#fff;font-size:17px;line-height:1.3;text-align:center;text-shadow:0 2px 6px #000;max-width:520px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
button{font:inherit;font-size:17px;font-weight:700;padding:13px 20px;border-radius:14px;border:0;background:#facc15;color:#111;
  box-shadow:0 4px 14px rgba(0,0,0,.45);-webkit-tap-highlight-color:transparent}
button.alt{background:#60a5fa}
button:active{transform:translateY(1px)}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;padding:7px 11px;font-size:18px;
  background:rgba(10,15,30,.75);color:#fff;pointer-events:auto;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" type="button" aria-label="Звук">🔊</button>
<div id="ui">
  <div id="msg"></div>
  <div class="row" id="buttons"></div>
</div>
<script>
'use strict';
/* Пенальти-дуэль: сцена из-за спины бьющего. Логические координаты W×H, вписываются в экран.
   Неподвижное (небо, трибуны, газон) рисуется один раз в запасные холсты и потом только копируется.
   Сейчас — ДЕМО: соперник выбирает случайно, исход считается здесь (см. demoOpponent).
   В матче исход будет присылать сервер, страница только показывает.
   Как именно это выглядит (штанга, отбил или поймал, как радуются), выбирает makePlan по самому исходу —
   у обоих менеджеров одна и та же картинка, а гол/сейв/мимо не меняется. */
const W = 720, H = 1040;
const GOAL = {x0: 150, x1: 570, y0: 300, y1: 470};      // створ: штанги, перекладина, линия ворот
const BACK = {x0: 190, x1: 530, y0: 322, y1: 452};      // задняя стенка сетки
const VP = {x: 360, y: 335};                             // куда «уходит» сетка при ударе
const SPOT = {x: 360, y: 800};                           // точка пенальти
const STANDS_Y = 250, BOARDS_Y = 250, PITCH_Y = 282;     // трибуны до 250, щиты 250–282, дальше газон
const AIMS = ['в левый верхний угол', 'под перекладину', 'в правый верхний угол',
              'в левый нижний угол', 'низом по центру', 'в правый нижний угол'];
const DIVES = ['прыгает влево', 'остаётся в центре', 'прыгает вправо'];
// ?embed=1 — пенальти внутри сцены матча (webapp/match): связь с ботом и вибрация — через неё (postMessage)
const EMBED = new URLSearchParams(location.search).get('embed') === '1' && window.parent !== window;
// Основная сцена — 3D (webapp/penalty3d, на Pages — penalty3d/): та же логика и связь. Нет WebGL, долгая загрузка или мало кадров —
// 3D сама вернётся сюда с ?3d=0, и тогда остаётся эта 2D-сцена (запасная).
const TO3D = new URLSearchParams(location.search).get('3d') !== '0';
if (TO3D) location.replace((['localhost', '127.0.0.1'].includes(location.hostname) ? '../penalty3d/' : 'penalty3d/') + location.search);
const TG = !EMBED && window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const FONT = '"Trebuchet MS","Segoe UI",sans-serif';

if (!CanvasRenderingContext2D.prototype.roundRect)      // старые Android WebView: скругление — простым прямоугольником
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
const cv = document.getElementById('c'), g = cv.getContext('2d');
const msgEl = document.getElementById('msg'), btnEl = document.getElementById('buttons');

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 2.2);
const easeInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function zone(aim) {
  const c = aim % 3, r = Math.floor(aim / 3);
  return {x: GOAL.x0 + (GOAL.x1 - GOAL.x0) * (c + .5) / 3, y: GOAL.y0 + (GOAL.y1 - GOAL.y0) * (r + .5) / 2};
}
const colX = c => GOAL.x0 + (GOAL.x1 - GOAL.x0) * (c + .5) / 3;
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  const f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255);
  return `rgb(${f(r)},${f(gg)},${f(b)})`;
}

/* ---------------- состояние ---------------- */
const P = {   // участники (в матче придут от сервера)
  kicker: {num: 9, name: 'Нападающий', stat: 'Удар 30', shirt: '#dc2626', shorts: '#f5f5f5'},
  keeper: {num: 1, name: 'Вратарь', stat: 'Вратарство 30', shirt: '#2563eb'},
};
let role = null;          // kick | keep
let phase = 'intro';      // intro | choose | wait | play | done
let myPick = null, deadline = 0, chooseSec = 25;
let anim = null;          // {t0, aim, dive, outcome, text}
let excite = 0, shake = 0, flash = 0, punch = 0, glow = 0;   // punch — рывок камеры к удару, glow — экран в цвете забившей команды
const fx = [];

/* ---------------- экран и запасные холсты ---------------- */
let dpr = 1, sc = 1, ox = 0, oy = 0;
const BX0 = -260, BY0 = -330, BW = W + 520, BH = H - BY0 + 180;   // область, которую покрывает фон
let bg = null, bands = [], bgR = 1;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function softBlur(src, k) {   // размытие без ctx.filter (его нет в старом Safari): уменьшаем по половине до k раз и так же увеличиваем
  let cur = src, w = src.width, h = src.height;
  const step = (c, nw, nh) => { const o = mkCanvas(nw, nh), x = o.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, nw, nh); return o; };
  const sizes = [];
  for (let f = 2; f <= k; f *= 2) { w = Math.max(1, Math.round(w / 2)); h = Math.max(1, Math.round(h / 2)); cur = step(cur, w, h); sizes.push([w, h]); }
  sizes.pop(); sizes.reverse(); sizes.push([src.width, src.height]);
  for (const [nw, nh] of sizes) cur = step(cur, nw, nh);
  return cur;
}
function fit() {
  dpr = Math.min(devicePixelRatio || 1, 3);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  // по бокам сцены — только трибуны и газон: на узком экране их можно срезать (видна середина шириной VIS), зато всё крупнее
  const VIS = 600;
  sc = Math.min(cv.width / VIS, cv.height / H); ox = (cv.width - W * sc) / 2; oy = (cv.height - H * sc) / 2;
  bgR = Math.min(sc * 1.2, Math.sqrt(5e6 / (BW * BH)));        // запас резкости под наезд камеры, но не больше ~5 Мпикс
  buildBackdrop();
}

/* ---------------- фон: небо, крыша с прожекторами, трибуны, газон (рисуется один раз) ---------------- */
function buildBackdrop() {
  bg = mkCanvas(BW * bgR, BH * bgR);
  const c = bg.getContext('2d'); c.setTransform(bgR, 0, 0, bgR, -BX0 * bgR, -BY0 * bgR);
  // небо
  let gr = c.createLinearGradient(0, BY0, 0, 0); gr.addColorStop(0, '#02050f'); gr.addColorStop(1, '#0f1d3d');
  c.fillStyle = gr; c.fillRect(BX0, BY0, BW, -BY0 + 2);
  const r = rng(3);
  c.fillStyle = 'rgba(255,255,255,.7)';
  for (let i = 0; i < 70; i++) { const x = BX0 + r() * BW, y = BY0 + r() * (-BY0 - 60); c.fillRect(x, y, r() < .2 ? 2 : 1.2, r() < .2 ? 2 : 1.2); }
  // крыша и прожекторы
  c.fillStyle = '#0a0f1e'; c.fillRect(BX0, -46, BW, 40);
  c.fillStyle = '#1c2440'; c.fillRect(BX0, -10, BW, 6);
  for (let x = BX0 + 30; x < BX0 + BW; x += 26) { c.fillStyle = '#111832'; c.fillRect(x, -46, 3, 36); }
  c.globalCompositeOperation = 'lighter';
  for (const lx of [-120, 110, 360, 610, 840]) {
    const glow = c.createRadialGradient(lx, -30, 2, lx, -30, 190);
    glow.addColorStop(0, 'rgba(255,250,225,.55)'); glow.addColorStop(.25, 'rgba(255,245,210,.16)'); glow.addColorStop(1, 'rgba(255,245,210,0)');
    c.fillStyle = glow; c.fillRect(lx - 200, -230, 400, 400);
    for (let k = -2; k <= 2; k++) { c.fillStyle = '#fffbe6'; c.fillRect(lx + k * 13 - 5, -38, 10, 7); }
  }
  c.globalCompositeOperation = 'source-over';
  // трибуны: ярусы (ряды ниже — крупнее и светлее)
  gr = c.createLinearGradient(0, 0, 0, STANDS_Y); gr.addColorStop(0, '#0c1326'); gr.addColorStop(1, '#1d2747');
  c.fillStyle = gr; c.fillRect(BX0, -4, BW, STANDS_Y + 4);
  const rows = standRows();
  for (const row of rows) { c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(BX0, row.y + row.h - 3, BW, 3); }
  // газон: полосы стрижки в двух направлениях
  let y = PITCH_Y, h = 12, i = 0;
  while (y < BY0 + BH) { c.fillStyle = i % 2 ? '#196a36' : '#269352'; c.fillRect(BX0, y, BW, h + 1); y += h; h *= 1.13; i++; }
  c.save(); c.beginPath(); c.rect(BX0, PITCH_Y, BW, BY0 + BH - PITCH_Y); c.clip();
  const vx = 360, vy = -900;
  for (let k = -14; k <= 14; k += 2) {
    c.fillStyle = 'rgba(255,255,255,.035)';
    c.beginPath(); c.moveTo(vx, vy); c.lineTo(vx + k * 120, BY0 + BH); c.lineTo(vx + (k + 1) * 120, BY0 + BH); c.fill();
  }
  for (let n = 0; n < 9000; n++) {                       // фактура травы
    const px = BX0 + r() * BW, py = PITCH_Y + Math.pow(r(), .8) * (BY0 + BH - PITCH_Y), s = .8 + (py - PITCH_Y) / 380;
    c.fillStyle = r() < .5 ? 'rgba(255,255,255,.05)' : 'rgba(0,30,10,.10)'; c.fillRect(px, py, s * 1.4, s * 2.6);
  }
  const pool = c.createRadialGradient(360, 560, 40, 360, 560, 640);       // пятно света прожекторов: штрафная — самое светлое место
  pool.addColorStop(0, 'rgba(255,252,225,.20)'); pool.addColorStop(.55, 'rgba(255,252,225,.07)'); pool.addColorStop(1, 'rgba(255,252,225,0)');
  c.fillStyle = pool; c.fillRect(BX0, PITCH_Y, BW, BY0 + BH - PITCH_Y);
  const edge = c.createLinearGradient(BX0, 0, BX0 + BW, 0);                // к краям поле уходит в тень
  edge.addColorStop(0, 'rgba(2,10,20,.55)'); edge.addColorStop(.3, 'rgba(2,10,20,0)'); edge.addColorStop(.7, 'rgba(2,10,20,0)'); edge.addColorStop(1, 'rgba(2,10,20,.55)');
  c.fillStyle = edge; c.fillRect(BX0, PITCH_Y, BW, BY0 + BH - PITCH_Y);
  const far = c.createLinearGradient(0, PITCH_Y, 0, PITCH_Y + 120);        // у щитов газон темнее: тень трибуны
  far.addColorStop(0, 'rgba(4,12,24,.45)'); far.addColorStop(1, 'rgba(4,12,24,0)');
  c.fillStyle = far; c.fillRect(BX0, PITCH_Y, BW, 120);
  c.restore();
  // тень сетки за воротами
  c.fillStyle = 'rgba(0,0,0,.22)';
  c.beginPath(); c.moveTo(GOAL.x0 - 4, GOAL.y1); c.lineTo(BACK.x0 - 10, BACK.y1 - 4); c.lineTo(BACK.x1 + 10, BACK.y1 - 4); c.lineTo(GOAL.x1 + 4, GOAL.y1); c.fill();
  // разметка
  c.strokeStyle = 'rgba(255,255,255,.88)'; c.lineWidth = 4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(BX0, GOAL.y1); c.lineTo(BX0 + BW, GOAL.y1);
  c.moveTo(80, GOAL.y1); c.lineTo(46, 548); c.lineTo(674, 548); c.lineTo(640, GOAL.y1);
  c.moveTo(BX0, 930); c.lineTo(BX0 + BW, 930); c.stroke();
  c.save(); c.beginPath(); c.rect(BX0, 930, BW, 400); c.clip();
  c.lineWidth = 5; c.beginPath(); c.ellipse(SPOT.x, SPOT.y + 10, 230, 190, 0, 0, 7); c.stroke(); c.restore();
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(SPOT.x, SPOT.y + 16, 9, 4.5, 0, 0, 7); c.fill();
  for (const ph of PHOTOGS) drawPhotog(c, ph);
  // глубина резкости, как в трансляции: в фокусе ворота и игроки, трибуны и небо мягкие (шов закрывают рекламные щиты)
  const soft = softBlur(bg, 4);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  const seam = Math.round((BOARDS_Y + 6 - BY0) * bgR);
  c.drawImage(soft, 0, 0, bg.width, seam, 0, 0, bg.width, seam);
  c.restore();
  // блики огней на размытых трибунах (вспышки телефонов, табло, прожекторы — кружками, как в объективе)
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) {
    const x = BX0 + r() * BW, y = 10 + r() * (STANDS_Y - 20), rr = 3 + r() * 9, a = .08 + r() * .2;
    const col = r() < .6 ? '255,248,230' : r() < .5 ? '255,214,140' : '170,200,255';
    const bk = c.createRadialGradient(x, y, 0, x, y, rr); bk.addColorStop(0, `rgba(${col},${a})`); bk.addColorStop(.75, `rgba(${col},${a * .7})`); bk.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = bk; c.beginPath(); c.arc(x, y, rr, 0, 7); c.fill();
  }
  // лучи прожекторов в дымке над полем
  for (const lx of [-120, 110, 610, 840]) {
    const dir = lx < 360 ? 1 : -1, x1 = lx + dir * 260, x2 = lx + dir * 520, y2 = 980;
    const beam = c.createLinearGradient(lx, -30, lx + dir * 380, y2);
    beam.addColorStop(0, 'rgba(255,250,225,.10)'); beam.addColorStop(.5, 'rgba(255,250,225,.035)'); beam.addColorStop(1, 'rgba(255,250,225,0)');
    c.fillStyle = beam; c.beginPath(); c.moveTo(lx - 10, -30); c.lineTo(lx + 10, -30); c.lineTo(x2, y2); c.lineTo(x1, y2); c.closePath(); c.fill();
  }
  c.globalCompositeOperation = 'source-over';
  buildCrowd(rows);
}
// фотографы за линией ворот по обе стороны от сетки, смотрят на поле; вспышки — в кадре (drawPhotoFlash)
const PHOTOGS = [{x: 50, y: 318}, {x: 102, y: 311}, {x: 618, y: 311}, {x: 670, y: 318}];
function drawPhotog(c, {x, y}) {
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(x, y + 1, 17, 3.5, 0, 0, 7); c.fill();
  c.fillStyle = '#1f2937'; c.beginPath(); c.roundRect(x - 12, y - 13, 24, 13, 5); c.fill();              // на корточках
  c.fillStyle = '#f97316'; c.beginPath(); c.roundRect(x - 10, y - 33, 20, 23, 5); c.fill();              // жилет
  c.fillStyle = 'rgba(255,255,255,.75)'; c.fillRect(x - 10, y - 24, 20, 3);
  c.fillStyle = '#e6b08f'; c.beginPath(); c.arc(x, y - 39, 6.5, 0, 7); c.fill();
  c.fillStyle = '#2b1d16'; c.beginPath(); c.arc(x, y - 41, 6.6, Math.PI, 0); c.fill();
  c.fillStyle = '#0b0d12'; c.fillRect(x - 8, y - 44, 16, 9);                                              // камера перед лицом
  c.beginPath(); c.arc(x, y - 39, 4.5, 0, 7); c.fill();
  c.fillStyle = 'rgba(147,197,253,.6)'; c.beginPath(); c.arc(x - 1, y - 40, 1.6, 0, 7); c.fill();       // блик объектива
}
function standRows() {
  const rows = []; let y = 4;
  for (let i = 0; i < 12; i++) { const h = lerp(14, 24, i / 11); rows.push({y, h, i}); y += h + 1.6; }
  const k = (STANDS_Y - 4) / (y - 4); for (const r of rows) { r.y = 4 + (r.y - 4) * k; r.h *= k; }
  return rows;
}
function buildCrowd(rows) {
  // болельщики четырьмя полосами: при голе полосы подпрыгивают с разной фазой — «волна»
  bands = [];
  const r = rng(11);
  const shirts = ['#dc2626', '#dc2626', '#2563eb', '#2563eb', '#f5f5f5', '#facc15', '#16a34a', '#f97316', '#a855f7', '#111827'];
  const skins = ['#f1c7a5', '#e8b896', '#c98f6b', '#8d5a3b', '#f5d7bf'];
  for (let b = 0; b < 4; b++) {
    const rs = rows.slice(b * 3, b * 3 + 3), y0 = rs[0].y - 14, y1 = rs[rs.length - 1].y + rs[rs.length - 1].h + 2;
    const cnv = mkCanvas(BW * bgR, (y1 - y0) * bgR), c = cnv.getContext('2d');
    c.setTransform(bgR, 0, 0, bgR, -BX0 * bgR, -y0 * bgR);
    for (const row of rs) {
      const s = row.h, light = .45 + .55 * row.i / 11;
      for (let x = BX0 + r() * s; x < BX0 + BW; x += s * (.72 + r() * .2)) {
        if (r() < .06) continue;                                     // пустое кресло
        const sh = shirts[r() * shirts.length | 0], bx = x + r() * 2, by = row.y + row.h;
        c.globalAlpha = light;
        c.fillStyle = sh; c.beginPath(); c.roundRect(bx - s * .3, by - s * .62, s * .6, s * .62, s * .2); c.fill();
        c.fillStyle = skins[r() * skins.length | 0]; c.beginPath(); c.arc(bx, by - s * .78, s * .2, 0, 7); c.fill();
        if (r() < .12) { c.fillStyle = r() < .5 ? '#dc2626' : '#f5f5f5'; c.fillRect(bx - s * .5, by - s * 1.18, s, s * .14); }   // шарф над головой
      }
    }
    c.globalAlpha = 1;
    bands.push({cnv: softBlur(cnv, 4), y0, y1, ph: b * 1.3});        // болельщики тоже не в фокусе
  }
}

/* ---------------- звук ---------------- */
let ac = null, muted = false, noise = null, amb = null, ambLevel = .045;
function audioOn() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // гул стадиона: всё время тихо фоном, затихает перед ударом и взрывается после
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(); amb = ac.createGain();
    s.buffer = noise; s.loop = true; f.type = 'lowpass'; f.frequency.value = 620; amb.gain.value = muted ? 0 : ambLevel;
    s.connect(f).connect(amb).connect(ac.destination); s.start(); }
  if (ac.state === 'suspended') ac.resume();
}
function setAmb(v, dur, back, backDur) {   // гул к уровню v за dur секунд, потом (если задано) — к back за backDur
  ambLevel = back === undefined ? v : back;
  if (!amb) return; const t = ac.currentTime, gn = amb.gain;
  gn.cancelScheduledValues(t); gn.setValueAtTime(gn.value, t); gn.linearRampToValueAtTime(muted ? 0 : v, t + dur);
  if (back !== undefined) gn.linearRampToValueAtTime(muted ? 0 : back, t + dur + backDur);
}
function out(v) { const q = ac.createGain(); q.gain.value = muted ? 0 : v; q.connect(ac.destination); return q; }
function hiss(type, freq, Q, v, len) {   // короткий шумовой звук: сетка, перчатки
  if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), q = out(0);
  s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = Q;
  q.gain.setValueAtTime(muted ? 0 : v, t); q.gain.exponentialRampToValueAtTime(.001, t + len);
  s.connect(f).connect(q); s.start(t, Math.random()); s.stop(t + len + .05);
}
const swish = () => hiss('highpass', 2400, .7, .3, .4);          // мяч в сетке
const slap = () => hiss('bandpass', 1500, 1.1, .7, .08);         // мяч о перчатки

/* Вратарь и судья — одна фигура анфас. Поза — набор чисел 0..1, их можно плавно смешивать (mixPose):
   arms — руки вверх, crouch — присел, legs — ноги вместе (в прыжке), kneel — на коленях,
   spread/hold/head/fist/scoop/mouth — руки в стороны, мяч у груди, на голове, кулак вверх, подбор низом, свисток у рта;
   roar — кричит, tuck — в прыжке верхняя нога согнута (толчковая вытянута); gclap — хлопок перчатками,
   flex — оба кулака у плеч, slam — кулаком в газон; lead (−1..1) — какая рука ведёт в прыжке (тянется дальше,
   вторая согнута); look (−1..1) — куда повёрнуто лицо (за мячом). x, y — ступни, rot — наклон всего тела вокруг ступней, s — масштаб. */

               spread: 0, hold: 0, head: 0, fist: 0, scoop: 0, mouth: 0, roar: 0, tuck: 0,
               gclap: 0, flex: 0, slam: 0, lead: 0, look: 0};
const pose = o => Object.assign({}, POSE0, o);
function mixPose(a, b, t) { const o = {}; for (const k in POSE0) o[k] = lerp(a[k], b[k], t); return o; }
const ARM = {   // [локоть, запястье] относительно линии плеч; s = −1 левая рука, 1 правая
  down:   s => [[s * 35, 22], [s * 40, 40]],
  up:     s => [[s * 21, -24], [s * 14, -44]],
  spread: s => [[s * 44, 6], [s * 68, 0]],
  hold:   s => [[s * 26, 30], [s * 9, 22]],
  head:   s => [[s * 30, -14], [s * 9, -30]],
  fist:   s => s > 0 ? [[30, -12], [24, -46]] : [[-32, 20], [-30, 34]],
  scoop:  s => [[s * 22, 40], [s * 10, 62]],
  mouth:  s => s > 0 ? [[26, 6], [5, -10]] : [[-35, 22], [-40, 40]],
  gclap:  s => [[s * 26, 22], [s * 5, 16]],
  flex:   s => [[s * 38, -4], [s * 30, -34]],
  slam:   s => s > 0 ? [[30, 26], [30, 66]] : [[-30, 22], [-24, 42]],

const LEAD = {ext: s => [[s * 15, -32], [s * 8, -62]], bent: s => [[s * 30, -12], [s * 16, -30]]};

  const cr = p.crouch, lg = p.legs, kn = p.kneel;

  return {hipY, kneeY, shY: hipY - 44, kneeX: lerp(lerp(17 + 7 * cr, 6, lg), 16, kn), footX: lerp(16, 6, lg)};

    for (const m of ['spread', 'hold', 'head', 'fist', 'scoop', 'mouth', 'gclap', 'flex', 'slam']) {
      const k = p[m]; if (!k) continue; const M = ARM[m](s);

    }

      const k = Math.abs(p.lead) * p.arms, M = (Math.sign(p.lead) === s ? LEAD.ext : LEAD.bent)(s);
      e = [lerp(e[0], M[0][0], k), lerp(e[1], M[0][1], k)]; w = [lerp(w[0], M[1][0], k), lerp(w[1], M[1][1], k)];

  else if (Math.random() < (over ? .44 : .42)) outcome = 'miss';
  else if (Math.random() < (dive === col ? .55 : dive === 1 ? .25 : 0)) outcome = 'save';
  else outcome = 'goal';
  const text = {block: 'Стенка блокирует!', miss: over ? 'Над перекладиной!' : 'Мимо, рядом со штангой!',
                save: dive === col ? 'Вратарь достаёт из угла!' : 'Вратарь успевает из центра!'}[outcome]
             || (dive === col ? 'Вратарь угадал, но не дотянулся' : dive === 1 ? 'Вратарь не дотянулся из центра' : 'Вратарь ушёл не в тот угол');
  play(demoNote({fk, wall, dive, outcome, text}));
}
function play(result) {
  phase = 'play'; events = {};
  if (isFk() && result.fk !== undefined) {               // штрафной: исход в форме пенальти (угол для вратаря и бьющего) + стенка
    anim = Object.assign({t0: performance.now()}, result, {aim: (result.fk < 2 ? 0 : 3) + (result.fk % 2 ? 2 : 0), fkWall: result.wall});
    anim.plan = makeFkPlan(anim); setUi(result.note || ''); return;
  }
  anim = Object.assign({t0: performance.now()}, result); anim.plan = makePlan(anim);
  setUi(result.note || '');            // кто-то не успел — «⏱ Время вышло…» под сценой
}
function finish() {
  phase = 'done';
  if (EMBED) { setUi(''); toParent({type: 'done'}); return; }
  if (live) { setUi('Матч продолжается в чате.', closeBtn()); return; }
  setUi('Демо-режим: соперник выбирал случайно.', [['Ещё раз', '', () => start(role)], ['Сменить роль', 'alt', () => start(role === 'kick' ? 'keep' : 'kick')],
                                                     [isFk() ? '🥅 Пенальти' : '🎯 Штрафной', 'alt', () => { MODE = isFk() ? 'pen' : 'fk'; fkSetup(); start(role); }]]);
}
function start(r, left) {
  role = r; phase = 'choose'; myPick = null; anim = null; fx.length = 0; fkWall = 0;
  if (left !== undefined) chooseSec = Math.max(1, left);
  deadline = performance.now() + chooseSec * 1000;
  if (isFk()) setUi(r === 'kick' ? 'Коснитесь удара: через стенку (прыгнувшая стенка часто ловит) или под стенку (пройдёт, если стенка прыгнет).'
                                 : 'Коснитесь стенки — стоит или прыгает. Потом коснитесь угла, куда сместится вратарь.');
  else setUi(r === 'kick' ? 'Коснитесь угла ворот, куда бить. Верх — вратарю труднее, но легче промахнуться.'
                          : 'Коснитесь стороны ворот, куда прыгнуть. Угадаете — шанс отбить.');
}
/* ---------------- ВНУТРИ СЦЕНЫ МАТЧА: сообщения бота приносит страница матча ---------------- */
function toParent(m) { try { window.parent.postMessage(m, location.origin); } catch (e) {} }
if (TO3D) setUi('Загружаем 3D…');                       // страница уже уходит в 3D — к матчу подключится она
else if (EMBED) {
  document.getElementById('mute').style.display = 'none';     // звук включает/выключает сцена матча
  addEventListener('message', e => {
    if (e.source !== window.parent || e.origin !== location.origin || !e.data) return;
    const m = e.data;
    if (m.type === 'mute') { muted = !!m.on; setAmb(ambLevel, .05); }
    else if (m.type === 'note') { if (phase === 'wait') { phase = 'choose'; myPick = null; } setUi(m.text || ''); }
    else onLive(m);
  });
  setUi('');
  toParent({type: 'ready'});
}
else if (ROOM) liveConnect();
else if (isFk()) { fkSetup(); setUi('Штрафной — демо. Кем будете?', [['🎯 Бить', '', () => start('kick')], ['🧱 Стенка и вратарь', 'alt', () => start('keep')]]); }
else setUi('Пенальти — демо. Кем будете?', [['⚽ Бить', '', () => start('kick')], ['🧤 Стоять в воротах', 'alt', () => start('keep')]]);

addEventListener('resize', fit); fit();
requestAnimationFrame(frame);
if (TG) { try { TG.ready(); TG.expand(); TG.disableVerticalSwipes && TG.disableVerticalSwipes();
  TG.setHeaderColor && TG.setHeaderColor('#02050f'); TG.setBackgroundColor && TG.setBackgroundColor('#02050f'); } catch (e) {} }
</script>
</body>
