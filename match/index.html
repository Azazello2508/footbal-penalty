<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Матч</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050a18;--panel:#0b1328;--line:#1c2742;--text:#f1f5f9;--muted:#94a3b8;--gold:#facc15;--comm:#fde68a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;-webkit-user-select:none;user-select:none;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;height:var(--vh,100dvh)}
#top{padding:calc(5px + env(safe-area-inset-top)) 12px 4px;background:linear-gradient(#0d1730,#070d1f);border-bottom:1px solid var(--line);flex:none}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:14px}
.tm.away{justify-content:flex-end;text-align:right}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kit{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #fff3;box-sizing:border-box}
#score{font-size:25px;line-height:1.1;font-weight:800;letter-spacing:1px;min-width:72px;text-align:center;transition:transform .25s}
#score.bump{transform:scale(1.35);color:var(--gold)}
#clockrow{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:12px;color:var(--muted)}   /* минута — полоса времени — тайм: одной строкой */
#clockrow #bar{flex:1;margin:0}
#period{white-space:nowrap}
#clock{color:var(--text);font-weight:700}
#derby{flex:none;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(90deg,#b91c1c,#f97316);border-radius:8px;padding:1px 7px;white-space:nowrap}   /* дерби (app/derby.py) */
#derby[hidden]{display:none}
#bar{position:relative;height:5px;border-radius:3px;background:#1e293b;margin:5px 0 4px;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#22c55e,var(--gold));transition:width .6s}
#bar i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#0b1328}
#stats{font-size:11px;line-height:1.3;margin-top:2px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:2;max-width:86%;font-size:13px;text-align:center;color:var(--gold);font-weight:700;
  background:rgba(5,10,24,.8);border-radius:10px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}   /* статус — плашкой на поле, не отдельной строкой */
#status:empty{display:none}
#pitchwrap{position:relative;flex:none;display:flex;justify-content:center;background:#04170c;overflow:hidden}
canvas{display:block}
#label{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(5,10,24,.82);border:1px solid #ffffff22;
  padding:6px 12px;border-radius:12px;font-weight:800;font-size:15px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:92%;overflow:hidden;text-overflow:ellipsis}
#label.on{opacity:1}
#label.wide{top:52px;white-space:normal;text-align:center;width:max-content;max-width:82%;line-height:1.3}
#var{position:absolute;left:50%;top:14%;transform:translate(-50%,-8px) scale(.96);opacity:0;pointer-events:none;z-index:3;
  transition:opacity .25s,transform .25s;text-align:center;font-family:"Trebuchet MS",sans-serif}
#var.on{opacity:1;transform:translate(-50%,0) scale(1)}
#var .box{display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.55);border:1.5px solid #ffffff30}
#var .logo{background:#0b1220;color:#fff;font-weight:900;font-size:26px;letter-spacing:2px;padding:8px 12px;display:flex;align-items:center;gap:6px}
#var .logo i{display:inline-block;width:22px;height:15px;border:2.5px solid #fff;border-radius:3px;position:relative}
#var .logo i::after{content:"";position:absolute;left:50%;bottom:-6px;width:8px;height:3px;background:#fff;transform:translateX(-50%)}
#var .txt{background:linear-gradient(#1e3a8a,#172554);color:#e0e7ff;font-weight:800;font-size:14px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;text-align:left;min-width:150px}
#var .txt small{font-size:11px;font-weight:600;color:#a5b4fc;letter-spacing:.5px}
#var .dots::after{content:"";animation:vardots 1.2s steps(4) infinite}
@keyframes vardots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#var.ok .txt{background:linear-gradient(#15803d,#14532d);color:#dcfce7}
#var.off .txt{background:linear-gradient(#b91c1c,#7f1d1d);color:#fee2e2}
/* повтор гола: плашка в углу и тонкие «киношные» полосы сверху и снизу */
#rpl{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
#rpl.on{opacity:1}
#rpl::before,#rpl::after{content:"";position:absolute;left:0;right:0;height:7%;background:rgba(0,0,0,.55)}
#rpl::before{top:0}#rpl::after{bottom:0}
#rpl b{position:absolute;right:10px;top:calc(7% + 8px);background:#b91c1c;color:#fff;font-weight:900;font-size:13px;letter-spacing:2px;
  padding:4px 9px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.5);font-family:"Trebuchet MS",sans-serif}
#rpl b i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px;animation:rpl 1s steps(2) infinite}
#rpl b small{font-weight:700;opacity:.8;letter-spacing:0;margin-left:5px}
@keyframes rpl{50%{opacity:0}}
#rpl em{position:absolute;top:0;bottom:0;left:-50%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg)}
#rpl.on em{animation:wipe .45s ease-out}
@keyframes wipe{to{left:115%}}
/* ТВ-графика: плашка удара внизу слева (скорость, xG) и карта ударов в перерыве */
#tvg{position:absolute;left:8px;bottom:calc(7% + 10px);z-index:3;display:flex;align-items:stretch;border-radius:6px;overflow:hidden;opacity:0;
  transform:translateX(-12px);transition:opacity .25s,transform .25s;pointer-events:none;font-family:"Trebuchet MS",sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.5)}
#tvg.on{opacity:1;transform:none}
#tvg i{width:5px;background:var(--tc,#facc15)}
#tvg b{background:#0b1220;color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:5px 8px;display:flex;align-items:center}
#tvg span{background:linear-gradient(#1e3a8a,#172554);color:#e0e7ff;font-size:12px;font-weight:800;padding:5px 9px;display:flex;align-items:center;white-space:nowrap}
#smap{position:absolute;left:50%;top:46px;transform:translate(-50%,-6px);z-index:3;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;
  background:rgba(5,10,24,.88);border:1px solid #ffffff26;border-radius:12px;padding:8px 10px;box-shadow:0 8px 28px rgba(0,0,0,.55);font-family:"Trebuchet MS",sans-serif;max-width:94%}
#smap.on{opacity:1;transform:translate(-50%,0)}
#smap .h{font-weight:900;font-size:12px;letter-spacing:1px;color:#facc15;text-transform:uppercase;margin-bottom:6px;text-align:center}
#smap .row{display:flex;gap:10px;align-items:center}
#smap canvas{border-radius:6px;flex:none}
#smap .row>div{flex:1;min-width:150px}
#smap .st{font-size:12px;color:#cbd5e1;line-height:1.35;margin:4px 0 8px;white-space:nowrap}
#smap .st b{display:block;font-size:13px;color:#fff;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#smap .st b i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c);border:1px solid #fff9}
#smap .lg{font-size:10.5px;color:#94a3b8;max-width:170px}
#flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#flash b{font-size:76px;font-weight:900;letter-spacing:3px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:0 0 24px var(--fc,#facc15),0 6px 0 #000}
#flash span{margin-top:6px;font-size:17px;font-weight:800;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;max-width:92%;text-align:center}
#flash.on{animation:flash 2.6s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
#feed{flex:1;overflow-y:auto;padding:2px 12px calc(10px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.it{padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.3}
.it.c{color:var(--comm);font-style:italic;padding-left:14px}
.it.goal{font-weight:800;color:#fff;background:linear-gradient(90deg,#facc1522,transparent);padding-left:6px}
.it.new{animation:pop .5s ease-out}
@keyframes pop{from{background:#facc1533}to{}}
#cam{position:absolute;top:8px;right:54px;font:inherit;font-size:16px;padding:5px 9px;border-radius:10px;border:0;background:rgba(5,10,24,.75);color:#fff;z-index:2}
#cam.off{opacity:.45}
#mute{position:absolute;top:8px;right:8px;font:inherit;font-size:16px;padding:5px 9px;border-radius:10px;border:0;background:rgba(5,10,24,.75);color:#fff;z-index:2}
#talk{position:absolute;top:8px;left:8px;font:inherit;font-size:16px;padding:5px 9px;border-radius:10px;border:0;background:rgba(5,10,24,.75);color:#fff;z-index:2}
#talk b{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#ef4444;font-size:11px;line-height:16px;text-align:center;display:none}
#talk b.on{display:block}
#bub{position:absolute;left:8px;top:46px;max-width:72%;display:flex;flex-direction:column;gap:5px;z-index:2;pointer-events:none}
#bub div{background:rgba(5,10,24,.86);border-left:3px solid var(--cc,#facc15);border-radius:10px;padding:5px 9px;font-size:14px;line-height:1.3;
  animation:bub .3s ease-out;transition:opacity .4s;word-break:break-word}
#bub div small,#chat .msgs small{display:block;font-size:11px;color:var(--muted);font-weight:700}
#bub div.out{opacity:0}
@keyframes bub{from{opacity:0;transform:translateY(-6px)}to{}}
#chat{position:fixed;left:0;right:0;bottom:0;z-index:4;display:none;flex-direction:column;max-height:58%;background:#0b1328;border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.5)}
#chat.on{display:flex}
#chat .hd{flex:none;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:4px}
#chat .hd button{font:inherit;font-size:18px;background:none;border:0;color:var(--muted);padding:2px 6px}
#chat .msgs{flex:1;overflow-y:auto;min-height:60px;display:flex;flex-direction:column;gap:5px;padding:4px 0}
#chat .msgs div{max-width:82%;align-self:flex-start;background:#16223f;border-radius:10px;padding:5px 9px;font-size:14px;line-height:1.3;word-break:break-word;
  border-left:3px solid var(--cc,#facc15)}
#chat .msgs div.me{align-self:flex-end;background:#1e3a8a}
#chat .msgs .empty{align-self:center;background:none;border:0;color:var(--muted);font-size:13px;text-align:center}
#chat .chips{flex:none;display:flex;gap:6px;overflow-x:auto;padding:5px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#chat .chips::-webkit-scrollbar{display:none}
#chat .chips button{flex:none;font:inherit;font-size:13px;font-weight:700;padding:7px 10px;border-radius:14px;border:1px solid #ffffff14;background:#17254a;color:#fff}
#chat .chips.emo button{font-size:19px;padding:4px 8px}
#chat form{flex:none;display:flex;gap:6px;margin-top:4px}
#chat input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border-radius:12px;border:1px solid #ffffff22;background:#050a18;color:#fff;
  -webkit-user-select:text;user-select:text}
#chat form button{font:inherit;font-size:15px;font-weight:800;padding:0 14px;border-radius:12px;border:0;background:var(--gold);color:#111}
#chat .err{color:#fca5a5;font-size:12px;min-height:15px}
/* замена вне окна решений: полоска под полем и выбор снизу (как чат); замена ждёт ближайшей остановки */
#qbar{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0}
#qbar[hidden]{display:none}
/* «⏩ Рассчитать результат» (нажали оба — остаток матча считается сразу) — полоска под полем */
#qrbar{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);min-width:0}
#qrbar[hidden]{display:none}
#qrbar span{flex:1;min-width:0;line-height:1.3}
#qrbar button{flex:none;font:inherit;font-size:13px;font-weight:800;padding:6px 10px;border-radius:12px;border:1px solid #ffffff14;background:#17254a;color:#fff}
#qrbar.ask{background:linear-gradient(90deg,#facc1522,transparent);color:var(--text)}
#qrbar.ask button{background:var(--gold);color:#111;border:0}
#qrbar.on{color:var(--gold);font-weight:700}
/* 📝 Только текст: поле не рисуется (слабый телефон, плохой интернет) — трансляция крупно; табло и решения как были */
#txtm{position:absolute;top:8px;right:100px;font:inherit;font-size:16px;padding:5px 9px;border-radius:10px;border:0;background:rgba(5,10,24,.75);color:#fff;z-index:2}
body.textonly #pitchwrap{overflow:visible;z-index:5;background:linear-gradient(#0b1328,#070d1f);border-bottom:1px solid var(--line)}
body.textonly #c,body.textonly #cam,body.textonly #label,body.textonly #rpl,body.textonly #tvg,body.textonly #smap,body.textonly #status{display:none}
body.textonly #flash,body.textonly #var,body.textonly #penres,body.textonly #note,body.textonly #exit{position:fixed}
body.textonly #txtm{right:54px}
body.textonly #talk,body.textonly #txtm,body.textonly #mute{top:4px;padding:3px 9px}
body.textonly .it{font-size:15.5px;line-height:1.4;padding:7px 0}
.rb{display:none}                       /* рядовые события (отбор, фол без последствий, удар мимо) — только в 📝 */
body.textonly .rb{display:block}
body.textonly .it.r{font-size:14px;color:#cbd5e1;padding:5px 0}
body.textonly #feed{padding-top:4px}
body.textonly .it.goal{font-size:17px}
#qbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qbar button{flex:none;font:inherit;font-size:14px;font-weight:800;padding:6px 12px;border-radius:12px;border:1px solid #ffffff14;background:#17254a;color:#fff}
#qs{position:fixed;left:0;right:0;bottom:0;z-index:4;display:none;flex-direction:column;max-height:62%;overflow-y:auto;background:#0b1328;border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.5)}
#qs.on{display:flex}
#qs .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:4px}
#qs .hd button{font:inherit;font-size:18px;background:none;border:0;color:var(--muted);padding:2px 6px}
#qs .sub{color:var(--muted);font-size:13px;margin:2px 0 6px;line-height:1.35}
#qs .res{font-size:14px;margin:4px 0 6px;padding:7px 10px;border-radius:10px;background:#16223f;line-height:1.35}
#qs .res.bad{background:#3b1420}
#qs .list{display:flex;flex-direction:column;gap:7px}
#qs .list button{font:inherit;font-size:14px;font-weight:700;padding:11px 10px;border-radius:12px;border:1px solid #ffffff14;background:#17254a;color:#fff;text-align:left}
#qs .list button.wait{background:#3a2a0c}
#qs .list button:disabled{opacity:.45}
#note{position:absolute;left:10px;right:10px;bottom:44px;text-align:center;font-size:14px;background:rgba(5,10,24,.85);border-radius:10px;padding:8px;display:none}
#note.on{display:block}
#exit{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:7;display:none;padding:16px;border:2px solid #fff;border-radius:16px;background:#22c55e;color:#052e16;font-weight:800;font-size:18px;box-shadow:0 0 0 3px rgba(34,197,94,.35),0 6px 22px rgba(0,0,0,.6)}
#exit.on{display:block}
#penres{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(calc(100% - 32px),420px);box-sizing:border-box;padding:10px 14px 12px;border-radius:12px;
  background:rgba(5,10,24,.93);border-top:4px solid #facc15;box-shadow:0 10px 30px rgba(0,0,0,.6);text-align:center;pointer-events:none;display:none;z-index:6}
#penres.on{display:block}
#penres b{display:block;font-size:22px;font-weight:900;color:#fff}
#penres span{display:block;margin-top:4px;font-size:14px;color:#cbd5e1}
#penres i{display:block;margin-top:6px;font-size:14px;font-style:normal;font-weight:800;color:#fbbf24}
#penres i:empty{display:none}
/* подсказка «один раз» на стадионе (отметку «Понятно» хранит бот — app/onboarding.py) */
#tip{position:absolute;left:10px;right:10px;top:10px;z-index:6;display:none;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;
  background:rgba(5,10,24,.92);border:1px solid #a16207;border-radius:12px;padding:9px 12px}
#tip.on{display:flex}#tip span{flex:1}
#tip button{flex:0 0 auto;padding:5px 10px;border-radius:9px;border:0;background:#facc15;color:#111;font-weight:700;font-size:12px}
#dec{flex:1;overflow-y:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:none;background:linear-gradient(#0b1328,#050a18)}
body.deciding #dec{display:block}
body.deciding #feed{display:none}
#dec h3{margin:2px 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#dec h3 small{color:var(--gold);font-size:14px;white-space:nowrap}
#dec .sub{color:var(--muted);font-size:13px;margin-bottom:6px;line-height:1.35}
#dec .res{font-size:14px;margin:6px 0;padding:7px 10px;border-radius:10px;background:#16223f;line-height:1.35}
#dec .res.bad{background:#3b1420}
#dec .edge{font-size:13px;margin:6px 0;padding:7px 10px;border-radius:10px;background:#1e293b;line-height:1.35;border-left:3px solid #64748b}
#dec .edge.up{border-left-color:#22c55e;background:#12301f}
#dec .edge.down{border-left-color:#f97316;background:#3a1d0c}
#dec .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#dec button{font:inherit;font-size:15px;font-weight:700;padding:12px 8px;border-radius:12px;border:1px solid #ffffff14;background:#17254a;
  color:#fff;text-align:left;-webkit-tap-highlight-color:transparent;line-height:1.25}
#dec button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
#dec button.wide{grid-column:1/-1}
#dec button.go{background:var(--gold);color:#111;text-align:center}
#dec button.hot{background:#7c2d12}
#dec button.on{outline:2px solid var(--gold)}
#dec button:disabled{opacity:.45}
#dec button:active:not(:disabled){transform:translateY(1px)}
#dec .list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
#dec .setg{margin-top:6px}
#dec .setg b{display:block;font-size:14px;margin:4px 0 5px}
#dec .setg b small{font-weight:400;color:var(--muted)}
#dec .setrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
#dec .setrow button{padding:10px 4px;font-size:13px;text-align:center}
#dec .setg .sub{margin:5px 0 0;font-size:12px}
#dec .tabs{display:flex;gap:6px;margin:0 0 8px}
#dec .tabs button{flex:1;text-align:center;padding:9px 6px;font-size:14px;background:#0f1a36}
#dec .tabs button.on{background:#1e3a8a;outline:2px solid var(--gold)}
#dec .mg .mghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;margin:2px 0 6px}
#dec .mg .mghead span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dec .mg .mghead i{font-style:normal;color:var(--gold);font-weight:800;font-size:16px}
#dec .mg .big{font-size:17px;font-weight:800;margin:8px 0;line-height:1.35}
#dec .mg .big.win{color:var(--gold)}

<script>

/* Живой матч — зритель. Всё считает бот: страница получает состояние и события минуты и только показывает их.

const rnd = (a, b) => a + Math.random() * (b - a), RND = rnd;
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

/* ---------------- координаты ---------------- */
// depth: 0 — своя линия ворот, 1 — чужая; xf: 0…1 слева направо
function at(t, depth, xf) {
  const x = M + xf * (W - 2 * M);
  const y = t === 0 ? H - M - depth * (H - 2 * M) : M + depth * (H - 2 * M);
  return {x, y};
}
const goalOf = t => ({x: W / 2, y: t === 0 ? M : H - M});        // ворота, которые атакует команда t
const CENTER = {x: W / 2, y: H / 2};

/* ---------------- состояние ---------------- */
let S = null;                // последнее состояние от бота
let shown = null;            // что показано на табло (счёт и статистика догоняют анимацию)
const players = {};          // "t:slot" -> фигурка {t, s, n, nm, gk, x, y, tx, ty, ...}
const ball = {x: CENTER.x, y: CENTER.y, h: 0, fx: CENTER.x, fy: CENTER.y, tx: CENTER.x, ty: CENTER.y, t0: 0, d: 1, arc: 0};
let poss = 0;                // кто сейчас с мячом (для «фона» игры)
let queue = [], step = null, stepEnd = 0, stepHard = 0, nextIdle = 0;
// перерыв на поле — только когда сцена показала свисток на перерыв: бот присылает фазу half сразу, а сцена ещё
// доигрывает эпизоды до свистка (сейв, угловой) — команды уходили бы в подтрибунное посреди удара
const halfOn = () => !!S && S.phase === 'half' && !queue.some(q => q.act && q.act.a === 'whistle' && q.act.w === 'half');
let fx = [];                 // частицы: конфетти, дым, пыль
let cards = [];              // карточки над игроками
let focus = {};              // "t:slot" -> {x, y} — куда бежит участник эпизода
let crowd = null;            // {t, kind} — команда сбегается (угловой, гол, потасовка)
let downed = null, stopped = false, fan = null, pyro = null;
let lastSeq = -1;

function key(t, s) { return t + ':' + s; }
function gkColor(t) {                   // форма вратаря: своя у клуба (kit.gk) или яркая, не похожая на обе команды и судью
  return kitOf(t).gk.c1;
}
function gkAuto(t, used) {
  const pal = ['#f97316', '#a855f7', '#06b6d4', '#ec4899', '#84cc16', '#e11d48', '#facc15', '#14b8a6'];
  const ok = pal.filter(c => !used.some(u => dist(c, u) < 120));
  const best = (cs, us) => cs.reduce((a, c) => { const m = c => Math.min(...us.map(u => dist(c, u))); return m(c) > m(a) ? c : a; });
  const first = ok[0] || best(pal, used);                 // всё занято — самый непохожий цвет палитры
  if (t === 0) return first;
  // второму авто-вратарю — цвет, заметно отличный и от первого (а не соседний оттенок палитры)
  return ok.find(c => c !== first && dist(c, first) >= 120) || best(pal.filter(c => c !== first), [first, ...used]);
}
/* ---------------- форма клуба: tm.kit = {p: узор, c2: второй цвет, so: гетры, co: воротник и манжеты, gk: [футболка, шорты], gl: 1} ----------------
   Узоры: plain, stripes (вертикальные полосы), hoops (горизонтальные), halves (половинки), quarters (четвертинки),
   sash (диагональная лента), sleeves (рукава вторым цветом), chevron (галочка на груди), fade (переход цвета сверху вниз),
   camo (камуфляж). gl — вечерний матч, форма уровня «Живая» (app/kits.py): светится окантовка и номер.
   Нет kit — обычная форма, как раньше. */
const KIT_P = ['plain', 'stripes', 'hoops', 'halves', 'quarters', 'sash', 'sleeves', 'chevron', 'fade', 'camo'];
const isHex = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);
const KITS = new Map();
// основные цвета формы команды (проверенные #rrggbb): узор, футболка, второй цвет, шорты, форма вратаря клуба
function kitBase(tm) {
  const kit = tm.kit && typeof tm.kit === 'object' ? tm.kit : {};
  const c1 = isHex(tm.shirt) ? tm.shirt : '#dc2626', sh = isHex(tm.shorts) ? tm.shorts : '#f5f5f5';
  const p = KIT_P.includes(kit.p) ? kit.p : 'plain';
  // второй цвет: заданный, иначе цвет шорт (если заметно отличается), иначе светлее/темнее футболки
  let c2 = isHex(kit.c2) ? kit.c2 : dist(c1, sh) > 90 ? sh : lum(c1) > 140 ? '#111827' : '#f5f5f5';
  if (dist(c1, c2) < 40) c2 = lum(c1) > 140 ? '#111827' : '#f5f5f5';
  return {kit, p, c1, c2, sh, gk: Array.isArray(kit.gk) ? kit.gk : []};
}
function kitOf(t) {
  const tm = S.teams[t], o = S.teams[1 - t] || tm;
  const id = JSON.stringify([tm.kit, tm.shirt, tm.shorts, o.kit, o.shirt, o.shorts]);
  let k = KITS.get(id + t);
  if (k) return k;
  const B = [0, 1].map(i => kitBase(S.teams[i] || tm)), {kit, p, c1, c2, sh} = B[t];
  const so = isHex(kit.so) ? kit.so : hexMix(sh, -.12), co = isHex(kit.co) ? kit.co : p === 'plain' ? hexMix(c1, -.4) : c2;
  // номер на спине: цвет, контрастный к обоим цветам узора, и обводка противоположная
  const lm = p === 'plain' ? lum(c1) : (lum(c1) + lum(c2)) / 2;
  const num = lm > 150 ? '#111' : '#fff', numEdge = lm > 150 ? 'rgba(255,255,255,.85)' : 'rgba(0,0,0,.75)';
  // вратари: свой цвет клуба, если не сливается с полевыми обеих команд, судьёй и другим вратарём; иначе — авто.
  // Список «занятых» цветов одинаков для обеих команд — тогда авто-вратари берут разные цвета (ok[0] и ok[1]).
  const fc = B.flatMap(b => b.p === 'plain' ? [b.c1] : [b.c1, b.c2]).concat('#111827');
  const own = b => isHex(b.gk[0]) && !fc.some(u => dist(b.gk[0], u) < 90) ? b.gk[0] : null;
  const a0 = own(B[0]), a1 = own(B[1]) && !(a0 && dist(B[1].gk[0], a0) < 90) ? B[1].gk[0] : null;
  const mine = t === 0 ? a0 : a1, other = t === 0 ? a1 : a0;
  const gc = mine || gkAuto(t, other ? [...fc, other] : fc), g0 = B[t].gk;
  const gsh = isHex(g0[1]) && gc === g0[0] ? g0[1] : hexMix(gc, -.55);
  k = {p, c1, c2, sh, so, co, num, numEdge, plain: !tm.kit, gl: !!kit.gl,
       gk: {p: 'plain', c1: gc, c2: hexMix(gc, -.35), sh: gsh, so: gc, co: hexMix(gc, -.45), num: ink(gc), numEdge: lum(gc) > 150 ? 'rgba(255,255,255,.85)' : 'rgba(0,0,0,.75)'}};
  if (KITS.size > 50) KITS.clear();
  KITS.set(id + t, k);
  return k;
}
function hexMix(h, k) {                // как mix, но в виде #rrggbb — чтобы цвет формы можно было снова осветлять/затемнять
  return '#' + mix0(h, k).match(/\d+/g).map(v => (+v).toString(16).padStart(2, '0')).join('');
}
function lum(hex) { const [r, gg, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return (r * 299 + gg * 587 + b * 114) / 1000; }
// узор на корпусе: x поперёк груди (-w/2…w/2), y от плеч (0) до пояса (h). view: 'front' | 'back' | 'side', face — куда смотрит в профиль.
// Рисуется поверх залитой основным цветом футболки, под clip по её контуру.
function kitPaint(k, w, h, view, face) {
  const p = k.p; if (p === 'plain' || p === 'sleeves') {
    if (p === 'sleeves' && view !== 'side') { g.fillStyle = k.c2; g.fillRect(-w / 2, 0, 2.4, 4.2); g.fillRect(w / 2 - 2.4, 0, 2.4, 4.2); }   // реглан: плечи вторым цветом
    return;
  }
  const mir = view === 'back' ? -1 : 1;                   // со спины левое и правое меняются местами
  g.fillStyle = k.c2;
  if (p === 'stripes') { for (const i of [-3, -1, 1, 3]) g.fillRect((i - .5) * w / 5, 0, w / 5, h); }   // полосы — пятые доли ширины
  else if (p === 'hoops') { for (let y = 2.6; y < h; y += 5.2) g.fillRect(-w / 2, y, w, 2.6); }
  else if (p === 'halves' || p === 'quarters') {
    if (view === 'side') {                                  // в профиль видна одна половина — та, что к нам
      if (p === 'halves') { if (face < 0) g.fillRect(-w / 2, 0, w, h); }
      else g.fillRect(-w / 2, face < 0 ? 0 : h / 2, w, h / 2);
    }
    else { g.fillRect(mir > 0 ? 0 : -w / 2, 0, w / 2, p === 'quarters' ? h / 2 : h); if (p === 'quarters') g.fillRect(mir > 0 ? -w / 2 : 0, h / 2, w / 2, h / 2); }
  }
  else if (p === 'sash') {
    const s = view === 'side' ? face : mir, b = 2.4;         // лента от плеча к противоположному боку
    g.beginPath(); g.moveTo(-s * (w / 2 + b), -1); g.lineTo(-s * (w / 2 - b), -1); g.lineTo(s * (w / 2 + b), h + 1); g.lineTo(s * (w / 2 - b), h + 1); g.closePath(); g.fill();
  }
  else if (p === 'chevron') {
    const a = h * .18, m = h * .5, t = 3;
    g.beginPath(); g.moveTo(-w / 2 - 1, a); g.lineTo(0, m); g.lineTo(w / 2 + 1, a); g.lineTo(w / 2 + 1, a + t); g.lineTo(0, m + t); g.lineTo(-w / 2 - 1, a + t); g.closePath(); g.fill();
  }
  else if (p === 'fade') {                                  // переход: сверху — основной цвет, к поясу — второй
    const id = k.c2 + '|' + Math.round(h);
    let gr = KIT_FADE.get(id);
    if (!gr) { gr = g.createLinearGradient(0, h * .15, 0, h); gr.addColorStop(0, hexA(k.c2, 0)); gr.addColorStop(1, k.c2); if (KIT_FADE.size > 40) KIT_FADE.clear(); KIT_FADE.set(id, gr); }
    g.fillStyle = gr; g.fillRect(-w / 2 - 1, 0, w + 2, h + 1);
  }

    const s = view === 'side' ? face : mir, dark = k.camo || (k.camo = hexMix(k.c1, -.35));
    for (const [x, y, rx, ry, c] of KIT_CAMO) { g.fillStyle = c ? k.c2 : dark; g.beginPath(); g.ellipse(s * x * w / 2, y * h, rx * w, ry * h, s * .5, 0, 7); g.fill(); }
  }
}
const KIT_FADE = new Map();
// пятна камуфляжа: x — доля полуширины, y — доля высоты, радиусы — доли ширины и высоты, 1 — второй цвет, 0 — тёмный
const KIT_CAMO = [[-.6, .12, .26, .13, 1], [.45, .22, .3, .12, 0], [-.1, .42, .28, .14, 1], [.7, .55, .22, .13, 1], [-.65, .66, .24, .12, 0], [.15, .8, .3, .12, 0], [-.35, .95, .2, .1, 1]];

function kitGlow(k, tp) {

// объём футболки поверх узора: светлая середина, тёмные края (градиенты в своих координатах — общие для всех фигурок)
const TORSO_SH = {};
function torsoShade(w) {
  let gr = TORSO_SH[w];
  if (!gr) {
    gr = g.createLinearGradient(-w / 2, 0, w / 2, 0);
    gr.addColorStop(0, 'rgba(0,0,0,.3)'); gr.addColorStop(.35, 'rgba(255,255,255,.12)'); gr.addColorStop(.7, 'rgba(0,0,0,.02)'); gr.addColorStop(1, 'rgba(0,0,0,.36)');
    TORSO_SH[w] = gr;
  }

function dist(a, b) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);

function ink(hex) {                     // цвет номера: тёмный на светлой футболке
  const [r, gg, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return (r * 299 + gg * 587 + b * 114) / 1000 > 150 ? '#111' : '#fff';

// базовые места по схеме: вратарь, защитники, нападающие; команда с мячом выдвигается вперёд
function base(t, role, i, n) {
  const spread = n === 1 ? [.5] : n === 2 ? [.3, .7] : [.2, .5, .8];
  if (role === 'gk') return {depth: .035, xf: .5};
  const xf = spread[i] !== undefined ? spread[i] : .5;
  return role === 'def' ? {depth: .2, xf} : role === 'mid' ? {depth: .33, xf} : {depth: .46, xf};
}
// st — состояние, по которому расставить (по умолчанию последнее от бота); only — добавить только этих новых
// (вышедший на замену выбегает из тоннеля), никого не убирая
function syncLineup(st, only) {
  st = st || S;

    const list = [['gk', [tm.gk]], ['def', tm.def], ['mid', tm.mid || []], ['att', tm.att]];
    for (const [role, arr] of list) arr.forEach((p, i) => {
      const k = key(t, p.s); seen.add(k);
      const b = base(t, role, i, arr.length);
      let f = players[k];

/* ---------------- травма: игрок лежит, выбегают врачи ----------------
   Лёгкая (ушиб): медик подбегает от тоннеля, осматривает (наклонился), игрок поднимается, медик уходит. Тяжёлая: двое
   с носилками, игрока кладут и уносят к тоннелю — там он лежит (hurt), пока не выйдет замена (она приходит следующим
   событием) или бот не уберёт его из состава. Что случилось и надолго ли — решил бот; сцена только показывает. */
const MEDIC_MS = {light: 6000, heavy: 9000, lightShort: 3000, heavyShort: 4500};
const MED = {arrive: .3, up: .72, lift: .55};          // доли эпизода: врачи добежали / ушибленный встал / носилки подняли
let medic = null;                                      // {p, heavy, t0, dur, spot, park, from, crew: [{x, y, f, v, pz}], cam}
function startMedic(p, heavy, dur) {
  if (medic) endMedic();
  const now = performance.now(), from = {x: TUNNEL.x + 8, y: TUNNEL.y};
  medic = {p, heavy, t0: now, dur, spot: {x: p.x, y: p.y}, park: {x: TUNNEL.x + 12, y: TUNNEL.y + (p.t ? -20 : 20)}, from, cam: {x: p.x, y: p.y},
           crew: (heavy ? [0, 1] : [0]).map(i => ({x: from.x, y: from.y + i * 8, v: 0, pz: null, f: {stride: 0, pw: 100, ang: 0, s: i}}))};
  p.lie = true; p.pose = null; p.face = {a: p.ang || 0, until: now + 600000};    // лежит и не вертится: носилки — вдоль тела
  const k = key(p.t, p.s);

  delete focus[k];
}
function endMedic() {
  const m0 = medic; medic = null;
  if (!m0) return;
  const p = m0.p; p.lie = false;
  if (m0.heavy) { p.hurt = {x: m0.park.x, y: m0.park.y}; p.x = m0.park.x; p.y = m0.park.y; }   // лежит у тоннеля до замены
  else p.face = null;
}
function medicTick(now) {
  for (const k in players) { const q = players[k]; if (q.hurt) { q.x = q.hurt.x; q.y = q.hurt.y; q.ux = q.uy = q.vx = q.vy = 0; } }
  const m0 = medic; if (!m0) return;
  const f = (now - m0.t0) / m0.dur, p = m0.p, here = players[key(p.t, p.s)] === p;
  if (f >= 1 || (!here && !gone.includes(p))) { endMedic(); return; }
  const u = {x: Math.cos(cam.r), y: -Math.sin(cam.r)};             // «вправо на экране» в координатах поля: носилки — вдоль экрана, как лежит игрок
  const dir = Math.cos((p.ang || 0) + cam.r) >= 0 ? 1 : -1;         // в какую сторону он лежит головой (как в figure)
  const body = m0.heavy && f > MED.lift ? lerpPt(m0.spot, m0.park, ease((f - MED.lift) / (1 - MED.lift))) : m0.spot;
  if (here) { p.x = body.x; p.y = body.y; p.ux = p.uy = p.vx = p.vy = 0; }
  if (!m0.heavy && f > MED.up) p.lie = false;                       // ушиб: поднялся
  m0.cam = body;
  m0.crew.forEach((c, i) => {                                       // у головы и у ног (носилки) или сбоку (медик)
    const off = (m0.heavy ? (i ? 22 : -31) : 13) * dir * PS;
    const by = {x: body.x + u.x * off, y: body.y + u.y * off};
    const tgt = f < MED.arrive ? lerpPt(m0.from, {x: m0.spot.x + u.x * off, y: m0.spot.y + u.y * off}, ease(f / MED.arrive))
      : !m0.heavy && f > MED.up ? lerpPt(by, m0.from, ease((f - MED.up) / (1 - MED.up))) : by;
    c.v = Math.hypot(tgt.x - c.x, tgt.y - c.y);
    if (c.v > .05) c.f.ang = Math.atan2(tgt.y - c.y, tgt.x - c.x);
    c.f.stride += Math.min(c.v, 4) * .2; c.x = tgt.x; c.y = tgt.y;
    c.pz = f < MED.arrive || (!m0.heavy && f > MED.up) ? null : m0.heavy && f > MED.lift ? 'carry' : 'knees';

function drawMedic(now) {
  const m0 = medic; if (!m0) return;
  const f = (now - m0.t0) / m0.dur, p = m0.p, b = m0.cam;
  if (m0.heavy && f > MED.arrive * .8) {                            // носилки под игроком, с красным крестом
    const dir = Math.cos((p.ang || 0) + cam.r) >= 0 ? 1 : -1;

      g.save(); g.translate(b.x, b.y); g.scale(PS * dir, PS);

      g.fillStyle = '#e2e8f0'; g.fillRect(-28, -10, 46, 8); g.strokeStyle = '#64748b'; g.lineWidth = 1.4; g.strokeRect(-28, -10, 46, 8);
      g.fillStyle = '#dc2626'; g.fillRect(-7, -6.7, 5, 1.6); g.fillRect(-5.3, -8.4, 1.6, 5);

    if (c.x < TUNNEL.x + 6) continue;
    g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(c.x, c.y, 8 * PS, 5 * PS, 0, 0, 7); g.fill();
    const L = {skin: c.f.s ? '#c68863' : '#e0ac85', hair: '#1c1917', bald: !!c.f.s};
    upright(c.x, c.y, () => figure({...c.f, x: c.x, y: c.y}, now, {shorts: '#f8fafc'}, '#16a34a', L, c.v, c.pz, false, {trousers: '#f8fafc'}));

/* ---------------- конфликты на поле: стычка, драка, массовая потасовка, скандал с судьёй ----------------
   Как в жизни, по фазам (доли длины эпизода): лицом к лицу, грудь в грудь (0–.14) → толчок и ответ (.14–.3) → в драке
   удар, соперник падает (.3–.36) → сбегаются партнёры, толпа накатывает волнами (кто толкается, кто кричит) → судья
   вбегает в середину, свистит и разводит руками (.34–.72) → своих оттаскивают сзади (.55–.85) → судья показывает
   карточку на месте (.86–1; цвет — из следующего события минуты, нет карточки — жест «успокойтесь»). Вариантов несколько
   (кто толкнул первым, толчок / схватил за футболку / лоб в лоб, удар рукой или головой, сколько волн, упавший

/* ---------------- подключение к комнате матча ---------------- */
const Q = new URLSearchParams(location.search);
const ROOM = Q.get('room');
const DUEL_WS = 'wss://football-duel.pinkovskyi2508.workers.dev';   // сервер комнат (worker/), только он
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
// адрес сервера и подпись из ссылки — только при проверке на своём компьютере: иначе чужая ссылка увела бы подпись на чужой сервер
const WS_BASE = LOCAL && Q.get('ws') ? Q.get('ws') : DUEL_WS;
const INIT = (TG && TG.initData) || (LOCAL ? Q.get('init') || '' : '');
let ws = null, retry = 0, ended = false;
function connect() {
  note(S ? 'Переподключаемся…' : 'Подключаемся к матчу…');
  ws = new WebSocket(WS_BASE.replace(/^http/, 'ws') + '/rooms/' + encodeURIComponent(ROOM) + '/player');
  ws.onopen = () => { ws.send(JSON.stringify({type: 'hello', initData: INIT}));
    if (!seen) ws.send(JSON.stringify({type: 'act', act: {a: 'seen', on: false}})); };
  clearInterval(connect.ping);           // молчащее соединение Cloudflare закрывает (~100 сек) — пингуем
  connect.ping = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 30000);
  ws.onmessage = e => {
    if (e.data === 'pong') return;
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    retry = 0;
    if (m.type === 'state') onState(m);
    else if (m.type === 'mine') onMine(m);
    else if (m.type === 'pen') onPen(m);
    else if (m.type === 'mg') onMg(m);
    else if (m.type === 'bets') onBets(m);
    else if (m.type === 'chat') onChat(m);
    else if (m.type === 'chats') onChats(m);
    else if (m.type === 'ack') { if (chatWait[m.id] !== undefined) onChatAck(m); else onAck(m); }
    else if (m.type === 'tick') { onTick(m); note(''); }
    else if (m.type === 'bot_left') note('Бот переподключается — матч продолжится, подождите…');
    else if (m.type === 'hint') showTip(m.text);
    else if (m.type === 'learn') onLearn(m);
  };
  ws.onclose = e => {
    if (e.code === 4003) { ended = true; note('Этот матч смотрят только его менеджеры.'); return; }
    if (e.code === 4001) { ended = true; note(S && S.phase === 'final' ? 'Матч окончен. Итог — в чате.' : 'Трансляция закрыта. Матч — в чате.'); return; }
    if (ended) return;
    retry++;
    note('Связь потеряна — переподключаемся…');
    setTimeout(connect, Math.min(10000, 1500 * retry));
  };
}

// демо сценариев (app/plays.py): ?play=corner — розыгрыши углового по очереди, ?play=corner.short — только короткий;
// виды: attack (подход к удару), won (как заработан угловой), corner, clear (вынос после углового), tackle, fk,
// finish (как нанесён удар: ?play=finish.bicycle — только через себя)
function demoFin(k) {                      // случайный удар в демо: примерно каждый шестой — эффектный, с подходящим подходом
  if (k === 'miss' ? Math.random() >= .1 : Math.random() >= .17) return {};
  const f = Object.keys(PLAYS.finish)[Math.floor(Math.random() * 4)], r = Math.random();
  const play = f === 'lob' ? (r < .6 ? 'through' : 'counter') : f === 'diving_header' ? 'cross' : r < .7 ? 'cross' : 'rebound';
  return {finish: f, play, over: k === 'miss' ? f === 'lob' || Math.random() < .5 : undefined};
}
const PLAYQ = (() => { const [k, v] = (Q.get('play') || '').split('.'); return k === 'offside' ? {k, v: null, i: 0} : PLAYS[k] ? {k, v: PLAYS[k][v] ? v : null, i: 0} : null; })();   // ?play=offside — офсайды
function demoPlay(st, acts, feed) {
  const q = PLAYQ, list = Object.keys(PLAYS[q.k] || {offside: 1}), v = q.v || list[q.i % list.length], i = q.i++;
  const t = i % 2 === 0 ? 0 : 1, tm = st.teams[t], op = st.teams[1 - t], m = st.minute;
  const s = tm.att[0].s, by = (tm.mid[0] || tm.def[0]).s, sc = () => [st.teams[0].score, st.teams[1].score], ph = (k, x) => PLAYS[k][x];
  const shot = (r, how, extra) => { tm.shots++; if (r !== 'miss') tm.on++; if (r === 'goal') tm.score++; acts.push({a: r, t, s, how, score: sc(), ...(r === 'goal' ? demoCel() : {}), ...(extra || {})}); };
  const res = ['save', 'miss', 'save', 'goal'][i % 4];
  if (q.k === 'attack') { shot(res, 'удар', {play: v, by}); feed.push({m, t: `${m}' ${res === 'goal' ? '⚽ ГОЛ!' : res === 'save' ? '🧤 Сейв!' : '💨 Мимо'} · ${ph('attack', v)}`}); return; }
  if (q.k === 'move') {                     // разновидности: откат и обгон — у прострела, третий — у стенки и паса вразрез
    shot(res, 'удар', {play: v === 'third' ? (i % 2 ? 'through' : 'wall') : 'cross', move: v, by});
    feed.push({m, t: `${m}' ${res === 'goal' ? '⚽ ГОЛ!' : res === 'save' ? '🧤 Сейв!' : '💨 Мимо'} · ${ph('move', v)}`}); return;
  }
  if (q.k === 'offside') { acts.push({a: 'offside', t, s, by}); feed.push({m, t: `${m}' 🚩 Офсайд: №${P(t, s) ? P(t, s).n : ''} «${tm.name}» — вне игры`}); return; }
  if (q.k === 'finish') {                   // как нанесён удар: с игры после подходящего подхода, через себя и рыбкой — и после углового
    const fr = ['goal', 'save', 'goal', 'miss'][i % 4], lob = v === 'lob', corner = !lob && v !== 'volley' && i % 3 === 2;
    if (corner) { tm.corners++; acts.push({a: 'corner', t, won: 'cross_block', play: 'near'}); }
    shot(fr, corner ? 'удар после углового' : 'удар', {finish: v, ...(corner ? {} : {play: lob ? 'through' : i % 2 ? 'rebound' : 'cross', by}), ...(fr === 'miss' ? {over: lob || i % 8 < 4} : {})});
    feed.push({m, t: `${m}' ${fr === 'goal' ? '⚽ ГОЛ!' : fr === 'save' ? '🧤 Сейв!' : '💨 Мимо'} · ${ph('finish', v)}`}); return;
  }
  if (q.k === 'tackle') { acts.push({a: 'tackle', t: 1 - t, s: op.def[0].s, play: v}); feed.push({m, t: `${m}' ` + ph('tackle', v).replace('{d}', op.name).replace('{a}', tm.name)}); return; }
  if (q.k === 'fk') {

  if (won === 'tip') shot('save', 'удар', {play: 'long', by});

}

// демо: запланированные моменты, чтобы без бота было видно повтор гола, штрафной, замену и удаление (?script=0 — без них)
function demoScript(st, acts, feed) {
  if (Q.get('script') === '0') return false;
  const m = st.minute, tag = p => `№${p.n} ${p.nm}`;
  const inj = Q.get('injury');                      // ?injury=light|heavy — только этот вид травмы, 0 — без травм

    const tm = st.teams[0], p = tm.att[0]; tm.shots++; tm.on++; tm.score++;
    acts.push({a: 'goal', t: 0, s: p.s, how: 'удар', score: [st.teams[0].score, st.teams[1].score], ...demoCel()});
    feed.push({m, t: `${m}' ⚽ ГОЛ! ${tag(p)} — ${st.teams[0].score}:${st.teams[1].score}`});
  } else if (m === 9) {                             // опасный штрафной без дуэли: стенка, пена, удар дугой с закруткой
    const tm = st.teams[1], p = tm.att[0], f = st.teams[0].def[0]; tm.shots++; tm.on++; tm.score++;
    acts.push({a: 'foul', t: 0, s: f.s, v: p.s}, {a: 'fk', t: 1}, {a: 'goal', t: 1, s: p.s, how: 'штрафной', score: [st.teams[0].score, st.teams[1].score], ...demoCel()});
    feed.push({m, t: `${m}' 🛑 Фол → 🎯 Опасный штрафной! ⚽ ГОЛ! ${tag(p)} — ${st.teams[0].score}:${st.teams[1].score}`});
  } else if (m === 6 && inj !== '0' && inj !== 'heavy') {   // ушиб: медик, игрок встаёт
    demoInjury(st, 0, false, acts, feed);
  } else if (m === (inj === 'heavy' ? 6 : 11) && inj !== '0' && inj !== 'light') {  // тяжёлая травма (?injury=heavy — уже на 6-й): носилки, к тоннелю, выходит запасной
    demoInjury(st, 1, true, acts, feed);
  } else if (m === 13) {                            // замена: уходит полузащитник, выходит запасной
    const tm = st.teams[0], line = tm.mid.length ? tm.mid : tm.def, out = line[0], inn = {s: 8, n: 14, nm: 'Аль Новиков', y: 0, c: false, pw: 100};
    line[0] = inn;

    feed.push({m, t: `${m}' 🔄 Замена в «${tm.name}»: выходит ${tag(inn)}, уходит ${tag(out)}`});
  } else if (m === 17) {                            // вторая жёлтая — удаление: игрок уходит с поля
    const tm = st.teams[1], p = tm.mid[0] || tm.def[0], v = st.teams[0].att[0];
    for (const k of ['def', 'mid', 'att']) tm[k] = tm[k].filter(x => x !== p);
    tm.off.push(p.n); tm.fouls++;
    acts.push({a: 'foul', t: 1, s: p.s, v: v.s}, {a: 'card', c: 'red', t: 1, s: p.s});
    feed.push({m, t: `${m}' 🟥 Вторая жёлтая — удаление! ${tag(p)} (${tm.name})`});
  } else return false;
  return true;
}
// демо: жест автора гола — ?celeb=plane|roll|shh|knees|dance|biceps|heart|fans (все голы), 0 — без жеста; иначе по очереди все

// демо: травма как от бота — лёгкая (ушиб, «игра возобновлена») или тяжёлая (носилки, замена, «игра возобновлена»)
function demoInjury(st, t, heavy, acts, feed) {

  if (heavy && !tm.def.concat(tm.mid || [], tm.att).some(x => x.s === 9)) {

// демо мини-игры перерыва: раунды и ответы «как от бота»
const DEMO_MG = {

  setTimeout(() => { if (z.q && z.q.round === z.r) { z.q.opp = true; onMg({...mg, q: {...z.q}}); } }, 1500);
}
function demoMgAnswer(i) {

  z.q.mine = i; z.q.can = false; onMg({...mg, q: {...z.q}});
  setTimeout(() => {
    const d = z.d, o = Math.floor(Math.random() * d.opts.length); let reveal;
    if (z.kind === 'tactics') { const B = [[0, 1], [1, 2], [2, 0]], w = B.some(([a, b]) => a === i && b === o) ? 0 : B.some(([a, b]) => a === o && b === i) ? 1 : null; if (w !== null) z.score[w]++; reveal = {text: w === null ? 'Ничья в раунде' : w === 0 ? 'Очко ваше!' : 'Очко сопернику', tac: [i, o], point: w}; }
    else if (z.kind === 'penalty') { const kick = z.q.role === 'kick', kd = kick ? i : o, gd = kick ? o : i, saved = kd === gd, k = kick ? 0 : 1; z.series[k].push(!saved); if (!saved) z.score[k]++; reveal = {text: saved ? '🧤 СЕЙВ!' : '⚽ ГОЛ!', kd, gd, saved, k}; }
    else { if (i === d.right) z.score[0]++; if (o === d.right) z.score[1]++; reveal = {text: '✅ Верный ответ: ' + d.opts[d.right], right: d.opts[d.right], you: d.opts[i]}; }
    z.q = null; onMg({...z.base, stage: 'play', i: z.r + 1, score: z.score, reveal, series: z.kind === 'penalty' ? z.series : undefined});
    z.r++;
    setTimeout(() => z.r < 4 ? demoQ() : onMg({...z.base, stage: 'done', score: z.score, winner: z.score[0] > z.score[1] ? 0 : z.score[1] > z.score[0] ? 1 : null}), 2500);

// демо пенальти в сцене: вы бьёте (команда 0) или ловите; соперник и исход — случайные, как «ответ бота»
let demoWid = 100;
function demoPen(t, fk) {                       // fk — штрафной у самой штрафной: стенка из полевых соперника
  const tm = S.teams[t], o = S.teams[1 - t], kp = tm.att[0] || tm.def[0];
  onPen({type: 'pen', open: true, wid: ++demoWid, kind: fk ? 'fk' : 'penalty', role: t === 0 ? 'kick' : 'keep', left: 25, picked: null,
         kicker: {num: kp.n, name: kp.nm, stat: 'Удар 30', shirt: tm.shirt, shorts: tm.shorts},
         keeper: {num: o.gk.n, name: o.gk.nm, stat: 'Вратарство 28', shirt: fk ? o.shirt : gkColor(1 - t)},
         wall: [...o.def, ...(o.mid || [])].slice(0, 4).map(p => p.n), shorts2: o.shorts, spot: Math.round((Math.random() * 1.2 - .6) * 100) / 100, minute: S.minute});
  demoPen.t = t; demoPen.timer = setTimeout(() => demoAct({a: 'pen', v: null}), 25000);   // то же время, что у бота (LIVE penalty_sec)
}
function demoAct(a) {
  if (a.a === 'mg') { demoMgAnswer(a.i); return; }
  if (a.a === 'bet') { if (bets) { bets = {...bets, mine: a.i}; renderDec(); } return; }
  if (a.a === 'qsub' || a.a === 'qdel') { demoQAct(a); return; }
  if (a.a === 'quick') { demoQuick(); return; }
  if (a.a !== 'pen' || !pen || !pen.open) return;
  clearTimeout(demoPen.timer);
  const role = pen.role, v = a.v;
  const note = v === null ? '⏱ Время вышло — ' + (role === 'kick' ? 'удар выбран' : pen.kind === 'fk' ? 'стенка и вратарь выбраны' : 'прыжок выбран') + ' случайно' : '';   // как у бота: auto_note
  if (v !== null) toFrame({type: 'picked', value: v});
  if (pen.kind === 'fk') {                      // штрафной: правила как у бота (FK_DUEL), без характеристик
    const fk = role === 'kick' && v !== null ? v : Math.floor(Math.random() * 4), dv = role === 'keep' && v !== null ? v : Math.floor(Math.random() * 6);
    const wall = Math.floor(dv / 3), dive = dv % 3, over = fk < 2, col = fk % 2 ? 2 : 0;
    const outcome = Math.random() < (over ? (wall ? .62 : .2) : (wall ? .14 : .68)) ? 'block' : Math.random() < .43 ? 'miss'
                  : Math.random() < (dive === col ? .55 : dive === 1 ? .25 : 0) ? 'save' : 'goal';
    const text = {block: 'Стенка блокирует!', miss: over ? 'Над перекладиной!' : 'Мимо, рядом со штангой!', save: 'Вратарь достаёт из угла!'}[outcome] || 'Вратарь ушёл не в тот угол';
    setTimeout(() => {
      onPen({type: 'pen', open: false});
      onPen({type: 'pen', open: false, result: {fk, wall, dive, outcome, text, ...(note ? {auto: [role], note} : {})}});
      const t = demoPen.t, tm = S.teams[t];
      if (outcome === 'goal') tm.score++;
      const act = outcome === 'block' ? {a: 'clear', t} : {a: outcome, t, s: (tm.att[0] || tm.def[0]).s, how: 'штрафной', score: [S.teams[0].score, S.teams[1].score]};
      onTick({seq: Date.now(), state: JSON.parse(JSON.stringify(S)), acts: [{a: 'fk', t}, act], feed: [{m: S.minute, t: `${S.minute}' 🎯 Штрафной у самой штрафной: ` + text}, ...(note ? [{m: S.minute, t: note}] : [])]});
    }, 700);
    return;
  }
  const aim = role === 'kick' && v !== null ? v : Math.floor(Math.random() * 6), dive = role === 'keep' && v !== null ? v : Math.floor(Math.random() * 3);
  const outcome = Math.random() < .08 ? 'miss' : aim % 3 === dive && Math.random() < .5 ? 'save' : 'goal';
  setTimeout(() => {
    onPen({type: 'pen', open: false});
    onPen({type: 'pen', open: false, result: {aim, dive, outcome, text: outcome === 'goal' ? 'Вратарь прыгнул в другую сторону' : outcome === 'save' ? 'Вратарь угадал угол!' : 'Мимо!', ...(note ? {auto: [role], note} : {})}});

    if (outcome === 'goal') tm.score++;
    onTick({seq: Date.now(), state: JSON.parse(JSON.stringify(S)), acts: [{a: 'pen', t}, {a: outcome, t, s: (tm.att[0] || tm.def[0]).s, how: 'пенальти', score: [S.teams[0].score, S.teams[1].score]}], feed: [{m: S.minute, t: `${S.minute}' 🥅 Пенальти: ` + outcome}, ...(note ? [{m: S.minute, t: note}] : [])]});
  }, 700);
}
