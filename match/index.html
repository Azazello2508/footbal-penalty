<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Матч</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050a18;--panel:#0b1328;--line:#1c2742;--text:#f1f5f9;--muted:#94a3b8;--gold:#facc15;--comm:#fde68a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;-webkit-user-select:none;user-select:none;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;height:var(--vh,100dvh)}
#top{padding:calc(8px + env(safe-area-inset-top)) 12px 6px;background:linear-gradient(#0d1730,#070d1f);border-bottom:1px solid var(--line);flex:none}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:15px}
.tm.away{justify-content:flex-end;text-align:right}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kit{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #fff3;box-sizing:border-box}
#score{font-size:30px;font-weight:800;letter-spacing:1px;min-width:78px;text-align:center;transition:transform .25s}
#score.bump{transform:scale(1.35);color:var(--gold)}
#clockrow{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}
#clock{color:var(--text);font-weight:700}
#bar{position:relative;height:5px;border-radius:3px;background:#1e293b;margin:5px 0 4px;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#22c55e,var(--gold));transition:width .6s}
#bar i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#0b1328}
#stats{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:13px;text-align:center;min-height:17px;margin-top:3px;color:var(--gold);font-weight:700}
#pitchwrap{position:relative;flex:none;display:flex;justify-content:center;background:#04170c;overflow:hidden}
canvas{display:block}
#chant{position:absolute;left:50%;bottom:8px;transform:translateX(-50%) translateY(6px);max-width:92%;padding:5px 12px;border-radius:14px;
  background:rgba(5,10,24,.78);border:1.5px solid var(--cc,#facc15);color:#e2e8f0;font-size:14px;font-weight:800;letter-spacing:.3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:2}
#chant.on{opacity:1;transform:translateX(-50%)}
#chant span{color:#94a3b8;transition:color .1s}
#chant span.was{color:#e2e8f0}
#chant span.now{color:#fde047;text-shadow:0 0 8px var(--cc,#facc15)}
#label{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(5,10,24,.82);border:1px solid #ffffff22;
  padding:6px 12px;border-radius:12px;font-weight:800;font-size:15px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:92%;overflow:hidden;text-overflow:ellipsis}
#label.on{opacity:1}
#flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#flash b{font-size:76px;font-weight:900;letter-spacing:3px;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:0 0 24px var(--fc,#facc15),0 6px 0 #000}
#flash span{margin-top:6px;font-size:17px;font-weight:800;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:10px;max-width:92%;text-align:center}
#flash.on{animation:flash 2.6s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
#feed{flex:1;overflow-y:auto;padding:6px 12px calc(10px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.it{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
.it.c{color:var(--comm);font-style:italic;padding-left:14px}
.it.goal{font-weight:800;color:#fff;background:linear-gradient(90deg,#facc1522,transparent);padding-left:6px}
.it.new{animation:pop .5s ease-out}
@keyframes pop{from{background:#facc1533}to{}}
#cam{position:absolute;top:8px;right:54px;font:inherit;font-size:16px;padding:5px 9px;border-radius:10px;border:0;background:rgba(5,10,24,.75);color:#fff;z-index:2}
#cam.off{opacity:.45}
#mute{position:absolute;top:8px;right:8px;font:inherit;font-size:16px;padding:5px 9px;border-radius:10px;border:0;background:rgba(5,10,24,.75);color:#fff;z-index:2}
#note{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-size:14px;background:rgba(5,10,24,.85);border-radius:10px;padding:8px;display:none}
#note.on{display:block}
#dec{flex:1;overflow-y:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));display:none;background:linear-gradient(#0b1328,#050a18)}
body.deciding #dec{display:block}
body.deciding #feed{display:none}
#dec h3{margin:2px 0 4px;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#dec h3 small{color:var(--gold);font-size:14px;white-space:nowrap}
#dec .sub{color:var(--muted);font-size:13px;margin-bottom:6px;line-height:1.35}
#dec .res{font-size:14px;margin:6px 0;padding:7px 10px;border-radius:10px;background:#16223f;line-height:1.35}
#dec .res.bad{background:#3b1420}
#dec .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#dec button{font:inherit;font-size:15px;font-weight:700;padding:12px 8px;border-radius:12px;border:1px solid #ffffff14;background:#17254a;
  color:#fff;text-align:left;-webkit-tap-highlight-color:transparent;line-height:1.25}
#dec button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
#dec button.wide{grid-column:1/-1}
#dec button.go{background:var(--gold);color:#111;text-align:center}
#dec button.hot{background:#7c2d12}
#dec button.on{outline:2px solid var(--gold)}
#dec button:disabled{opacity:.45}
#dec button:active:not(:disabled){transform:translateY(1px)}
#dec .list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
#dec .setg{margin-top:6px}
#dec .setg b{display:block;font-size:14px;margin:4px 0 5px}
#dec .setg b small{font-weight:400;color:var(--muted)}
#dec .setrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
#dec .setrow button{padding:10px 4px;font-size:13px;text-align:center}
#dec .setg .sub{margin:5px 0 0;font-size:12px}
#dec .tabs{display:flex;gap:6px;margin:0 0 8px}
#dec .tabs button{flex:1;text-align:center;padding:9px 6px;font-size:14px;background:#0f1a36}
#dec .tabs button.on{background:#1e3a8a;outline:2px solid var(--gold)}
#dec .mg .mghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;margin:2px 0 6px}
#dec .mg .mghead span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dec .mg .mghead i{font-style:normal;color:var(--gold);font-weight:800;font-size:16px}
#dec .mg .big{font-size:17px;font-weight:800;margin:8px 0;line-height:1.35}
#dec .mg .big.win{color:var(--gold)}
#dec .mg .round{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
#dec .mg .round small{color:var(--gold);font-size:14px;font-weight:700}
#dec .mg .tbar{height:5px;background:#1e293b;border-radius:3px;overflow:hidden;margin:5px 0 8px}
#dec .mg .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f87171,var(--gold),#22c55e);transition:width .25s linear}
#dec .mg .qtext{font-size:17px;font-weight:700;line-height:1.35;margin:4px 0 10px}
#dec .mg .hints{font-size:15px;line-height:1.4;background:#16223f;border-radius:10px;padding:8px 10px;margin-bottom:6px}
#dec .mg .opts,#dec .mg .bets .opts{display:flex;flex-direction:column;gap:7px}
#dec .mg .two,#dec .mg .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#dec .mg .cards{grid-template-columns:1fr 1fr 1fr}
#dec .mg .cards .opt{text-align:center;padding:14px 4px;font-size:14px}
#dec .mg .two .opt{text-align:center;font-size:17px;padding:16px 6px}
#dec .mg .opt .ic{display:block;font-size:26px;margin-bottom:3px}
#dec .mg .opt.mine{outline:2px solid var(--gold);background:#1e3a8a}
#dec .mg .who{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
#dec .mg .goal3{display:grid;grid-template-columns:1fr 1fr 1fr;border:5px solid #f8fafc;border-bottom:0;border-radius:6px 6px 0 0;
  background:repeating-linear-gradient(45deg,#ffffff14 0 2px,transparent 2px 10px),repeating-linear-gradient(-45deg,#ffffff14 0 2px,transparent 2px 10px),#0b3d1d;
  min-height:96px;margin:6px 0 2px}
#dec .mg .goal3 .opt{background:transparent;border:0;border-right:1px dashed #ffffff33;border-radius:0;text-align:center;color:#fff;font-size:13px}
#dec .mg .goal3 .opt:last-child{border-right:0}
#dec .mg .goal3 .opt.mine{background:#facc1533;outline:0}
#dec .mg .goal3 .cell{display:flex;align-items:center;justify-content:center;gap:4px;font-size:30px;border-right:1px dashed #ffffff33}
#dec .mg .goal3 .cell:last-child{border-right:0}
#dec .mg .goal3 .ball{animation:shot .5s ease-out}
@keyframes shot{from{transform:translateY(70px) scale(.6);opacity:.4}to{transform:none;opacity:1}}
#dec .mg .duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-size:18px;font-weight:800;margin:6px 0}
#dec .mg .duel div{background:#16223f;border-radius:12px;padding:10px 4px}
#dec .mg .duel div.won{outline:2px solid var(--gold);background:#1e3a8a}
#dec .mg .duel small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-bottom:3px}
#dec .mg .series{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:15px}
#dec .mg .series small{color:var(--muted);display:inline-block;min-width:90px;font-size:12px}
#dec .mg .bets{margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
#dec .mg .bets .opt small{display:inline;color:var(--gold);font-weight:700}
#pen{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;background:#02050f}
#pen.on{display:block}
#pen iframe{border:0;width:100%;height:100%;display:block}
#pen .wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;pointer-events:none}
</style>
</head>
<body>
<div id="top">
  <div class="teams">
    <div class="tm home"><i class="kit" id="k0"></i><span class="nm" id="n0">Хозяева</span></div>
    <div id="score">0:0</div>
    <div class="tm away"><span class="nm" id="n1">Гости</span><i class="kit" id="k1"></i></div>
  </div>
  <div id="clockrow"><span id="clock">0'</span><span id="period">до свистка</span></div>
  <div id="bar"><div id="fill"></div><i></i></div>
  <div id="stats"></div>
  <div id="status"></div>
</div>
<div id="pitchwrap"><canvas id="c"></canvas><div id="label"></div><div id="flash"><b>ГОЛ!</b><span></span></div>
  <button id="mute" type="button" aria-label="Звук">🔊</button><button id="cam" type="button" aria-label="Камера">🎥</button><div id="note"></div></div>
<div id="feed"></div>
<div id="dec"></div>
<div id="pen"><div class="wait">🥅 Пенальти…</div></div>
<script>
'use strict';
/* Живой матч — зритель. Всё считает бот: страница получает состояние и события минуты и только показывает их.
   Поле вертикальное: хозяева (команда 0) внизу и атакуют вверх, гости (1) — сверху вниз. */
const W = 600, H = 840, M = 26;                       // логические размеры поля и отступ до линий
const TG = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => { t = clamp(t, 0, 1); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

/* ---------------- координаты ---------------- */
// depth: 0 — своя линия ворот, 1 — чужая; xf: 0…1 слева направо
function at(t, depth, xf) {
  const x = M + xf * (W - 2 * M);
  const y = t === 0 ? H - M - depth * (H - 2 * M) : M + depth * (H - 2 * M);
  return {x, y};
}
const goalOf = t => ({x: W / 2, y: t === 0 ? M : H - M});        // ворота, которые атакует команда t
const CENTER = {x: W / 2, y: H / 2};

/* ---------------- состояние ---------------- */
let S = null;                // последнее состояние от бота
let shown = null;            // что показано на табло (счёт и статистика догоняют анимацию)
const players = {};          // "t:slot" -> фигурка {t, s, n, nm, gk, x, y, tx, ty, ...}
const ball = {x: CENTER.x, y: CENTER.y, h: 0, fx: CENTER.x, fy: CENTER.y, tx: CENTER.x, ty: CENTER.y, t0: 0, d: 1, arc: 0};
let poss = 0;                // кто сейчас с мячом (для «фона» игры)
let queue = [], step = null, stepEnd = 0, nextIdle = 0;
let fx = [];                 // частицы: конфетти, дым, пыль
let cards = [];              // карточки над игроками
let focus = {};              // "t:slot" -> {x, y} — куда бежит участник эпизода
let crowd = null;            // {t, kind} — команда сбегается (угловой, гол, потасовка)
let downed = null, stopped = false, fan = null, pyro = null;
let lastSeq = -1;

function key(t, s) { return t + ':' + s; }
function gkColor(t) {
  const pal = ['#f97316', '#a855f7', '#06b6d4', '#ec4899', '#84cc16', '#e11d48'];
  const used = S ? S.teams.map(x => x.shirt) : [];
  const ok = pal.filter(c => !used.some(u => dist(c, u) < 120));
  return (ok[t] || ok[0] || pal[t]);
}
function dist(a, b) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]);
}
function ink(hex) {                     // цвет номера: тёмный на светлой футболке
  const [r, gg, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return (r * 299 + gg * 587 + b * 114) / 1000 > 150 ? '#111' : '#fff';
}

// базовые места по схеме: вратарь, защитники, нападающие; команда с мячом выдвигается вперёд
function base(t, role, i, n) {
  const spread = n === 1 ? [.5] : n === 2 ? [.3, .7] : [.2, .5, .8];
  if (role === 'gk') return {depth: .035, xf: .5};
  const xf = spread[i] !== undefined ? spread[i] : .5;
  return role === 'def' ? {depth: .2, xf} : role === 'mid' ? {depth: .33, xf} : {depth: .46, xf};
}
function syncLineup() {
  if (!S) return;
  const seen = new Set();
  S.teams.forEach((tm, t) => {
    const list = [['gk', [tm.gk]], ['def', tm.def], ['mid', tm.mid || []], ['att', tm.att]];
    for (const [role, arr] of list) arr.forEach((p, i) => {
      const k = key(t, p.s); seen.add(k);
      const b = base(t, role, i, arr.length);
      let f = players[k];
      if (!f) { const st = at(t, b.depth, b.xf); f = players[k] = {t, s: p.s, x: st.x, y: st.y}; }
      Object.assign(f, {n: p.n, nm: p.nm, y_: p.y, c: p.c, gk: role === 'gk', role, b, sp: p.sp || 20, pw: p.pw === undefined ? 100 : p.pw});
    });
  });
  for (const k of Object.keys(players)) if (!seen.has(k)) delete players[k];
}
function teamPlayers(t, field) { return Object.values(players).filter(p => p.t === t && (!field || !p.gk)); }
function P(t, s) { return players[key(t, s)]; }

/* ---------------- табло и лента ---------------- */
function renderBoard() {
  if (!S) return;
  const sh = shown || S;
  S.teams.forEach((tm, t) => { $('n' + t).textContent = tm.name; $('k' + t).style.background = tm.shirt; });
  $('score').textContent = sh.teams[0].score + ':' + sh.teams[1].score;
  const mnt = sh.minute !== undefined ? sh.minute : S.minute, half = S.half;   // минута того, что сейчас на поле
  $('clock').textContent = S.phase === 'final' ? 'Финал' : (S.phase === 'pre' || mnt === 0) ? "0'" : mnt + "'";
  $('period').textContent = S.phase === 'final' ? '🏁 матч окончен' : S.phase === 'pre' ? 'до стартового свистка'
    : S.phase === 'half' ? '☕ перерыв' : mnt <= half ? '1-й тайм' : '2-й тайм';
  $('fill').style.width = (100 * Math.min(mnt, S.full) / S.full) + '%';
  const a = sh.teams[0], b = sh.teams[1];
  $('stats').textContent = `Удары ${a.shots} (${a.on}) — ${b.shots} (${b.on}) · Угловые ${a.corners} — ${b.corners} · Владение ${a.poss}% — ${b.poss}%`;
  renderStatus();
}
let statusUntil = 0;
function renderStatus() {
  if (!S) return;
  const left = S.left !== undefined ? Math.max(0, Math.ceil((statusUntil - performance.now()) / 1000)) : null;
  const sec = left !== null ? ` · ${left} сек` : '';
  const names = S.teams.map(x => '«' + x.name + '»');
  let txt = '';
  if (stopped) txt = '⏸ Матч остановлен — часы стоят';
  else if (S.phase === 'pre') txt = '🧭 Менеджеры дают установку' + sec;
  else if (S.phase === 'window') txt = (S.who && S.who.length === 1 ? `⏸ Решает менеджер ${names[S.who[0]]}` : '⏸ Окно решений — часы стоят') + sec;
  else if (S.phase === 'half') txt = '☕ Перерыв: замены и тактика' + sec;
  else if (S.phase === 'pen') txt = `🥅 Пенальти в ворота ${names[1 - (S.pen || 0)]}` + sec;
  else if (S.phase === 'final') txt = '🏁 Финальный свисток';
  else {
    const r = S.teams.map((x, t) => x.rush ? `💥 ${names[t]} штурмует` : '').filter(Boolean);
    txt = r.join(' · ');
  }
  $('status').textContent = txt;
}
const feedEl = $('feed');
function addFeed(items, fresh) {
  // событие и реплика комментатора к нему — один блок (реплика под событием); блоки — свежим сверху
  const blocks = [];
  for (const it of items) {
    if (it.c && blocks.length && !blocks[blocks.length - 1].closed) { blocks[blocks.length - 1].items.push(it); blocks[blocks.length - 1].closed = true; }
    else blocks.push({items: [it], closed: !!it.c});
  }
  for (const b of blocks) {
    const box = document.createElement('div');
    for (const it of b.items) {
      const d = document.createElement('div');
      const isGoal = it.t && /⚽/.test(it.t);
      d.className = 'it' + (it.c ? ' c' : '') + (isGoal ? ' goal' : '') + (fresh ? ' new' : '');
      if (b.items.length > 1 && it.t) d.style.borderBottom = '0';
      d.textContent = it.c ? '🎙 ' + it.c : it.t;
      box.appendChild(d);
    }
    feedEl.insertBefore(box, feedEl.firstChild);
  }
  while (feedEl.children.length > 60) feedEl.removeChild(feedEl.lastChild);
}
function note(text) { const n = $('note'); n.textContent = text || ''; n.classList.toggle('on', !!text); }

/* ---------------- звук и вибрация ---------------- */
let actx = null, muted = false;
try { muted = localStorage.getItem('fm_mute') === '1'; } catch (e) {}
$('mute').textContent = muted ? '🔇' : '🔊';
$('cam').onclick = () => {
  camMode = {auto: 'wide', wide: 'follow', follow: 'auto'}[camMode] || 'auto'; camOn = camMode === 'auto'; shotCam = null; baseShot = null;
  $('cam').classList.toggle('off', camMode === 'wide'); try { localStorage.setItem('fm_cam2', camMode); } catch (e) {} label(CAM_MODES[camMode]);

function onMg(m) {

function renderQ(box, m) {

function optBtn(label, i, q, m) {

function renderReveal(box, m) {

  if (m.kind === 'guess' && r.got) box.appendChild(el('div', 'sub', names.map((n, t) => `«${esc(n)}»: ${r.got[t] ? '+' + r.got[t] : 'не угадал'}`).join(' · ')));

function series(sr, names) {

function renderBets(box) {

/* ---------------- подключение к комнате матча ---------------- */
const Q = new URLSearchParams(location.search);
const ROOM = Q.get('room');
const DUEL_WS = 'wss://football-duel.pinkovskyi2508.workers.dev';   // сервер комнат (worker/), только он
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
// адрес сервера и подпись из ссылки — только при проверке на своём компьютере: иначе чужая ссылка увела бы подпись на чужой сервер
const WS_BASE = LOCAL && Q.get('ws') ? Q.get('ws') : DUEL_WS;
const INIT = (TG && TG.initData) || (LOCAL ? Q.get('init') || '' : '');
let ws = null, retry = 0, ended = false;
function connect() {
  note(S ? 'Переподключаемся…' : 'Подключаемся к матчу…');
  ws = new WebSocket(WS_BASE.replace(/^http/, 'ws') + '/rooms/' + encodeURIComponent(ROOM) + '/player');
  ws.onopen = () => { ws.send(JSON.stringify({type: 'hello', initData: INIT}));
    if (!seen) ws.send(JSON.stringify({type: 'act', act: {a: 'seen', on: false}})); };
  clearInterval(connect.ping);           // молчащее соединение Cloudflare закрывает (~100 сек) — пингуем
  connect.ping = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 30000);
  ws.onmessage = e => {
    if (e.data === 'pong') return;
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    retry = 0;
    if (m.type === 'state') onState(m);
    else if (m.type === 'mine') onMine(m);
    else if (m.type === 'chant') onChantMsg(m);
    else if (m.type === 'pen') onPen(m);
    else if (m.type === 'mg') onMg(m);
    else if (m.type === 'bets') onBets(m);
    else if (m.type === 'ack') onAck(m);
    else if (m.type === 'tick') { onTick(m); note(''); }
    else if (m.type === 'bot_left') note('Бот переподключается — матч продолжится, подождите…');
  };
  ws.onclose = e => {
    if (e.code === 4003) { ended = true; note('Этот матч смотрят только его менеджеры.'); return; }
    if (e.code === 4001) { ended = true; note(S && S.phase === 'final' ? 'Матч окончен. Итог — в чате.' : 'Трансляция закрыта. Матч — в чате.'); return; }
    if (ended) return;
    retry++;
    note('Связь потеряна — переподключаемся…');
    setTimeout(connect, Math.min(10000, 1500 * retry));
  };
}

/* ---------------- ДЕМО без бота: случайный матч, чтобы посмотреть сцену ---------------- */
function demo() {
  const mk = (name, shirt, shorts, form, base) => {
    const [d, mm, a] = form.split('-').map(Number), p = i => ({s: i, n: [1, 4, 5, 6, 8, 10, 9][i - 1], nm: name.slice(0, 3) + ' ' + base[i - 1], y: 0, c: i === 2});
    const f = [2, 3, 4, 5, 6, 7];
    return {name, score: 0, shirt, shorts, formation: form, tactic: 'Баланс', rush: false, gk: p(1),
            def: f.slice(0, d).map(p), mid: f.slice(d, d + mm).map(p), att: f.slice(d + mm, d + mm + a).map(p), off: [], shots: 0, on: 0, corners: 0, fouls: 0, poss: 50};
  };
  const st = {minute: 0, full: 60, half: 30, phase: 'pre', teams: [mk('Альфа', '#dc2626', '#f5f5f5', '2-2-2', ['Иванов', 'Петров', 'Сидоров', 'Козлов', 'Орлов', 'Белов', 'Носов']), mk('Бета', '#2563eb', '#202024', '3-2-1', ['Смирнов', 'Волков', 'Зайцев', 'Морозов', 'Лебедев', 'Новиков', 'Гусев'])]};
  let seq = 0;
  onState({seq: seq++, state: st, feed: [{m: 0, c: 'Демо: соперники и события случайные — так сцена выглядит в матче.'}]});
  const kinds = ['goal', 'save', 'miss', 'corner', 'fk', 'foul', 'card', 'tackle', 'brawl', 'pen', 'stop'];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const field = tm => [...tm.def, ...(tm.mid || []), ...tm.att];
  setInterval(() => {
    if (st.minute >= 60) return;
    st.minute++; st.phase = 'play';
    const acts = [], feed = [];
    if (st.minute === 1) acts.push({a: 'whistle', w: 'start'});
    if (Math.random() < .55) {
      const t = Math.random() < .5 ? 0 : 1, tm = st.teams[t], s = pick(field(tm)).s, k = pick(kinds);
      const nm = P(t, s) ? P(t, s).nm : '';
      if (k === 'goal' || k === 'save' || k === 'miss') {
        tm.shots++; if (k !== 'miss') tm.on++;
        if (k === 'goal') tm.score++;
        acts.push({a: k, t, s, how: 'удар', score: [st.teams[0].score, st.teams[1].score]});
        feed.push({m: st.minute, t: `${st.minute}' ` + (k === 'goal' ? `⚽ ГОЛ! ${nm} — ${st.teams[0].score}:${st.teams[1].score}` : k === 'save' ? `🧤 Вратарь отбивает удар ${nm}` : `💨 ${nm} — мимо`)});
      } else if (k === 'corner') { tm.corners++; acts.push({a: 'corner', t}, {a: 'clear', t}); feed.push({m: st.minute, t: `${st.minute}' 🚩 Угловой! → 🧱 защита выносит мяч`}); }
      else if (k === 'fk') { acts.push({a: 'fk', t}, {a: 'miss', t, s, how: 'штрафной'}); feed.push({m: st.minute, t: `${st.minute}' 🎯 Опасный штрафной! → мимо`}); }
      else if (k === 'foul' || k === 'card') { const v = pick(field(st.teams[1 - t])).s; acts.push({a: 'foul', t, s, v}); if (k === 'card') acts.push({a: 'card', c: 'yellow', t, s}); feed.push({m: st.minute, t: `${st.minute}' 🛑 Фол` + (k === 'card' ? ' → 🟨 Жёлтая карточка: ' + nm : '')}); }
      else if (k === 'tackle') acts.push({a: 'tackle', t, s});
      else if (k === 'brawl') { const o = pick(field(st.teams[1 - t])).s; acts.push({a: 'brawl', lvl: pick(['scuffle', 'fight', 'mass']), t, s, ot: 1 - t, os: o}); feed.push({m: st.minute, t: `${st.minute}' 🥊 Стычка!`}); }
      else if (k === 'pen' && Q.get('pen') !== '0' && !(pen && pen.open)) { demoPen(t); return; }
      else if (k === 'pen') { const scored = Math.random() < .7; if (scored) tm.score++; acts.push({a: 'pen', t}, {a: scored ? 'goal' : 'save', t, s, how: 'пенальти', score: [st.teams[0].score, st.teams[1].score]}); feed.push({m: st.minute, t: `${st.minute}' 🥅❗ ПЕНАЛЬТИ!`}); }
      else if (k === 'stop') { acts.push({a: 'stop', what: pick(['fan', 'pyro'])}, {a: 'resume'}); feed.push({m: st.minute, t: `${st.minute}' 🚨 Матч остановлен`}); }
      if (Math.random() < .5) feed.push({m: st.minute, c: pick(['Красиво, но бесполезно — как зонтик в метро.', 'Тренер на бровке жуёт жвачку с яростью философа.', 'Мяч круглый, а вот идеи у команды — квадратные.'])});
    }
    if (st.minute === 30) { acts.push({a: 'whistle', w: 'half'}); }
    if (st.minute === 60) { acts.push({a: 'whistle', w: 'end'}); st.phase = 'final'; }
    const tot = st.teams[0].shots + st.teams[1].shots || 1;
    st.teams[0].poss = Math.round(100 * (st.teams[0].shots + 1) / (tot + 2)); st.teams[1].poss = 100 - st.teams[0].poss;
    onTick({seq: seq++, state: JSON.parse(JSON.stringify(st)), acts, feed});
  }, Number(Q.get('tick')) || 4000);
}

function demoPen(t) {
  const tm = S.teams[t], o = S.teams[1 - t], kp = tm.att[0] || tm.def[0];
  onPen({type: 'pen', open: true, wid: ++demoWid, kind: 'penalty', role: t === 0 ? 'kick' : 'keep', left: 15, picked: null,
         kicker: {num: kp.n, name: kp.nm, stat: 'Удар 30', shirt: tm.shirt, shorts: tm.shorts},
         keeper: {num: o.gk.n, name: o.gk.nm, stat: 'Вратарство 28', shirt: gkColor(1 - t)}});
  demoPen.t = t; demoPen.timer = setTimeout(() => demoAct({a: 'pen', v: null}), 15000);
}
function demoAct(a) {
  if (a.a === 'mg') { demoMgAnswer(a.i); return; }
  if (a.a === 'bet') { if (bets) { bets = {...bets, mine: a.i}; renderDec(); } return; }
  if (a.a !== 'pen' || !pen || !pen.open) return;
  clearTimeout(demoPen.timer);
  const role = pen.role, v = a.v;
  if (v !== null) toFrame({type: 'picked', value: v});
  const aim = role === 'kick' && v !== null ? v : Math.floor(Math.random() * 6), dive = role === 'keep' && v !== null ? v : Math.floor(Math.random() * 3);
  const outcome = Math.random() < .08 ? 'miss' : aim % 3 === dive && Math.random() < .5 ? 'save' : 'goal';
  setTimeout(() => {
    onPen({type: 'pen', open: false});
    onPen({type: 'pen', open: false, result: {aim, dive, outcome, text: outcome === 'goal' ? 'Вратарь прыгнул в другую сторону' : outcome === 'save' ? 'Вратарь угадал угол!' : 'Мимо!'}});
    const t = demoPen.t, tm = S.teams[t];
    if (outcome === 'goal') tm.score++;
    onTick({seq: Date.now(), state: JSON.parse(JSON.stringify(S)), acts: [{a: 'pen', t}, {a: outcome, t, s: (tm.att[0] || tm.def[0]).s, how: 'пенальти', score: [S.teams[0].score, S.teams[1].score]}], feed: [{m: S.minute, t: `${S.minute}' 🥅 Пенальти: ` + outcome}]});
  }, 700);
}

addEventListener('resize', fit); fit();
if (TG) { try { TG.ready(); TG.expand(); TG.disableVerticalSwipes && TG.disableVerticalSwipes();
  TG.setHeaderColor && TG.setHeaderColor('#0d1730'); TG.setBackgroundColor && TG.setBackgroundColor('#050a18');
  TG.onEvent && TG.onEvent('viewportChanged', fit); } catch (e) {} }
requestAnimationFrame(frame);
if (ROOM) connect(); else { demo(); if (Q.get('mg')) setTimeout(() => demoMg(Q.get('mg')), 800); }
</script>
